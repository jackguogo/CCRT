            <template #footer>
              <el-button @click="libEdit.show = false">取消</el-button>
              <el-button type="primary" :loading="libEdit.saving" @click="saveLib">保存方案</el-button>
            </template>
          </el-dialog>
        </div>

        <!-- ---------- 训练方案 ---------- -->
        <div v-else-if="view === 'prescribe' && reco">
          <div class="lb-pagehead">
            <div><div class="ph-t">训练方案 · {{ cur.name }}</div>
              <div class="ph-d">{{ cur.sex }} · {{ ageOf(cur.birth_date) }}岁 · {{ cur.education }} · 门诊号 {{ cur.outpatient_no }}</div></div>
            <div class="ph-a"><el-button @click="go('train')">返回</el-button></div>
          </div>

          <el-alert v-if="!reco.ok" type="warning" :closable="false" :title="reco.message" show-icon />
          <div v-else style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
            <!-- 左：患者评估结果（与评估报告同一套渲染） -->
            <div style="display:flex;flex-direction:column;gap:14px">
              <div class="lb-card" style="margin:0;display:flex;flex-direction:column">
                <div class="head"><div class="t">认知域画像 <span class="sub">DSM-5 六域</span><el-tooltip content="认知域画像根据评估结果进行归一化计算绘制，用于认知域整体情况的分析参考。" placement="top"><span class="q-mark">?</span></el-tooltip></div></div>
                <domain-profile :model="prRadarModel" :doms="prDomains" />
              </div>

              <div class="lb-card" style="margin:0">
                <div class="head"><div class="t">评估项目结果 <span class="sub">最近一次已完成评估{{ reco.at ? ' · ' + reco.at : '' }}</span></div></div>
                <project-result :chart="reco.chart || []" />
              </div>
            </div>

            <!-- 右：系统推荐与方案清单 -->
            <div style="display:flex;flex-direction:column;gap:14px">
              <div class="lb-card" style="margin:0">
                <div class="head"><div class="t">系统推荐训练方案 <span class="sub">按各认知域受损程度匹配</span></div></div>
                <el-table :data="reco.plans" size="small" max-height="300" empty-text="暂无推荐">
                  <el-table-column prop="domain" label="认知域" min-width="110" align="center" />
                  <el-table-column prop="program" label="方案" min-width="88" align="center" />
                  <el-table-column prop="name" label="名称" min-width="100" align="center" />
                  <el-table-column prop="start" label="建议起始关" min-width="96" align="center" />
                  <el-table-column label="操作" width="72" align="center"><template #default="s"><el-button size="small" text type="primary" :disabled="!!prPlanId" @click="addPlan(s.row)">加入</el-button></template></el-table-column>
                </el-table>
              </div>

              <div class="lb-card" style="margin:0">
                <div class="head"><div class="t">训练方案生成</div>
                  <div style="display:flex;align-items:center;gap:8px">
                    <el-button v-if="activePlan" size="small" type="warning" plain @click="stopActivePlan">终止方案</el-button>
                    <el-button size="small" :disabled="!!prPlanId" @click="openTrainPick"><el-icon style="margin-right:4px"><Plus /></el-icon>手动添加</el-button>
                  </div>
                </div>
                <div v-if="activePlan" style="margin:-6px 0 10px;display:flex;align-items:center;gap:8px">
                  <span class="st-chip run">生成时间 {{ (activePlan.pushed_at || activePlan.created_at || "").slice(0, 16) }} · 已锁定</span>
                </div>
                <el-table :data="basket" size="small" max-height="300" empty-text="尚未加入方案，可从上方推荐「加入」或「手动添加」">
                  <el-table-column type="index" label="序号" width="60" align="center" />
                  <el-table-column prop="domain" label="认知域" min-width="100" align="center" />
                  <el-table-column prop="program" label="方案" min-width="90" align="center" />
                  <el-table-column prop="name" label="名称" min-width="110" align="center" />
                  <el-table-column label="起始关" min-width="104" align="center"><template #default="s"><el-input-number v-model="s.row.startLevel" :min="1" :max="10" size="small" style="width:96px" :disabled="!!prPlanId" /></template></el-table-column>
                  <el-table-column label="操作" width="70" align="center"><template #default="s"><el-button size="small" text type="danger" :disabled="!!prPlanId" @click="removeBasket(s.row)">移除</el-button></template></el-table-column>
                </el-table>
                <el-form label-width="86px" style="margin-top:14px">
                  <el-row :gutter="10">
                    <el-col :span="12"><el-form-item label="训练项">
                      <el-select :model-value="prForm.items" style="width:100%" :disabled="!!prPlanId" @change="applyTrainItems">
                        <el-option v-for="n in trainItemOptions" :key="n" :value="n" :label="n + ' 项'" />
                      </el-select>
                    </el-form-item></el-col>
                    <el-col :span="12"><el-form-item label="单次时长"><el-select v-model="prForm.minutes" style="width:100%" :disabled="!!prPlanId"><el-option :value="20" label="20 分钟" /><el-option :value="30" label="30 分钟" /></el-select></el-form-item></el-col>
                    <el-col :span="12"><el-form-item label="每周频次"><el-select v-model="prForm.freq" style="width:100%" :disabled="!!prPlanId"><el-option v-for="n in [3,4,5]" :key="n" :value="n" :label="n + ' 次'" /></el-select></el-form-item></el-col>
                    <el-col :span="12"><el-form-item label="疗程"><el-select v-model="prForm.weeks" style="width:100%" :disabled="!!prPlanId"><el-option v-for="n in [8,10,12]" :key="n" :value="n" :label="n + ' 周'" /></el-select></el-form-item></el-col>
                    <el-col :span="12"><el-form-item label="难度策略"><el-switch v-model="prForm.locked" active-text="锁定" inactive-text="自适应" :disabled="!!prPlanId" /></el-form-item></el-col>
                  </el-row>
                </el-form>
                <div style="display:flex;gap:10px">
                  <el-button type="primary" style="flex:1" :loading="prSaving" :disabled="!!prPlanId" @click="savePlan">{{ prPlanId ? "方案进行中" : "生成训练方案" }}</el-button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- ---------- 数据记录（评估 / 训练 / 依从性 / 训练效果） ---------- -->
        <div v-else-if="view === 'records'">
          <!-- 患者：可搜索更多患者，选中后展示基础信息 -->
          <div class="lb-card rec-pick">
            <div class="rp-left">
              <template v-if="recPatient">
                <span class="rp-name">{{ recPatient.name }}</span>
                <span class="rp-no mono">{{ rec ? rec.patient.outpatient_no : "" }}</span>
              </template>
              <span v-else class="rp-no">未选择</span>
            </div>
            <div class="rp-mid" v-if="rec">
              <span class="dom-tag">{{ rec.patient.sex }} · {{ rec.patient.age }}岁</span>
              <span class="dom-tag">{{ rec.patient.education }}</span>
              <span class="dom-tag">{{ rec.patient.dept }}</span>
              <span class="dom-tag">建档 {{ (rec.patient.created_at || "").slice(0, 10) || "—" }}</span>
            </div>
            <div v-else class="rp-mid"></div>
            <el-button @click="openRecPick">选择患者</el-button>
            <el-button @click="loadRecords" :loading="recLoading">刷新</el-button>
          </div>

          <template v-if="rec">
            <!-- 四个数据块：点击切换下方内容 -->
            <div class="rec-blocks">
              <div class="rec-blk" :class="{ on: recBlock === 'assess' }" @click="recBlock = 'assess'">
                <div class="rb-k"><i class="dot"></i>评估记录</div>
                <div class="rb-v">{{ rec.assess.length }}<small>次</small></div>
              </div>
              <div class="rec-blk blue" :class="{ on: recBlock === 'train' }" @click="recBlock = 'train'">
                <div class="rb-k"><i class="dot"></i>训练记录</div>
                <div class="rb-v">{{ rec.summary.sessions }}<small>次</small></div>
              </div>
              <div class="rec-blk ok" :class="{ on: recBlock === 'adhere' }" @click="recBlock = 'adhere'">
                <div class="rb-k"><i class="dot"></i>依从性</div>
                <div class="rb-v">{{ recAdhStats ? recAdhStats.rate : 0 }}<small>% 完成率</small></div>
              </div>
              <div class="rec-blk warn" :class="{ on: recBlock === 'review' }" @click="recBlock = 'review'">
                <div class="rb-k"><i class="dot"></i>训练效果</div>
                <div class="rb-v" v-if="recReview">{{ recReview.avg == null ? "—" : (recReview.avg > 0 ? "+" : "") + recReview.avg }}<small v-if="recReview.avg != null">分</small></div>
                <div class="rb-v" v-else>—</div>
              </div>
            </div>

            <!-- ========== 评估记录：历次评估 + 切换查看报告 ========== -->
            <div class="lb-card rec-pane" v-show="recBlock === 'assess'">
              <div class="mini-h">历次评估</div>
              <div class="rec-assess-list">
                <div v-for="(a, i) in rec.assess" :key="a.id" class="ra-row"
                     :class="{ on: a.id === recAssessId, pending: !a.report_id }" @click="pickAssess(a)">
                  <div class="ra-idx">{{ rec.assess.length - i }}</div>
                  <div class="ra-main">
                    <div class="ra-t">
                      <span class="ra-plan">{{ a.plan_name }}</span>
                      <el-tag size="small" :type="a.status === '已完成' ? 'success' : 'warning'" effect="light">{{ a.status }}</el-tag>
                    </div>
                    <div class="ra-s">
                      <span class="mono">{{ (a.started_at || "").slice(0, 16) }}</span>
                      <span class="ra-sep">·</span>
                      <span class="mono">{{ a.report_no || "报告待生成" }}</span>
                    </div>
                  </div>
                  <div class="ra-prog">
                    <div class="ra-prog-t">项目完成 <b class="mono">{{ a.done }}/{{ a.total }}</b></div>
                    <el-progress :percentage="a.total ? Math.round(a.done / a.total * 100) : 0" :stroke-width="6" :show-text="false" />
                  </div>
                  <i class="ra-chev"></i>
                </div>
              </div>

              <template v-if="recRep">
                <div class="rec-rep-hd">
                  <div class="mini-h">第 {{ recAssessIdx }} 次评估报告 <span>{{ recRep.report_no }} · {{ recRep.created_at }}</span></div>
                </div>
                <div class="rec-rep-grid">
                  <div><project-result :chart="recRep.chart || []" /></div>
                  <div><domain-profile :model="recRepRadar" :doms="recRepDoms" /></div>
                </div>
              </template>
              <el-empty v-else :description="recAssessCur && !recAssessCur.report_id ? '该次评估尚未生成报告，评分提交后自动生成' : '暂无评估报告'" :image-size="70" />
            </div>

            <!-- ========== 训练记录：历次训练方案 + 成绩/认知域/完成情况/明细 ========== -->
            <div class="lb-card rec-pane" v-show="recBlock === 'train'">
              <div class="mini-h">历次训练方案</div>
              <div class="pchip-row">
                <div class="pchip" v-for="(p, i) in rec.plans" :key="p.id" :class="{ on: p.id === recPlanId }" @click="pickPlan(p)">
                  <div class="ra-idx">{{ rec.plans.length - i }}</div>
                  <div class="pc-b">
                    <div class="pc-t">
                      <span class="st-chip" :class="stClass(p.status)">{{ p.status }}</span>
                      <span class="pc-n">{{ p.itemsCount }} 项 · {{ p.minutes }} 分钟</span>
                    </div>
                    <div class="pc-m">{{ p.freq }} 次/周 × {{ p.weeks }} 周 · {{ (p.startAt || "").slice(5) }} 起 · {{ p.doneSessions }}/{{ p.expectSessions }} 次</div>
                  </div>
                </div>
                <div v-if="!rec.plans.length" class="st-none" style="padding:8px 0">暂无训练方案</div>

                <el-radio-button value="domain">训练认知域</el-radio-button>
                <el-radio-button value="progress">训练完成情况</el-radio-button>

                  <div ref="recLine" style="height:270px"></div>

                <el-empty v-else description="该方案暂无训练记录" :image-size="70" />
              </div>

              <div v-else-if="recTrainView === 'domain'">

                    <div ref="recDom" :style="{ height: Math.min(320, 70 + recPlan.domains.length * 42) + 'px' }"></div>
                  </div>
                  <div>
                    <div class="mini-h">认知域明细</div>
                    <el-table :data="recPlan.domains" size="small">
                      <el-table-column prop="domain" label="认知域" min-width="100" align="center" />
                      <el-table-column label="训练次数" min-width="80" align="center"><template #default="s"><span class="mono">{{ s.row.sessions }}</span></template></el-table-column>
                      <el-table-column label="覆盖方案" min-width="80" align="center"><template #default="s"><span class="mono">{{ s.row.programs }}</span></template></el-table-column>
                      <el-table-column label="平均正确率" min-width="90" align="center"><template #default="s"><span class="mono">{{ s.row.avgAcc }}%</span></template></el-table-column>
                      <el-table-column label="最高关卡" min-width="80" align="center"><template #default="s"><span class="mono">L{{ s.row.maxLevel }}</span></template></el-table-column>
                    </el-table>
                  </div>
                </div>
                <el-empty v-else description="该方案暂无训练记录" :image-size="70" />
              </div>

              <div v-else-if="recTrainView === 'progress'">
                <template v-if="recPlan">
                  <div class="mini-h">训练完成情况 <span>项目 / 关卡进度 / 成绩</span></div>
                  <el-table :data="recPlan.progs" size="small">
                    <el-table-column label="训练项目" min-width="110">
                      <template #default="s">
                        <span style="display:inline-flex;align-items:center;gap:7px">
                          <span class="ico-box" :style="{ background: DOMBG[s.row.domain], color: DOMFG[s.row.domain] }" v-html="hsIcon(s.row.program)"></span>
                          <span><b style="font-size:13px">{{ s.row.name }}</b><br><span class="mono" style="font-size:10.5px;color:var(--c-text-3)">{{ s.row.program }}</span></span>
                        </span>
                      </template>
                    </el-table-column>
                    <el-table-column prop="domain" label="认知域" min-width="100" align="center" />
                    <el-table-column label="关卡进度" min-width="110" align="center">
                      <template #default="s">
                        <div>
                          <el-progress :percentage="Math.round(s.row.curLevel / 10 * 100)" :stroke-width="6" :show-text="false" />
                          <span class="mono" style="display:block;margin-top:4px;font-size:11px;color:var(--c-text-3)">{{ s.row.curLevel }}/10 · 最高 {{ s.row.maxLevel }}</span>
                        </div>
                      </template>
                    </el-table-column>
                    <el-table-column label="训练次数" min-width="80" align="center"><template #default="s"><span class="mono">{{ s.row.sessions }}</span></template></el-table-column>
                    <el-table-column label="平均正确率" min-width="90" align="center">
                      <template #default="s"><span class="mono" :style="{ color: s.row.avgAcc >= 80 ? 'var(--c-success)' : 'var(--c-warning)' }">{{ s.row.avgAcc }}%</span></template>
                    </el-table-column>
                    <el-table-column label="累计用时" min-width="80" align="center"><template #default="s"><span class="mono">{{ s.row.minutes }} 分</span></template></el-table-column>
                    <el-table-column label="最近训练" min-width="100" align="center"><template #default="s"><span class="mono" style="font-size:11.5px">{{ (s.row.lastAt || "").slice(5, 16) }}</span></template></el-table-column>
                  </el-table>

                  <div class="mini-h" style="margin-top:14px">方案执行进度 <span>已完成 {{ recPlan.doneSessions }} 次 / 应训练 {{ recPlan.expectSessions }} 次</span></div>

                    <el-progress :percentage="recPlan.progress" :stroke-width="10" />
                    <div class="pe-meta">
                      <span>训练项 {{ recPlan.itemsCount }} 项</span>
                      <span>剂量 {{ recPlan.minutes }} 分钟 × {{ recPlan.freq }} 次/周 × {{ recPlan.weeks }} 周</span>

              <el-table-column prop="outpatient_no" label="门诊号" min-width="110" align="center" />
              <el-table-column prop="dept" label="科室" min-width="90" align="center" />
              <el-table-column label="评估" min-width="80" align="center"><template #default="s"><span class="num">{{ s.row.assess_done || 0 }}</span> 次</template></el-table-column>
              <el-table-column label="训练" min-width="80" align="center"><template #default="s"><span class="num">{{ s.row.train_sessions || 0 }}</span> 次</template></el-table-column>
              <el-table-column label="操作" width="84" align="center"><template #default="s">
                <el-button size="small" type="primary" @click.stop="chooseRecPatient(s.row)">查看</el-button>
              </template></el-table-column>
              <template #empty><el-empty description="未找到匹配的患者" :image-size="60" /></template>
            </el-table>
            <div class="lb-pager" style="border-top:none;padding:10px 0 0">
              <el-pagination background layout="total, prev, pager, next" :total="recPickTotal"
                             :current-page="recPick.page" :page-size="recPick.size" @current-change="v => recPick.page = v" />
            </div>
            <template #footer><el-button @click="recPick.show = false">取消</el-button></template>
          </el-dialog>

          <!-- 手动添加训练方案：按认知域筛选 / 关键字搜索 / 勾选批量加入，不受系统推荐限制 -->
          <el-dialog v-model="trainPick.show" title="添加训练方案" width="900px">
            <div style="display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
              <el-select v-model="trainPick.dom" style="width:180px" size="small">
                <el-option label="全部认知域" value="全部" />
                <el-option v-for="d in DOMS" :key="d" :label="d" :value="d" />
              </el-select>
              <el-input v-model="trainPick.q" size="small" style="width:240px" clearable placeholder="搜索方案名称或编码" />
              <span style="font-size:12px;color:var(--c-text-3)">共 {{ trainPickRows.length }} 个方案 · 当前方案 {{ basket.length }} 项（{{ TRAIN_MIN }}–{{ TRAIN_MAX }} 项）</span>
            </div>
            <el-table :data="trainPickRows" size="small" height="380" empty-text="没有匹配的训练方案"
                      @selection-change="v => trainPick.sel = v.map(x => x.code)">
              <el-table-column type="selection" width="46" align="center" :selectable="r => !basket.some(b => b.program === r.code)" />
              <el-table-column prop="domain" label="认知域" min-width="118" align="center" />
              <el-table-column prop="code" label="方案" min-width="86" align="center" />
              <el-table-column prop="name" label="名称" min-width="126" align="center" />
              <el-table-column label="训练形式" min-width="108" align="center"><template #default="s">{{ archName(s.row.archetype) }}</template></el-table-column>
              <el-table-column label="关卡" min-width="68" align="center"><template #default="s">{{ s.row.levelCount }} 关</template></el-table-column>
              <el-table-column label="状态" min-width="80" align="center"><template #default="s">
                <span v-if="basket.some(b => b.program === s.row.code)" class="st-none">已加入</span>
                <span v-else style="color:var(--c-text-3);font-size:12px">—</span>
              </template></el-table-column>
              <el-table-column label="操作" width="80" align="center"><template #default="s">
                <el-button size="small" text type="primary" :disabled="basket.some(b => b.program === s.row.code)" @click="addManual(s.row)">加入</el-button>
              </template></el-table-column>
            </el-table>
            <template #footer>
              <span style="float:left;font-size:12px;color:var(--c-text-3);line-height:32px">已勾选 {{ trainPick.sel.length }} 项</span>
              <el-button @click="trainPick.show = false">完成</el-button>
              <el-button type="primary" :disabled="!trainPick.sel.length" @click="addManualBatch">加入所选</el-button>
            </template>
          </el-dialog>

        <!-- ---------- 作废评估 ---------- -->
        <el-dialog v-model="cx.show" :title="'作废评估 · ' + cx.name" width="460px">
          <div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:14px;font-size:13px;line-height:1.7;color:var(--c-text-2)">
            <span class="tip-i" style="margin-top:2px">!</span>
            <span>作废后该次评估不再计入报告与统计。</span>
          </div>
          <el-select v-model="cx.reason" filterable allow-create default-first-option clearable
                     placeholder="选择或填写作废原因" style="width:100%">
            <el-option v-for="r in CANCEL_REASONS" :key="r" :label="r" :value="r" />
          </el-select>
          <template #footer>
            <el-button @click="cx.show = false">取消</el-button>
            <el-button type="danger" :loading="cx.saving" @click="doCancel">确认作废</el-button>
          </template>
        </el-dialog>

        <!-- ---------- 训练方案效果测试（静态训练页，本地模拟结算，不写库） ---------- -->
        <el-dialog v-model="preview.show" width="1080px" top="5vh" class="tp-dialog" destroy-on-close @closed="closePreview">
          <template #header>
            <div class="tp-dlg-hd">
              <span class="tp-ico" :class="DOMKEY[preview.domain]" v-html="hsIcon(preview.code)"></span>
              <div>
                <div class="tp-dlg-t">{{ preview.name }}</div>
                <div class="tp-dlg-c">{{ preview.code }} · {{ preview.domain }} · {{ (preview.levels || []).length }} 级难度</div>
              </div>
              <span class="tp-badge"><span v-html="hsIcon('UI-PLAY')"></span>效果测试 · 不计入训练记录</span>
            </div>
          </template>
          <div class="tp-preview" :class="DOMKEY[preview.domain]">
            <div class="tp-side">
              <div class="blk"><h4>认知域</h4><div class="val">{{ preview.domain }}</div></div>
              <div class="blk"><h4>训练范式</h4><div class="val">{{ preview.archetype || "—" }}</div></div>
              <div class="blk"><h4>方案说明</h4><div class="muted">{{ preview.desc }}</div></div>
              <div class="blk">
                <h4>难度梯度</h4>
                <div class="tp-slevels"><i v-for="(l, i) in (preview.levels || [])" :key="i" :style="{ opacity: 0.3 + i * 0.07 }"></i></div>
                <div class="tp-slevels-lb"><span>L1</span><span>L{{ (preview.levels || []).length }}</span></div>
              </div>
              <div class="blk">
                <h4>剂量建议</h4>
                <div class="dose">单次 20–30 分钟<br>每周 3–5 次<br>疗程 8–12 周</div>
              </div>
            </div>
            <div class="tp-stage">
              <iframe id="tpFrame" v-if="preview.show" :key="preview.code"
                      :src="'/train/' + preview.code + '.html?preview=1'"
                      @load="onPreviewFrame" title="训练方案效果测试"></iframe>
            </div>
          </div>
          <template #footer>
            <span class="tip" style="font-size:11.5px;color:var(--c-text-3)">效果测试 · 不计入训练记录</span>
            <el-button @click="preview.show = false">关闭</el-button>
          </template>
        </el-dialog>

        <!-- ---------- 患者登录码（家庭训练） ---------- -->
        <el-dialog v-model="tkDlg.show" title="患者登录码" width="420px">
          <div v-if="tkDlg.loading" style="text-align:center;padding:36px 0;color:var(--c-text-3);font-size:13px">加载中…</div>
          <div v-else-if="tkDlg.err" style="padding:10px 0;color:var(--c-danger);font-size:13px">{{ tkDlg.err }}</div>
          <div v-else style="text-align:center">
            <div id="tkQr" style="display:inline-block;padding:10px;background:#fff;border:1px solid var(--c-line);border-radius:10px"></div>
            <div style="margin-top:12px;font-size:13px;color:var(--c-text-2)">任务账号 <b class="mono">{{ tkDlg.account }}</b></div>
            <div style="margin-top:4px;font-size:13px;color:var(--c-text-2)">初始密码 <b class="mono">{{ tkDlg.password }}</b></div>
          </div>
          <el-alert type="info" :closable="false" style="margin-top:12px"
            title="患者用手机扫码，输入任务账号和初始密码登录" />
          <template #footer>
            <el-button @click="tkDlg.show = false">关闭</el-button>
          </template>
        </el-dialog>

        <!-- ---------- 家属代操作账号（患者详情页入口已下线；接口与弹窗暂时保留） ---------- -->
        <el-dialog v-model="famDlg.show" :title="'家属代操作 · ' + famDlg.pname" width="760px">
          <el-table :data="famDlg.rows" style="width:100%">
            <el-table-column prop="real_name" label="姓名" min-width="100" align="center" />
            <el-table-column prop="dept" label="关系" min-width="90" align="center" />
            <el-table-column prop="phone" label="手机" min-width="120" align="center" />
            <el-table-column prop="username" label="账号" min-width="150" align="center" />
            <el-table-column label="状态" min-width="80" align="center">
              <template #default="s"><el-tag size="small" :type="s.row.status ? 'success' : 'info'" effect="light">{{ s.row.status ? '启用' : '停用' }}</el-tag></template>
            </el-table-column>
            <el-table-column label="操作" width="260" align="center">
              <template #default="s">
                <el-button size="small" plain @click="toggleFamily(s.row)">{{ s.row.status ? '停用' : '启用' }}</el-button>
                <el-button size="small" plain @click="resetFamilyPwd(s.row)">重置密码</el-button>
                <el-button size="small" plain @click="removeFamily(s.row)">解除</el-button>
              </template>
            </el-table-column>
          </el-table>
          <div style="display:flex;gap:8px;margin-top:14px;align-items:center">
            <el-input v-model="famForm.real_name" placeholder="家属姓名" style="width:140px" />
            <el-input v-model="famForm.relation" placeholder="关系，如女儿" style="width:130px" />
            <el-input v-model="famForm.phone" placeholder="手机号" style="width:150px" />
            <el-button type="primary" :loading="famDlg.saving" @click="addFamily">添加</el-button>
          </div>
          <el-alert type="info" :closable="false" style="margin-top:10px"
            title="家属账号仅能操作该患者的训练任务，看不到其他患者；初始密码 hs123456，首次登录后请修改。" />
        </el-dialog>

      </el-main>
    </el-container>

    <!-- ---------- 患者施测界面（全屏，逐题作答，不显示流程/分值/评分/计分/判分） ---------- -->
    <div v-if="quiz.on && curQuizItem" class="quiz-mask" :class="{ 'quiz-examiner': isExaminer }">
      <div class="quiz-top">
        <div v-if="!isExaminer && !isParadigm" class="quiz-prog"><i :style="{ width: quizProgress + '%' }"></i></div>
        <div v-else class="qx-proj">
          <span class="qx-pj">{{ quizProjectName }}</span>
          <span class="qx-pj-n">{{ isSpan ? spanLabel : isSdmt ? sdmtLabel : isTmt ? tmtLabel : isStroop ? stLabel : "第 " + (quiz.idx + 1) + " / " + quizItems.length + " 题" }}</span>
        </div>
        <button v-if="!isExaminer && !isSpan && !isSdmt && !isTmt && !isStroop" class="quiz-tipbtn" :class="{ on: quiz.tip }" @click="quiz.tip = !quiz.tip">主试提示</button>
        <button class="quiz-sound" @click="speakCurrent" title="朗读指导语">
          <span class="qs-ic" v-html="hsIcon('UI-SOUND', 16)"></span> 再听一遍
        </button>
        <button class="quiz-sound quiz-mute" :class="{ off: !sound.on }" @click="toggleSound"
                :title="sound.on ? '关闭朗读声音' : '开启朗读声音'" :aria-pressed="sound.on">
          <span class="qs-ic" v-html="hsIcon(sound.on ? 'UI-SOUND' : 'UI-MUTE', 17)"></span>
        </button>
        <button class="quiz-quit" @click="quitQuiz" title="结束">✕</button>
      </div>

      <!-- 主试口述量表：左侧只呈现指导语，右侧为主试操作说明与逐题评分 -->
      <div v-if="isExaminer" class="qx-main">
        <div class="qx-stage">
          <div class="qx-body">
            <div class="qx-say" :class="{ 'qx-say-sm': curWordList || curNaming || curRecall || curQuizDigits.length }">{{ curQuizSay }}</div>
            <div v-if="curQuizDigits.length" class="qx-digits">
              <div class="qn-hd">
                <span class="qw-lb">数字串</span>
                <span class="qn-tip">每秒 1 个数字 · 只读一遍</span>
              </div>
              <div class="qd-row">
                <span v-for="(d, di) in curQuizDigits" :key="di">{{ d }}</span>
              </div>
            </div>
            <div v-if="curQuizUnits.length" class="qx-units">
              <ol class="qu-list">
                <li v-for="(u, ui) in curQuizUnits" :key="ui">
                  <i>{{ ui + 1 }}</i><span>{{ u }}</span>
                </li>
              </ol>
            </div>
            <div v-if="curNaming" class="qx-names">
              <div class="qn-hd">
                <span class="qw-lb">命名清单</span>
                <span class="qn-tip">共 {{ curNaming.all.length }} 项 · 请勾选命名正确的项</span>
              </div>
              <div v-for="(g, gi) in curNaming.groups" :key="gi" class="qn-group">
                <div class="qw-gt">{{ g.t }}</div>
                <div class="qn-grid">
                  <button v-for="it2 in g.items" :key="it2.k" type="button" class="qw-word"
                          :class="{ on: !!namingState.marks[it2.k] }" @click="toggleNaming(it2.k)">
                    <i class="qw-box"></i><span>{{ it2.l }}</span>
                  </button>
                </div>
              </div>
              <button v-if="namingCues.length" type="button" class="qn-cuebtn" :class="{ on: namingCueOpen }"
                      @click="namingCueOpen = !namingCueOpen">
                <span class="qn-cueic" v-html="hsIcon('UI-CHEVRON', 14)"></span>
                <span>物品线索</span>
                <i class="qn-cuesub">未作答时由主试提供，答错或仍不答即进入下一件</i>
              </button>
              <div v-if="namingCueOpen && namingCues.length" class="qn-cues">
                <div v-for="(c, ci) in namingCues" :key="ci" class="qn-cuegroup">
                  <b>{{ c.t }}</b>
                  <div v-for="it2 in c.items" :key="it2.k" class="qn-cuerow">
                    <span class="qn-cuen">{{ it2.l }}</span><span class="qn-cuet">— {{ it2.cue }}</span>
                  </div>
                </div>
              </div>
            </div>
            <div v-if="curChecklist" class="qx-checks">
              <div class="qn-hd">
                <span class="qw-lb">定向小问</span>
                <span class="qn-tip">{{ curChecklist.t }}</span>
              </div>
              <div class="qc-list" :class="{ one: curChecklist.cols === 1 }">
                <button v-for="c in curChecklist.items" :key="c.k" type="button" class="qc-item"
                        :class="{ on: !!checkState.marks[c.k] }" @click="toggleCheck(c.k)">
                  <i class="qw-box"></i>
                  <span class="qc-n">{{ c.k + 1 }}</span>
                  <span class="qc-t">{{ c.l }}</span>
                </button>
              </div>
            </div>
            <div v-if="curRecall" class="qx-recall">
              <div class="qn-hd">
                <span class="qw-lb">延迟回忆</span>
                <span class="qn-tip">勾选 = 该词自由回忆正确（{{ recallCount }} / {{ curRecall.items.length }}）</span>
              </div>
              <div class="rc-grid">
                <button v-for="it2 in curRecall.items" :key="it2.k" type="button" class="qw-word"
                        :class="{ on: !!recallState.marks[it2.k] }" @click="toggleRecall(it2.k)">
                  <i class="qw-box"></i><span>{{ it2.l }}</span>
                </button>
              </div>
              <button type="button" class="qn-cuebtn" :class="{ on: recallState.open }"
                      @click="recallState.open = !recallState.open">
                <span class="qn-cueic" v-html="hsIcon('UI-CHEVRON', 14)"></span>
                <span>线索回忆</span>
                <i class="qn-cuesub">先分类提示，仍不能回忆再给多选提示（不计分）</i>
              </button>
              <div v-if="recallState.open" class="qn-cues">
                <div v-for="it2 in curRecall.items" :key="'c' + it2.k" class="rc-cue">
                  <b>{{ it2.l }}</b>
                  <div class="rc-line"><span class="rc-k">分类提示</span><span>{{ it2.cue }}</span></div>
                  <div class="rc-line"><span class="rc-k">多选提示</span><span>{{ (it2.choices || []).join(" / ") }}</span></div>
                </div>
              </div>
            </div>
            <div v-if="curRecognize" class="qx-reco">
              <div class="qw-hd">
                <span class="qw-lb">单词辨认</span>
                <div class="qw-sets">
                  <button v-for="(s, si) in curRecognize.sets" :key="si" type="button" class="qw-set"
                          :class="{ on: recSetIdx === si }" @click="pickRecSet(si)">{{ s.name }}</button>
                </div>
              </div>
              <div class="qw-trials">
                <button v-for="(tr2, ti) in recSet.trials" :key="ti" type="button" class="qw-trial"
                        :class="{ on: recState.trial === ti }" @click="pickRecTrial(ti)">{{ tr2.t }}</button>
              </div>
              <div class="qw-grid rec-grid">
                <button v-for="w in recTrial.words" :key="w" type="button" class="qw-word"
                        :class="{ on: recHit(w), target: recShowTarget && recIsTarget(w) }" @click="toggleRec(w)">
                  <i class="qw-box"></i><span>{{ w }}</span>
                  <i v-if="recShowTarget && recIsTarget(w)" class="rec-dot" title="刚才学过的词"></i>
                </button>
              </div>
              <div class="rec-foot">
                <span class="rec-legend" v-if="recShowTarget">{{ curRecognize.legend }}</span>
                <span class="rec-legend" v-else>目标词标记已隐藏（被试读词时请保持隐藏）</span>
                <button type="button" class="rec-toggle" :class="{ on: recShowTarget }" @click="recShowTarget = !recShowTarget">
                  {{ recShowTarget ? "隐藏目标词标记" : "显示目标词标记" }}
                </button>
              </div>
            </div>
            <div v-if="curWordList" class="qx-words">
              <div class="qw-hd">
                <span class="qw-lb">词表</span>
                <div class="qw-sets">
                  <button v-for="(s, i) in curWordList.sets" :key="i" type="button" class="qw-set"
                          :class="{ on: wordState.set === i }" @click="pickWordSet(i)">{{ s.name }}</button>
                </div>
              </div>
              <div v-if="isTrialList" class="qw-trials">
                <button v-for="(g, gi) in wordSet.groups" :key="gi" type="button" class="qw-trial"
                        :class="{ on: wordTrialIdx === gi }" @click="wordState.trial = gi">{{ g.t }}</button>
              </div>
              <div v-for="gi in shownGroups" :key="gi" class="qw-group">
                <div v-if="!isTrialList" class="qw-gt">{{ wordSet.groups[gi].t }}</div>
                <div class="qw-grid">
                  <button v-for="w in wordSet.groups[gi].words" :key="w" type="button" class="qw-word"
                          :class="{ on: wordHit(gi, w) }" @click="toggleWord(gi, w)">
                    <i class="qw-box"></i><span>{{ w }}</span>
                  </button>
                </div>
              </div>
            </div>
            <div v-if="curQuizItem.figure === 'pentagons'" class="qx-fig">
              <svg viewBox="0 0 290 133" width="360" height="165">
                <polygon points="105,14 160,54 139,119 71,119 50,54" fill="none" stroke="#0f172a" stroke-width="2.4" />
                <polygon points="185,14 240,54 219,119 151,119 130,54" fill="none" stroke="#0f172a" stroke-width="2.4" />
              </svg>
            </div>
            <div v-else-if="curQuizItem.figure === 'mocaPath'" class="qx-fig moca-fig" :class="'ph-' + moca.phase">
              <svg viewBox="0 0 360 320" width="462" height="411">
                <defs>
                  <marker id="mocaArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                    <path d="M0 1L10 5L0 9z" fill="#0f172a" />
                  </marker>
                </defs>
                <line v-for="(s, i) in MOCA_SEGS" :key="'ml' + i"
                      class="moca-line" :class="mocaHinting ? 'hint' : 'real'"
                      :x1="s.x1" :y1="s.y1" :x2="s.x2" :y2="s.y2"
                      :style="{ opacity: i < moca.step ? 1 : 0 }"
                      :marker-end="mocaHinting ? 'url(#mocaArrow)' : null" />
                <g v-for="n in MOCA_PATH" :key="n.l" class="moca-node"
                   :class="{ hit: mocaHit(n.l), bad: moca.wrong === n.l }" @click="mocaClick(n.l)">
                  <circle v-if="moca.active === n.l" :cx="n.x" :cy="n.y" r="27" class="moca-halo" />
                  <circle :cx="n.x" :cy="n.y" r="20" class="moca-dot" />
                  <text :x="n.x" :y="n.y + 7" text-anchor="middle" font-size="19" font-weight="600" class="moca-tx">{{ n.l }}</text>
                </g>
                <text v-for="lb in MOCA_LABELS" :key="lb.t" :x="lb.x" :y="lb.y" text-anchor="middle" font-size="12.5" fill="#64748b">{{ lb.t }}</text>
              </svg>
              <div class="moca-ctrl">
                <button v-if="moca.phase === 'playing'" type="button" class="moca-btn" disabled>提示演示中…</button>
                <button v-else-if="moca.phase === 'ready'" type="button" class="moca-btn primary" @click="mocaStart">开 始</button>

                    <path d="M185 20 L185 140 L140 175" />
                  </g>
                </g>
                <g fill="#64748b" font-size="15" text-anchor="middle">
                  <text x="100" y="232">图 1</text>
                  <text x="299" y="232">图 2</text>
                  <text x="520" y="232">图 3</text>
                  <text x="755" y="232">图 4</text>
                </g>
              </svg>
            </div>
            <div v-else-if="curQuizItem.figure === 'cube'" class="qx-fig">
              <svg viewBox="0 0 220 200" width="260" height="236">
                <g fill="none" stroke="#0f172a" stroke-width="2.4" stroke-linejoin="round">
                  <polygon points="30,60 150,60 150,180 30,180" />
                  <polygon points="70,22 190,22 190,142 150,180 150,60 70,60" />
                  <line x1="30" y1="60" x2="70" y2="22" />
                  <line x1="150" y1="60" x2="190" y2="22" />
                </g>
              </svg>
            </div>
            <div v-if="curQuizGuide && curQuizGuide.notes" class="qx-notes">
              <button type="button" class="qn-cuebtn" :class="{ on: notesOpen }" @click="notesOpen = !notesOpen">
                <span class="qn-cueic" v-html="hsIcon('UI-CHEVRON', 14)"></span>
                <span>注意事项</span>
                <i class="qn-cuesub">{{ curQuizGuide.notes.sub || "" }}</i>
              </button>
              <div v-if="notesOpen" class="qx-notes-body">
                <ol class="notes-list">
                  <li v-for="(t, ti) in curQuizGuide.notes.items" :key="ti">{{ t }}</li>
                </ol>
                <div v-if="curQuizGuide.notes.figures" class="notes-figs">
                  <figure v-for="(f, fi) in curQuizGuide.notes.figures" :key="fi">
                    <img :src="f.src" :alt="f.cap" />
                    <figcaption>{{ f.cap }}</figcaption>
                  </figure>
                </div>
              </div>
            </div>
            <div v-if="curQuizGuide && curQuizGuide.sheet" class="qx-sheet">
              <img :src="curQuizGuide.sheet.src" :alt="curQuizGuide.sheet.cap"
                   :style="{ width: (curQuizGuide.sheet.w || 430) + 'px' }" />
              <div class="qs-cap">{{ curQuizGuide.sheet.cap }}</div>
            </div>
            <div v-if="curQuizItem.card" class="qx-card">{{ curQuizItem.card }}</div>
            <div v-if="curQuizItem.animals" class="qx-animals">
              <img v-for="a in curQuizItem.animals" :key="a" class="qx-animal"
                   :src="'/assets/moca/' + a + '.png'" :alt="a" />
            </div>
            <div v-else-if="curQuizItem.emojis" class="qx-emoji">
              <span v-for="(e, i) in curQuizItem.emojis" :key="i">{{ e }}</span>
            </div>
          </div>
        </div>
        <button v-show="!qxPanel.open" type="button" class="qx-rail" @click="qxPanel.open = true" title="展开评估要点">
          <span class="qx-rail-ic" v-html="hsIcon('UI-CHEVRON', 15)"></span>
          <span class="qx-rail-t">评估要点</span>
        </button>
        <aside class="qx-panel" v-show="qxPanel.open">
          <div class="qx-phd">
            <b>第 {{ quiz.idx + 1 }} / {{ quizItems.length }} 题</b>
            <span style="margin-left:auto">{{ curQuizItem.g }}</span>
            <button type="button" class="qx-fold" @click="qxPanel.open = false" title="收起评估要点">
              <span v-html="hsIcon('UI-CHEVRON', 15)"></span>
            </button>
          </div>
          <div v-if="curQuizGuide && curQuizGuide.o" class="qx-sec">
            <div class="qx-lb">评估操作</div>
            <div class="qx-tx">{{ curQuizGuide.o }}</div>
          </div>
          <div v-if="curQuizGuide && curQuizGuide.n" class="qx-sec">
            <div class="qx-lb">评分要点</div>
            <div class="qx-tx">{{ curQuizGuide.n }}</div>
          </div>
          <div v-if="curQuizItem.demo" class="qx-sec qx-scoring">
            <div class="qx-lb">本题评分</div>
            <div class="qx-tx">本阶段不计分，完成操作后进入下一题。</div>
          </div>
          <div v-else-if="curWordList" class="qx-sec qx-scoring">
            <div class="qx-lb qx-score-hd"><span>本题评分</span><b>{{ curQuizScoreText }}</b></div>
            <div class="qx-tx">{{ wordScoreText }}</div>
            <div v-if="!wordMarksN && curQuizScore !== null && curQuizScore !== wordScore" class="qx-tx" style="color:#b26a00">
              已保存 {{ curQuizScore }} 分；重新勾选后按勾选结果重算。
            </div>
          </div>
          <div v-else-if="curRecognize" class="qx-sec qx-scoring">
            <div class="qx-lb qx-score-hd"><span>本题评分</span><b>{{ curQuizScoreText }}</b></div>
            <div class="qx-tx">第 1 次 {{ recErrors[0] }} · 第 2 次 {{ recErrors[1] }} · 第 3 次 {{ recErrors[2] }} 项错误</div>
            <div class="qx-tx">勾选 = 被试回答「是（看过）」；错误 = 目标词漏认 + 非目标词误认，得分取三次平均（每次最多 12 分）。</div>
          </div>
          <div v-else-if="curErrTrials" class="qx-sec qx-scoring">
            <div class="qx-lb qx-score-hd"><span>本题评分</span><b>{{ curQuizScoreText }}</b></div>
            <div class="qx-tx">{{ curErrTrials.label }}</div>
            <div class="qe-errs">
              <div v-for="(v, i) in errState.v.slice(0, curErrTrials.n)" :key="i" class="qe-err">
                <span>第 {{ i + 1 }} 次</span>
                <el-input-number v-model="errState.v[i]" :min="0" :max="curErrTrials.max" :step="1"
                                 size="small" controls-position="right" style="width:104px"
                                 @change="applyErrScore" />
                <i>错误</i>
              </div>
            </div>
            <div class="qx-tx">得分 = 三次错误数的平均数（每次最多计 {{ curErrTrials.max }} 分）</div>
          </div>
          <div v-else-if="curChecklist" class="qx-sec qx-scoring">
            <div class="qx-lb qx-score-hd"><span>本题评分</span><b>{{ curQuizScoreText }}</b></div>
            <div v-if="curChecklist.mode === 'right'" class="qx-tx">回答正确 {{ checkCount }} 项 / 共 {{ curChecklist.items.length }} 项 · 得分 = 正确项数</div>
            <div v-else class="qx-tx">回答正确 {{ checkCount }} 项 · 错误 {{ checkWrong }} 项 / 共 {{ curChecklist.items.length }} 项 · 得分 = 错误项数</div>
            <div class="qx-chips">
              <button v-for="b in curQuizBands" :key="b[0]" type="button" class="qx-chip"
                      :class="{ on: curQuizScore === Number(b[0]) }" @click="setQuizScore(b[0])"
                      :title="b[1]">{{ b[0] }}</button>
            </div>
          </div>
          <div v-else-if="curNaming" class="qx-sec qx-scoring">
            <div class="qx-lb qx-score-hd"><span>本题评分</span><b>{{ curQuizScoreText }}</b></div>
            <div class="qx-tx">命名正确 {{ namingCount }} 项 · 不正确 {{ namingWrong }} 项 / 共 {{ curNaming.all.length }} 项</div>
            <div class="qx-chips">
              <button v-for="b in curQuizBands" :key="b[0]" type="button" class="qx-chip"
                      :class="{ on: curQuizScore === Number(b[0]) }" @click="setQuizScore(b[0])"
                      :title="b[1]">{{ b[0] }}</button>
            </div>
          </div>
          <div v-else class="qx-sec qx-scoring">
            <div class="qx-lb qx-score-hd"><span>本题评分</span><b>{{ curQuizScoreText }}</b></div>
            <div class="qx-bands">
              <button v-for="b in curQuizBands" :key="b[0]" type="button" class="qx-band"
                      :class="{ on: curQuizScore === Number(b[0]) }" @click="setQuizScore(b[0])">
                <i>{{ b[0] }}</i><span>{{ b[1] }}</span>
              </button>
            </div>
          </div>
        </aside>
      </div>

      <!-- 数字广度：练习 → 开始 → 正式；同长度两试均错即终止该方向 -->
      <div v-else-if="isSpan" class="qx-main">
        <div class="qx-stage">
          <div class="sp-body">
            <div class="sp-hd">
              <span class="sp-tag" :class="{ prac: spanIsPractice, bwd: spanDir === '倒背' }">{{ spanLabel }}</span>
              <span v-if="spanProgress && span.phase !== 'done'" class="sp-prog">{{ spanProgress }}</span>
            </div>

            <!-- 练习完成 → 确认开始 -->
            <template v-if="span.phase === 'ready-fwd' || span.phase === 'ready-bwd'">
              <div class="sp-say">{{ spanSay }}</div>
              <div class="sp-prac">
                <span>{{ spanDir === "顺背" ? "顺背练习" : "倒背练习" }}</span>
                <b>{{ spanDir === "顺背" ? span.practice.fwd : span.practice.bwd }}</b>
                <i>/ {{ spanDir === "顺背" ? spanPracticeFwd.length : spanPracticeBwd.length }} 试正确</i>
              </div>
              <button type="button" class="sp-big" @click="spanStartFormal">开 始</button>
              <div class="sp-hint">
                {{ spanDir === "顺背" ? "正式顺背 3–12 位，每长度 2 试" : "正式倒背 2–10 位，每长度 2 试" }}
              </div>
            </template>

            <!-- 完成 -->
            <template v-else-if="span.phase === 'done'">
              <div class="sp-done-hd">数字广度测验完成</div>
              <div class="sp-done-grid">
                <div class="sp-done-i"><span>顺背得分</span><b>{{ span.score.fwd }}</b><i>/ {{ spanMax.fwd }}</i></div>
                <div class="sp-done-i"><span>倒背得分</span><b>{{ span.score.bwd }}</b><i>/ {{ spanMax.bwd }}</i></div>
                <div class="sp-done-i main"><span>总分</span><b>{{ spanTotal }}</b><i>/ {{ spanMax.fwd + spanMax.bwd }}</i></div>
              </div>
              <div class="sp-cut">
                参考界值 &gt; {{ spanCut }} 分属正常（{{ (cur && cur.education) || "教育程度未记录" }}）·
                <b :class="{ low: spanTotal <= spanCut }">{{ spanTotal > spanCut ? "处于参考范围" : "低于参考范围" }}</b>
              </div>
              <button type="button" class="sp-big" @click="spanFinish">完成并记录</button>
            </template>

            <!-- 施测中：数字逐个念读（每秒 1 个）→ 念完隐藏 → 等位输入框 → 数字键盘 -->
            <template v-else>
              <button v-if="!span.hidden" type="button" class="sp-read start" :disabled="span.reading" @click="spanReadDigits">
                <span class="sp-read-ic" v-html="hsIcon('UI-SOUND', 15)"></span>
                {{ span.reading ? "念读中…（每秒 1 个数字）" : "开始念读（每秒 1 个数字）" }}
              </button>
              <div v-if="span.hidden" class="sp-masked">
                <span class="sp-masked-ic">···</span>
                <b>数字已念完并隐藏</b>
                <i>请让被试复述，在下方录入作答</i>
              </div>
              <div v-else class="sp-digits" :class="{ sm: spanLen >= 8, xs: spanLen >= 11 }">
                <span v-for="(d, i) in spanSeq.split('')" :key="i" :class="{ pend: i >= span.reveal }">{{ i < span.reveal ? d : "·" }}</span>
              </div>
              <div class="sp-cells">
                <span v-for="i in spanLen" :key="i" class="sp-cell"
                      :class="{ fill: span.chars.length >= i, on: span.chars.length === i - 1 }">{{ span.chars[i - 1] || "" }}</span>
              </div>
              <div class="sp-fb" :class="span.fb ? (span.fb.ok ? 'ok' : 'bad') : 'idle'">
                <template v-if="span.fb">
                  <b>{{ span.fb.ok ? "正确" : "错误" }}</b>
                  <span>正确顺序 {{ span.fb.exp.split("").join(" ") }}　被试作答 {{ (span.fb.got || "（空）").split("").join(" ") }}</span>
                </template>
                <template v-else-if="span.reading">
                  <span>正在逐位念读（每秒 1 个）… 念完数字会自动隐藏</span>
                </template>
                <template v-else-if="!span.hidden">
                  <span>请点上方「开始念读」，数字将每秒出现 1 个并朗读</span>
                </template>
                <template v-else>
                  <span>按被试复述顺序点击数字键盘，输完点「提交」（或用键盘数字键 + 回车）</span>
                </template>
              </div>
              <div class="sp-keypad">
                <button v-for="k in ['1','2','3','4','5','6','7','8','9']" :key="k" type="button" class="sp-key"
                        :disabled="!!span.fb || !span.hidden || span.reading" @click="spanPush(k)">{{ k }}</button>
                <button type="button" class="sp-key fn" :disabled="!span.hidden || span.reading" @click="spanBack">删除</button>
                <button type="button" class="sp-key" :disabled="!!span.fb || !span.hidden || span.reading" @click="spanPush('0')">0</button>
                <button type="button" class="sp-key go" :disabled="!!span.fb || !span.hidden || span.reading" @click="spanJudge">提交</button>
              </div>
            </template>
          </div>
        </div>
        <para-aside :open="qxPanel.open" @toggle="qxPanel.open = !qxPanel.open"
                    :title="spanLabel || '数字广度测验'" sub="评估要点"
                    :ops="paraOps" :points="paraPoints" :score="paraScore" />
      </div>

      <!-- 符号数字转换：KEY 固定在上方 → 练习行（即时纠错）→ 90 秒正式表 → 到时自动结算 -->
      <div v-else-if="isSdmt" class="qx-main">
        <div class="qx-stage">
          <div class="sd-body">
            <!-- KEY 照记录单：上排符号、下排对应数字，按格上下对齐 -->
            <div class="sd-key">
              <div class="sd-key-hd">KEY</div>
              <div class="sd-key-grid">
                <div v-for="k in sdmtKey" :key="'ks' + k.n" class="sd-key-c">
                  <sd-sym :k="k.n" :size="24" />
                </div>
                <div v-for="k in sdmtKey" :key="'kn' + k.n" class="sd-key-c num">{{ k.n }}</div>
              </div>
            </div>

            <!-- 测试前练习 -->
            <template v-if="sdmt.phase === 'practice'">
              <div class="sd-hd">
                <span class="sd-tag prac">测试前练习</span>
                <span class="sd-prog">已填 {{ sdmtPracFilled }} / {{ sdmtPrac.length }} 格（练习不计分）</span>
              </div>
              <div class="sd-grid prac">
                <div v-for="(ans, i) in sdmtPrac" :key="i" class="sd-cell"
                     :class="{ on: sdmt.practiceCur === i, next: sdmtPracFront === i, ok: sdmt.prac[i] && sdmtPracOk(i), bad: sdmt.prac[i] && !sdmtPracOk(i) }"
                     @click="sdmtFocusPrac(i)">
                  <sd-sym :k="ans" :size="20" />
                  <i>{{ sdmt.prac[i] || "" }}</i>
                </div>
              </div>
              <div class="sd-skip" v-if="sdmt.tip">{{ sdmt.tip }}</div>
              <div class="sd-fb" :class="{ bad: sdmt.prac[sdmt.practiceCur] && !sdmtPracOk(sdmt.practiceCur) }">
                <b v-if="sdmt.prac[sdmt.practiceCur] && !sdmtPracOk(sdmt.practiceCur)">这一格应填 {{ sdmtPrac[sdmt.practiceCur] }}，请纠正</b>
                <span v-else>示范：第 1 格填 1、第 2 格填 5、第 3 格填 2；请被试填完余下空格，填到双线处停止。</span>
              </div>
              <div class="sd-pad">
                <button v-for="d in ['1','2','3','4','5','6','7','8','9']" :key="d" type="button" class="sd-keybtn" @click="sdmtType(d)">{{ d }}</button>
                <button type="button" class="sd-keybtn fn" @click="sdmtBack">删除</button>
                <button type="button" class="sd-keybtn start" :disabled="sdmtPracFilled < sdmtPrac.length" @click="sdmtStart">
                  {{ sdmtPracFilled < sdmtPrac.length ? "练习未填完" : "开始 90 秒测试" }}
                </button>
              </div>
            </template>

            <!-- 正式作答表 -->
            <template v-else>
              <div class="sd-hd">
                <span class="sd-tag">正式作答 · 90 秒</span>
                <span class="sd-clock" :class="{ low: sdmt.left <= 10 }">{{ sdmtClock }}</span>
                <span class="sd-prog" v-if="sdmt.phase === 'running'">已填 {{ sdmtStat.filled }} / {{ sdmtCells }} 格</span>
              </div>
              <div class="sd-grid" :class="{ locked: sdmt.phase === 'done' }">
                <template v-for="(row, ri) in sdmtRows" :key="ri">
                  <div v-for="(ans, ci) in row" :key="ri + '-' + ci" class="sd-cell"
                       :class="{ on: sdmt.cur === ri * sdmtCols + ci, next: sdmtFront === ri * sdmtCols + ci, ok: sdmt.filled[ri * sdmtCols + ci] && Number(sdmt.filled[ri * sdmtCols + ci]) === ans, bad: sdmt.filled[ri * sdmtCols + ci] && Number(sdmt.filled[ri * sdmtCols + ci]) !== ans }"
                       @click="sdmtFocus(ri * sdmtCols + ci)">
                    <sd-sym :k="ans" :size="20" />
                    <i>{{ sdmt.filled[ri * sdmtCols + ci] || "" }}</i>
                  </div>
                </template>
              </div>
              <div class="sd-skip" v-if="sdmt.tip">{{ sdmt.tip }}</div>
              <div class="sd-pad" v-if="sdmt.phase === 'running'">
                <button v-for="d in ['1','2','3','4','5','6','7','8','9']" :key="d" type="button" class="sd-keybtn" @click="sdmtType(d)">{{ d }}</button>
                <button type="button" class="sd-keybtn fn" @click="sdmtBack">删除</button>
                <button type="button" class="sd-keybtn fn" @click="sdmtStop">提前结束</button>
              </div>
              <div class="sd-result" v-else>
                <div class="sd-res-i"><span>正确</span><b>{{ sdmtStat.ok }}</b><i>/ {{ sdmtMax }}</i></div>
                <div class="sd-res-i"><span>错误</span><b class="bad">{{ sdmtStat.bad }}</b><i>个</i></div>
                <div class="sd-res-i"><span>完成</span><b>{{ sdmtStat.filled }}</b><i>/ {{ sdmtCells }} 格</i></div>
                <button type="button" class="sd-done" @click="sdmtFinish">完成并记录</button>
              </div>
              <div class="sd-cut">参考：正确数 &gt; {{ sdmtCut }} 个属正常（本表 {{ sdmtCells }} 格，记录单满分 {{ sdmtMax }} 分）</div>
            </template>
          </div>
        </div>
        <para-aside :open="qxPanel.open" @toggle="qxPanel.open = !qxPanel.open"
                    :title="'符号数字转换测验 · ' + sdmtLabel" sub="评估要点"
                    :ops="paraOps" :points="paraPoints" :score="null" />
      </div>

      <!-- Stroop 色词测验：三张卡片（读字 / 读点色 / 读墨色），逐格判对错并计时 -->
      <div v-else-if="isStroop" class="qx-main">
        <div class="qx-stage">
          <div class="sk-body">
            <div class="sk-hd">
              <span class="sk-tag">{{ stLabel }}</span>
              <span class="sk-clock">{{ stClock }}</span>
              <span class="sk-prog">已读 {{ st.idx }} / {{ stCells.length }}</span>
              <span class="sk-stat">对 <b>{{ st.ok }}</b> · 错 <b class="bad">{{ st.bad }}</b></span>
              <button type="button" class="sk-gbtn" :class="{ on: st.guideOpen }" @click="st.guideOpen = !st.guideOpen">指导语</button>
            </div>

            <div v-if="st.guideOpen" class="sk-guide">{{ stGuideText }}</div>

            <!-- 准备页：只留卡片名、任务量与「准备，开始」，不再写系统判定口径的说明文字 -->
            <div v-if="st.phase === 'ready'" class="sk-ready">
              <div class="sk-ready-t">{{ stCard.name }}</div>
              <div class="sk-ready-s">{{ stCard.task }} · 共 {{ stCells.length }} 个</div>
              <button type="button" class="sk-start" @click="stStart">准备，开始</button>
            </div>

            <!-- 卡片本体：5 行 × 10 列，与纸质卡片同版式 -->
            <div v-else-if="st.phase === 'run'" class="sk-canvas">
              <div class="sk-sheet" :class="'k-' + stKind">
                <div v-for="(c, i) in stCells" :key="i" class="sk-cell"
                     :class="{ cur: st.idx === i, done: i < st.idx, bad: st.marks[i] === 0 }">
                  <span v-if="stKind === 'word'">{{ c }}</span>
                  <span v-else-if="stKind === 'dot'" class="sk-dot" :style="{ background: stInk[c] }"></span>

              </div>

                <template v-if="stKind === 'colorword'">
                  <button v-for="c in stColors" :key="c" type="button" class="sk-cbtn"

                    <span class="sk-cdot"></span><b>{{ c }}</b>
                  </button>
                  <span class="sk-pad-gap"></span>
                  <button type="button" class="sk-btn fn" @click="stUndo">撤销<em>⌫</em></button>
                  <button type="button" class="sk-btn fn" @click="stEndCard(false)">提前结束</button>
                </template>
                <template v-else>
                  <button type="button" class="sk-btn ok" @click="stMark(1)">读对<em>空格</em></button>
                  <button type="button" class="sk-btn bad" @click="stMark(0)">读错<em>X</em></button>
                  <button type="button" class="sk-btn fn" @click="stUndo">撤销<em>⌫</em></button>
                  <button type="button" class="sk-btn fn" @click="stEndCard(false)">提前结束</button>
                </template>
              </div>
              <div class="sk-tip" :class="{ bad: !!st.tip }">
                {{ st.tip || (stKind === 'colorword'
                  ? "请您尽可能快、尽可能准确地选择卡片上字的颜色，注意，请您选择字印刷的颜色，而不是字的意义。"
                  : "被试读对一个点「读对」，读错点「读错」；50 格读完自动停表。") }}
              </div>
            </div>

            <!-- 本卡结算 -->
            <div v-else class="sk-res">
              <div class="sk-res-hd">{{ stCard.name }}完成</div>
              <div class="sk-res-row">
                <div class="sk-res-i"><span>完成时间</span><b>{{ stCur.sec }}</b><i>秒</i></div>
                <div class="sk-res-i"><span>正确数</span><b>{{ stCur.ok }}</b><i>/ {{ stCells.length }}</i></div>
                <div class="sk-res-i"><span>错误数</span><b class="bad">{{ stCur.bad }}</b><i>个</i></div>
                <div v-if="stCur && stCur.semantic != null" class="sk-res-i">
                  <span>其中读成字义</span><b class="bad">{{ stCur.semantic }}</b><i>次</i>
                </div>
              </div>
              <div v-if="stCur && !stCur.completed" class="sk-res-tip">未读完（{{ stCur.read }} / {{ stCells.length }}），按已读部分记录</div>

            </div>

          </div>

                    :toggle-fn="stToggleCard" />

      <!-- 连线测试：A/B 两部分各含练习，纸质作答纸按原样呈现，点圆圈依次连线并自动计时 -->

            </div>

            <div v-if="tmt.guideOpen" class="tm-guide">{{ tmtGuideText }}</div>

            <!-- 阶段完成：本部分的完成时间与两类错误数，确认后进入下一步 -->
            <div v-if="tmt.done" class="tm-res">

              <div class="tm-res-row">
                <div class="tm-res-i"><span>完成时间</span><b>{{ tmtCur.sec }}</b><i>秒</i></div>

                <div class="tm-res-i"><span>忽略错误数</span><b class="bad">{{ tmtCur.skip }}</b><i>次</i></div>
              </div>
              <div v-if="tmtCur && !tmtCur.completed" class="tm-res-tip">
                达到 {{ tmtLimit }} 秒仍未连到终点，按记录单口径记 {{ tmtLimit }} 秒（未完成）
              </div>
              <button type="button" class="tm-next" @click="tmtNext">{{ tmtNextLabel }}</button>
            </div>

            <!-- 作答纸：节点位置与纸质记录单一致 -->
            <div v-else class="tm-canvas">
              <svg class="tm-svg" :viewBox="'0 0 ' + tmtBoard.w + ' ' + tmtBoard.h" preserveAspectRatio="xMidYMid meet">

                <polyline v-if="tmtPts" class="tm-line" :points="tmtPts" />

                      :font-size="tmtStartNode.r * 0.92">Begin</text>
                <text v-if="tmtEndNode" class="tm-lb" :x="tmtEndNode.x" :y="tmtEndNode.y - tmtEndNode.r - 10"
                      :font-size="tmtEndNode.r * 0.92">End</text>
                <g v-for="n in tmtNodes" :key="n.k" class="tm-node"
                   :class="{ done: tmt.path.includes(n.k), cur: tmt.path[tmt.path.length - 1] === n.k, next: tmtNextKey === n.k, bad: tmt.bad === n.k }"
                   @click.stop="tmtTouch(n.k)">
                  <circle class="tm-hit" :cx="n.x" :cy="n.y" :r="n.r * 1.5" />
                  <circle class="tm-cir" :cx="n.x" :cy="n.y" :r="n.r" />
                  <text class="tm-tx" :x="n.x" :y="n.y" :font-size="n.r * 1.18">{{ n.k }}</text>
                </g>
              </svg>
            </div>

            <!-- 本题评分：照记录单口径逐部分列出完成时间、连接错误数、忽略错误数 -->
            <div class="tm-score">

            <div class="tm-foot">

              <button v-if="tmtIsPrac && tmt.path.length && !tmt.done" type="button" class="tm-undo" @click="tmtUndo">撤销一步</button>
            </div>
          </div>
        </div>
        <para-aside :open="qxPanel.open" @toggle="qxPanel.open = !qxPanel.open"

/* ---- 报告与训练方案共用：量表色条 / 范式指标的取值口径 ---- */
const pctOf = (v, max) => Math.max(0, Math.min(100, (Number(v) || 0) / (Number(max) || 1) * 100)).toFixed(2) + "%";
/* 分值色条：异常侧暖色 → 分界处转冷色，转折点与分界竖线对齐 */
const barStyle = (s) => {
  const lo = (s.direction || "higher_better") === "lower_better";
  const p = s.cutoff != null && s.max
    ? Math.max(6, Math.min(94, (Number(s.cutoff) / Number(s.max)) * 100))
    : 50;
  const warm = ["#f2a97e", "#f6dc84"], cool = ["#c9e08a", "#8fd694"];
  return {
    background: lo
      ? `linear-gradient(90deg,${cool[1]} 0%,${cool[0]} ${p}%,${warm[1]} ${p}%,${warm[0]} 100%)`
      : `linear-gradient(90deg,${warm[0]} 0%,${warm[1]} ${p}%,${cool[0]} ${p}%,${cool[1]} 100%)`,
  };
};
/* 参考区间：括号内为分界值，学历分层用浅灰小字追加 */
const rangeMain = (s) => s.cutoff == null
  ? "参考区间（未设分界）"
  : "参考区间（" + ((s.direction || "higher_better") === "lower_better" ? "≤" : "≥") + s.cutoff;
const rangeEdu = (s) => (s.cutoff != null && s.cutoffEdu) ? "，" + s.cutoffEdu : "";
const scTag = (s) => {
  if (s.delta == null) return { t: "供医师判读", c: "na" };
  const lo = (s.direction || "higher_better") === "lower_better";
  if (s.delta === 0) return { t: "处于分界", c: "mid" };
  const good = lo ? s.delta < 0 : s.delta > 0;
  return good ? { t: "参考范围内", c: "ok" } : { t: lo ? "高于参考" : "低于参考", c: "bad" };
};

// 复评前后认知域对比：同一六轴模板叠加首次（灰虚线）与复评（主色实线）两条轮廓
const radarDualModel = (a, b) => {
  const hasA = a && Object.keys(a).length, hasB = b && Object.keys(b).length;
  if (!hasA && !hasB) return null;
  const cx = 170, cy = 150, R = 100;
  const ang = (i) => (-90 + i * 60) * Math.PI / 180;
  const at = (i, k) => ({ x: +(cx + Math.cos(ang(i)) * R * k).toFixed(1), y: +(cy + Math.sin(ang(i)) * R * k).toFixed(1) });
  const series = (r) => {
    const pts = DOMS.map((d, i) => ({ d, i, v: r && r[d] != null ? r[d] : null }))
      .filter(p => p.v != null)
      .map(p => { const q = at(p.i, Math.max(0, Math.min(100, p.v)) / 100); return { d: p.d, i: p.i, v: p.v, x: q.x, y: q.y }; });
    // 只在相邻（序号连续）的两点之间连线，跨未测域不连
    const segs = [];
    for (let k = 0; k + 1 < pts.length; k++) {
      const x = pts[k], y = pts[k + 1];
      if (y.i === x.i + 1) segs.push({ x1: x.x, y1: x.y, x2: y.x, y2: y.y });
    }
    return { pts, segs, full: pts.length >= 3, poly: pts.map(p => p.x + "," + p.y).join(" ") };
  };
  const labels = DOMS.map((d, i) => {
    const c = Math.cos(ang(i));
    return {
      d, lx: +(cx + c * (R + 17)).toFixed(1), ly: +(cy + Math.sin(ang(i)) * (R + 17)).toFixed(1),
      anchor: Math.abs(c) < 0.2 ? "middle" : (c > 0 ? "start" : "end"),
      lit: (a && a[d] != null) || (b && b[d] != null),
    };
  });
  return {
    cx, cy, labels,
    rings: [0.25, 0.5, 0.75, 1].map(k => DOMS.map((_, i) => { const p = at(i, k); return p.x + "," + p.y; }).join(" ")),
    spokes: DOMS.map((_, i) => at(i, 1)),
    base: series(a), cur: series(b),
  };
};

const DomainCompare = {

// 各项目完成情况：量表（分值色条 + 参考区间 + 判定）/ 范式（按各自身指标成组），报告与训练方案共用
const ProjectResult = {
  props: {
    chart: { type: Array, default: () => [] },
    scaleSub: { type: String, default: "实际得分与参考区间" },
    paradigmSub: { type: String, default: "各范式按自身指标记录" },
  },
  computed: {
    scales() { return (this.chart || []).filter(c => c.kind === "scale"); },
    paradigms() { return (this.chart || []).filter(c => c.kind === "paradigm"); },
  },
  methods: { pctOf, barStyle, rangeMain, rangeEdu, scTag },
  template: `<div>
    <div class="rep-sub">量表评定 <span>{{ scaleSub }}</span></div>
    <div v-if="scales.length">
      <div class="sc-card" v-for="s in scales" :key="s.name">
        <div class="sc-hd">
          <span class="sc-name">{{ s.name }}</span>
          <span class="sc-val"><b class="num">{{ s.total != null ? s.total : "—" }}</b> 分</span>
        </div>
        <div class="sc-bar">
          <div class="sc-track" :style="barStyle(s)"></div>
          <div v-if="s.cutoff != null" class="sc-cut" :style="{ left: pctOf(s.cutoff, s.max) }"></div>
        </div>
        <div class="sc-ft">
          <span class="sc-range">{{ rangeMain(s) }}<template v-if="rangeEdu(s)"><i class="sc-edu">{{ rangeEdu(s) }}</i></template><template v-if="s.cutoff != null">）</template></span>
          <span class="sc-mid">总分 {{ s.max }}</span>
          <span class="sc-cur">当前 {{ s.total != null ? s.total : "—" }}</span>
        </div>
        <div class="sc-tagrow">
          <span class="sc-tag" :class="scTag(s).c">{{ scTag(s).t }}</span>
        </div>
      </div>
    </div>
    <div v-else class="st-none" style="padding:6px 0 10px">本次评估未包含量表</div>

    <div class="rep-sub" style="margin-top:14px">范式评估 <span>{{ paradigmSub }}</span></div>
    <div v-if="paradigms.length" class="pf-grid">
      <div class="pf-card" v-for="m in paradigms" :key="m.name">
        <div class="pf-hd">
          <span class="pf-name">{{ m.name }}</span>
          <span v-if="m.domain" class="pf-dom">{{ m.domain }}</span>
          <span v-if="m.scored && m.scored.max" class="pf-score">计分 <b class="num">{{ m.scored.total != null ? m.scored.total : "—" }}</b> / {{ m.scored.max }}</span>
        </div>
        <div v-if="m.scoreDim" class="pf-dim">
          <span class="pf-dim-k">计分维度：{{ m.scoreDim }}</span>
          <span v-if="m.scoreNote" class="pf-dim-n">{{ m.scoreNote }}</span>
        </div>
        <div v-if="m.metrics && m.metrics.length" class="pf-items">
          <div class="pf-item" :class="{ p: x.p, wide: String(x.v || '').length > 15 }" v-for="x in m.metrics" :key="x.k">
            <span class="pf-k">{{ x.k }}</span>
            <span class="pf-v num">{{ x.v }}</span>
          </div>
        </div>
        <div v-if="m.legacy" class="pf-legacy">{{ m.legacyNote }}</div>
      </div>
    </div>
    <div v-else class="st-none" style="padding:6px 0">本次评估未包含范式</div>
  </div>`,
};

// 流程路径：选择评估方案 → 患者身份核对 → 评估施测 → 评分提交
const FlowPath = {
  props: { step: { type: Number, default: 1 } },
  template: `<div class="flow-path">
    <div class="fp-step" :class="{ on: step >= 1 }"><span class="fp-dot">1</span><span class="fp-t">选择评估方案</span></div>
    <span class="fp-line"></span>
    <div class="fp-step" :class="{ on: step >= 2 }"><span class="fp-dot">2</span><span class="fp-t">患者身份核对</span></div>
    <span class="fp-line"></span>
    <div class="fp-step" :class="{ on: step >= 3 }"><span class="fp-dot">3</span><span class="fp-t">评估</span></div>
    <span class="fp-line"></span>
    <div class="fp-step" :class="{ on: step >= 4 }"><span class="fp-dot">4</span><span class="fp-t">评分提交</span></div>
  </div>`
};

/* 范式施测右侧「评估要点」：与量表评估同一交互（可折叠成竖排入口） */
const ParaAside = {
  props: {
    open: { type: Boolean, default: true },
    title: { type: String, default: "" },
    sub: { type: String, default: "评估要点" },
    ops: { type: Array, default: () => [] },
    points: { type: Array, default: () => [] },
    score: { type: Object, default: null },
    /* 按卡片分段的范式（当前仅 Stroop）：每段含该卡片的评估操作与进度状态 */
    cards: { type: Array, default: () => [] },
    /* 本题评分：按卡片分开计算 + SIE 两个派生值 */
    itemScore: { type: Object, default: null },
    /* 评分法选择（画钟六种评分法）：[{k,name,short,max,on}] */
    methods: { type: Array, default: () => [] },
    onMethod: { type: Function, default: null },
    /* 逐项勾选式本题评分：{title,items:[{id,label,pts,tip,on}],note,total,max,rule,reverse} */
    checklist: { type: Object, default: null },
    onCheck: { type: Function, default: null },
    /* 记录单式统计评分（波士顿命名）：{title,total,max,rows:[{k,v,na}],rule,grid:[{i,st,now}]} */
    stats: { type: Object, default: null },
    /* 折叠某张卡片（由父级维护展开状态，避免组件内部状态与重置打架） */
    toggleFn: { type: Function, default: null },
  },
  emits: ["toggle"],
  template: `<button v-show="!open" type="button" class="qx-rail" @click="$emit('toggle')" title="展开评估要点">
      <span class="qx-rail-ic">›</span><span class="qx-rail-t">评估要点</span>
    </button>
    <aside class="qx-panel" v-show="open">
      <div class="qx-phd">
        <b>{{ title }}</b>
        <span style="margin-left:auto">{{ sub }}</span>
        <button type="button" class="qx-fold" @click="$emit('toggle')" title="收起评估要点">›</button>
      </div>
      <div v-if="methods.length" class="qx-sec">
        <div class="qx-lb">评分法</div>
        <div class="cd-mths">
          <button v-for="m in methods" :key="m.k" type="button" class="cd-mth" :class="{ on: m.on }"
                  :title="m.name + '（满分 ' + m.max + '）'" @click="onMethod && onMethod(m.k)">
            <b>{{ m.short }}</b><i>满分 {{ m.max }}</i>
          </button>
        </div>
      </div>
      <div v-if="cards.length" class="qx-sec">
        <div class="qx-lb">测试进程</div>
        <div v-for="c in cards" :key="c.k" class="sk-ac" :class="c.state">
          <button type="button" class="sk-ac-hd" @click="toggleFn && toggleFn(c.k)">
            <b>卡片 {{ c.k }}</b>
            <span>{{ c.name }}</span>
            <em :class="c.state">{{ c.stateText }}</em>
            <i :class="{ open: c.open }">›</i>
          </button>
          <div v-show="c.open" class="sk-ac-bd">
            <div class="sk-ac-lb">评估操作</div>
            <div class="sk-ac-op">{{ c.op }}</div>
          </div>
        </div>
      </div>
      <div v-if="itemScore" class="qx-sec">
        <div class="qx-lb">本题评分</div>
        <div class="sk-item">
          <div v-for="r in itemScore.rows" :key="r.k" class="sk-item-row" :class="{ on: r.on }">
            <b>卡片 {{ r.k }}</b>
            <span>完成时间 <i>{{ r.sec }}</i> 秒</span>
            <span>正确数 <i>{{ r.ok }}</i></span>
            <span>错误数 <i class="bad">{{ r.bad }}</i></span>
            <span v-if="r.semantic != null">读成字义 <i class="bad">{{ r.semantic }}</i> 次</span>
            <em v-if="r.flag">{{ r.flag }}</em>
          </div>
          <div class="sk-item-row sie">
            <b>SIE耗时数</b>
            <span>完成 C − 完成 B</span>
            <i>{{ itemScore.sieSec }}</i>
            <em v-if="itemScore.sieSec === '—'">卡片 B、C 都测完才计算</em>
          </div>
          <div class="sk-item-row sie">
            <b>SIE准确数</b>
            <span>正确 C − 正确 B</span>
            <i>{{ itemScore.sieOk }}</i>
            <em v-if="itemScore.sieOk === '—'">卡片 B、C 都测完才计算</em>
          </div>
        </div>
      </div>
      <div v-if="ops.length" class="qx-sec">
        <div class="qx-lb">评估操作</div>
        <ol class="qx-ops">
          <li v-for="(o, i) in ops" :key="i"><b v-if="o.t">{{ o.t }}</b><span>{{ o.d }}</span></li>
        </ol>
      </div>
      <div v-if="points.length" class="qx-sec">
        <div class="qx-lb">评分要点</div>
        <ul class="qx-pts"><li v-for="(p, i) in points" :key="i">{{ p }}</li></ul>
      </div>
      <div v-if="score" class="qx-sec qx-scoring">
        <div class="qx-lb qx-score-hd"><span>本次得分</span><b>{{ score.total }} / {{ score.totalMax }}</b></div>
        <div class="sp-srow"><span>顺背得分</span><b>{{ score.fwd }}</b><i>/ {{ score.fwdMax }}</i></div>
        <div class="sp-srow"><span>倒背得分</span><b>{{ score.bwd }}</b><i>/ {{ score.bwdMax }}</i></div>
        <div class="qx-tx">参考界值 &gt; {{ score.cut }} 分属正常（{{ score.edu || "教育程度未记录" }}）</div>
      </div>
      <!-- 逐项勾选的本题评分（画钟）：上方总分，下方按评分法列出评分项 -->
      <div v-if="checklist" class="qx-sec qx-scoring cd-score-sec">
        <div class="qx-lb qx-score-hd">
          <span>本题评分</span>
          <b>{{ checklist.total }} / {{ checklist.max }}</b>
        </div>
        <div class="cd-ck-title">{{ checklist.title }}</div>
        <div class="cd-ck">
          <button v-for="it in checklist.items" :key="it.id" type="button" class="cd-it" :class="{ on: it.on }"
                  @click="onCheck && onCheck(it.id)">
            <i class="cd-box"></i>
            <span class="cd-lb">{{ it.label }}<em v-if="it.tip">{{ it.tip }}</em></span>
            <b class="cd-pts">{{ it.pts }} 分</b>
          </button>
        </div>
        <div v-if="checklist.note" class="cd-note">{{ checklist.note }}</div>
        <div class="cd-rule" :class="{ rev: checklist.reverse }">{{ checklist.rule }}</div>
      </div>
      <!-- 记录单式统计（波士顿命名）：六项计数 + 总分 + 逐张进度 -->
      <div v-if="stats" class="qx-sec qx-scoring">
        <div class="qx-lb qx-score-hd">
          <span>本题评分</span>
          <b>{{ stats.total }} / {{ stats.max }}</b>
        </div>
        <div class="qx-tx" style="margin-bottom:6px">{{ stats.title }}</div>
        <div class="bn-stats">
          <div v-for="r in stats.rows" :key="r.k" class="bn-srow">
            <span>{{ r.k }}</span><b :class="{ na: r.na }">{{ r.v }}</b>
          </div>
        </div>
        <div v-if="stats.grid && stats.grid.length" class="bn-grid">
          <i v-for="g in stats.grid" :key="g.i" :class="[g.st, { now: g.now }]"
             :title="'第 ' + (g.i + 1) + ' ' + (stats.unit || '张')">{{ g.i + 1 }}</i>
        </div>
        <div v-if="stats.gridNote" class="qx-tx" style="margin-top:6px">{{ stats.gridNote }}</div>
        <div class="qx-tx" style="margin-top:8px">{{ stats.rule }}</div>
      </div>
    </aside>`
};

/* SDMT 的 9 个符号：用 SVG 笔画自绘（不依赖字体，跨平台一致） */
const SdSym = {
  props: { k: { type: Number, default: 1 }, size: { type: Number, default: 20 } },
  computed: { h() { return Math.round(this.size * 0.79); } },
  template: `<svg class="sd-sym" :width="size" :height="h" viewBox="0 0 24 19" fill="none"
      stroke="currentColor" stroke-width="1.9" stroke-linecap="square">
    <path v-if="k === 1" d="M15.5 2.8C9.2 4.9 9.2 14.1 15.5 16.2" />
    <g v-else-if="k === 2"><path d="M5.5 5.2h13" /><circle cx="12" cy="12.2" r="1.5" fill="currentColor" stroke="none" /></g>
    <g v-else-if="k === 3"><path d="M7 2.8v13.4" /><path d="M7 9.5h10" /></g>
    <g v-else-if="k === 4"><path d="M8 16.2V4h9" /></g>
    <g v-else-if="k === 5"><path d="M17 2.8v13.4" /><path d="M17 9.5H7" /></g>
    <path v-else-if="k === 6" d="M8 3.6l9.4 5.9L8 15.4" />
    <g v-else-if="k === 7"><path d="M12 3.6v11.8" /><path d="M5.5 9.5h13" /></g>
    <path v-else-if="k === 8" d="M8.5 2.8c6.3 2.1 6.3 11.3 0 13.4" />
    <g v-else><circle cx="12" cy="6.8" r="1.5" fill="currentColor" stroke="none" /><path d="M5.5 13.4h13" /></g>
  </svg>`
};

const app = createApp(App);
app.component("flow-path", FlowPath);
app.component("para-aside", ParaAside);
app.component("sd-sym", SdSym);
app.component("domain-profile", DomainProfile);
app.component("domain-compare", DomainCompare);
app.component("project-result", ProjectResult);
app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
for (const [k, c] of Object.entries(ElementPlusIconsVue)) app.component(k, c);
app.config.globalProperties.window = window;
app.mount("#app");
</script></body></html>
