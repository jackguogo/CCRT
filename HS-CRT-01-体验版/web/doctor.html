<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>医生端 · 认知功能障碍评估与训练软件 HS-CRT-01</title>
<link rel="stylesheet" href="/vendor/element-plus.css"><link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/theme.css">
<style>[v-cloak]{display:none}
.rep-wrap{background:var(--c-bg)}
@media print{ .no-print{display:none!important} .lb-main{padding:0;background:#fff} body{background:#fff} }
</style></head><body>
<div id="app" v-cloak></div>
<script src="/vendor/vue.global.prod.js"></script>
<script src="/vendor/element-plus.full.min.js"></script>
<script src="/vendor/element-icons.iife.min.js"></script>
<script src="/vendor/element-zh-cn.min.js"></script>
<script src="/icons.js"></script>
<script src="/vendor/echarts.min.js"></script>
<script src="/vendor/qrcode.js"></script>
<script>
/* ============================================================================
   医生端 —— 菜单：工作台 / 患者信息 / 评估功能 / 方案管理 / 训练功能 / 数据记录
   业务闭环：患者登记 → 发起评估（身份核对）→ 量表施测 + 范式下发 → 报告
             → 据此配置训练方案 → 患者端训练 → 数据记录与阶段复评
   ========================================================================== */
const { createApp, ref, reactive, computed, onMounted, nextTick, watch } = Vue;
const El = ElementPlus;
const msg = El.ElMessage, mbx = El.ElMessageBox;

// 评估方案已改为服务端方案库（/api/v1/plan-lib），由「方案管理」统一维护
const DOMS = ["复合性注意", "执行能力", "学习与记忆", "语言", "视结构-知觉能力", "社会认知"];
const DOMBG = { "复合性注意": "var(--dom-ca-bg)", "执行能力": "var(--dom-ex-bg)", "学习与记忆": "var(--dom-lm-bg)", "语言": "var(--dom-la-bg)", "视结构-知觉能力": "var(--dom-vp-bg)", "社会认知": "var(--dom-sc-bg)" };
const DOMIC = null; // 六域图标由 icons.js 提供（hsIcon(域名称)）
const DOMFG = { "复合性注意": "var(--dom-ca)", "执行能力": "var(--dom-ex)", "学习与记忆": "var(--dom-lm)", "语言": "var(--dom-la)", "视结构-知觉能力": "var(--dom-vp)", "社会认知": "var(--dom-sc)" };
const DOMKEY = { "复合性注意": "ca", "执行能力": "ex", "学习与记忆": "lm", "语言": "la", "视结构-知觉能力": "vp", "社会认知": "sc" };

const App = {
  setup() {
    const runParam = new URLSearchParams(location.search).get("run");
    const immersive = ref(!!runParam);
    const tk = ref(localStorage.getItem("hs_tk") || "");
    const user = ref(null), banks = ref(null);
    const view = ref("home");
    const ICONS = window.HS_ICONS;               // 见 web/icons.js（统一 24×24 线性图标）
    const hsIcon = window.hsIcon;
    const domFilter = ref("");

    /* ---------- 训练方案库 · 效果测试 ----------
       打开 /train/<code>.html?preview=1：页面内嵌本地模拟结算，不调用任何后端接口，
       因此不会写入 train_record、不影响统计。这里再显式禁用 iframe 内的网络请求，
       并在样式层把试玩页的装饰性 emoji 换成数字疗法中性元素。 */
    // 项目配置由管理端维护：停用的量表/范式/训练方案不出现在新建与配置入口，历史记录照常展示
    const activeScales = computed(() => ((banks.value && banks.value.scales) || []).filter(x => x.enabled !== false));
    const activeParadigms = computed(() => ((banks.value && banks.value.paradigms) || []).filter(x => x.enabled !== false));
    const activeTrainings = computed(() => ((banks.value && banks.value.trainings) || []).filter(x => x.enabled !== false));
    const shownTrainings = computed(() => activeTrainings.value
      .filter(t => !domFilter.value || t.domain === domFilter.value));
    const domCount = (d) => activeTrainings.value.filter(t => t.domain === d).length;
    const preview = reactive({ show: false, code: "", name: "", domain: "", archetype: "", desc: "", levels: [] });
    const openPreview = (t) => {
      Object.assign(preview, {
        show: true, code: t.code, name: t.name, domain: t.domain,
        archetype: t.archetype || "", desc: t.desc || "", levels: t.levels || []
      });
    };
    const closePreview = () => { preview.show = false; };
    const onPreviewFrame = () => {
      nextTick(() => {
        const f = document.getElementById("tpFrame");
        if (!f) return;
        let d, w;
        try { d = f.contentDocument; w = f.contentWindow; } catch (e) { return; }
        if (!d || !w || d.getElementById("hsPreviewCss")) return;
        // 效果测试模式：网络请求一律拒绝，训练结算只走页面本地模拟
        w.fetch = () => Promise.reject(new Error("效果测试模式不产生网络请求"));
        const fg = DOMHEX[preview.domain] || "#0e9f8a";
        const st = d.createElement("style");
        st.id = "hsPreviewCss";
        st.textContent = `
          :root{--tp-fg:${fg}}
          body{background:#f7faf9!important}
          .hd{background:#fff!important;border-color:#e6ebf0!important;box-shadow:none!important}
          .hd .cover{background:var(--tp-fg)!important;color:#fff!important;box-shadow:none!important;font-size:0!important}
          .hd .cover .hs-ico{width:27px;height:27px}
          .hd h1{color:#1e2a35}
          .chip.active{background:var(--tp-fg)!important;border-color:transparent!important;box-shadow:none!important}
          .pbtn.primary{background:var(--tp-fg)!important;box-shadow:0 4px 0 rgba(16,40,64,.14)!important}
          .pbtn:hover{border-color:var(--tp-fg)!important}
          .goal{background:#f1f6f4!important;border-left-color:var(--tp-fg)!important;color:#5a6b7b!important}
          .hud{background:#1b3a34!important;box-shadow:none!important}
          .trail span{background:#eef4f2!important;color:var(--tp-fg)!important}
          .pcard{border-color:#e6ebf0!important;box-shadow:none!important}
          .ft,#ptitle,.settle-stars{display:none!important}
          .snd{font-size:0!important}
          .snd::after{content:"语音";font-size:12px;font-weight:600;color:#5a6b7b}
        `;
        d.head.appendChild(st);
        const cover = d.querySelector(".hd .cover");
        if (cover) cover.innerHTML = hsIcon(preview.code);
      });
    };

    const api = async (u, opt = {}) => {
      const r = await fetch("/api/v1" + u, { ...opt, headers: { "Content-Type": "application/json", Authorization: "Bearer " + tk.value }, body: opt.body ? JSON.stringify(opt.body) : undefined });
      if (r.status === 401) { tk.value = ""; localStorage.removeItem("hs_tk"); user.value = null; throw new Error("会话已过期，请重新登录"); }
      const j = await r.json(); if (j.code !== 0) throw new Error(j.message); return j.data;
    };

    /* ---------- 登录 ---------- */
    const lu = ref(""), lp = ref(""), logining = ref(false);
    /* 记住密码：仅存本机浏览器（localStorage），密码经 base64 转码后保存，取消勾选即清除 */
    const REMEMBER_KEY = "hs_remember_doctor";
    const remember = ref(false);
    const b64e = (s) => btoa(String.fromCharCode(...new TextEncoder().encode(s)));
    const b64d = (s) => { try { return new TextDecoder().decode(Uint8Array.from(atob(s), c => c.charCodeAt(0))); } catch (e) { return ""; } };
    const loadRemember = () => {
      try {
        const raw = localStorage.getItem(REMEMBER_KEY);
        if (!raw) return;
        const o = JSON.parse(raw);
        if (o && o.u) { lu.value = o.u; lp.value = b64d(o.p || ""); remember.value = true; }
      } catch (e) { }
    };
    const saveRemember = () => {
      try {
        if (remember.value && lu.value.trim()) localStorage.setItem(REMEMBER_KEY, JSON.stringify({ u: lu.value.trim(), p: b64e(lp.value) }));
        else localStorage.removeItem(REMEMBER_KEY);
      } catch (e) { }
    };
    watch(remember, (v) => { if (!v) { try { localStorage.removeItem(REMEMBER_KEY); } catch (e) { } } });
    const doLogin = async () => {
      if (!lu.value.trim() || !lp.value) return msg.warning("请输入账号与密码");
      logining.value = true;
      try {
        const d = await api("/auth/login", { method: "POST", body: { username: lu.value.trim(), password: lp.value } });
        if (d.user.role === "patient") return msg.error("请使用患者端登录患者账号");
        saveRemember();
        tk.value = d.token; localStorage.setItem("hs_tk", d.token); user.value = d.user;
        banks.value = await api("/banks"); await loadDict();
        await loadPatients(); loadAssessList(); loadPlanLib(); loadWkSummary();
        if (runParam) enterRun();
        msg.success("欢迎，" + d.user.name);
      } catch (e) { msg.error(e.message); } finally { logining.value = false; }
    };
    const logout = async () => {
      try { await mbx.confirm("确认退出登录？", "提示", { type: "warning" }); } catch (e) { return; }
      tk.value = ""; localStorage.removeItem("hs_tk"); user.value = null;
    };

    /* ---------- 患者查询 ---------- */
    const kw = ref(""), patients = ref([]);
    const loadPatients = async () => { patients.value = await api("/patients?kw=" + encodeURIComponent(kw.value)); };
    const ageOf = (b) => Math.floor((Date.now() - new Date(b)) / 31557600000);
    /* 业务字典：科室 / 学历 / 职称 / 患者来源 / 评估类型 / 终止原因，由管理端维护 */
    const dict = reactive({ dept: [], education: [], title: [], source: [], assess_type: [], stop_reason: [] });
    const loadDict = async () => {
      for (const t of Object.keys(dict)) {
        try { dict[t] = await api("/dict/" + t); } catch (e) { dict[t] = []; }
      }
    };
    /* 科室筛选 + 前端分页（查询区域 → 表单/列表区域） */
    const deptFilter = ref("");
    // 字典项优先；存量患者中出现过但尚未录入字典的科室一并列出，避免筛选漏项
    const deptOptions = computed(() => [...new Set([
      ...dict.dept.map(d => d.label),
      ...patients.value.map(p => p.dept).filter(Boolean),
    ])]);
    /* 评估状态筛选：未开始 = 尚无评估记录（接口回 "-"） */
    const assessFilter = ref("");
    const ASSESS_STATES = ["未开始", "进行中", "已完成", "已作废"];
    const assessStateOf = (p) => (p.assess_status && p.assess_status !== "-") ? p.assess_status : "未开始";
    const patientsShown = computed(() => patients.value.filter(p => {
      if (deptFilter.value && p.dept !== deptFilter.value) return false;
      if (assessFilter.value && assessStateOf(p) !== assessFilter.value) return false;
      return true;
    }));
    const pPage = ref(1), pSize = ref(10);
    const pagedPatients = computed(() => patientsShown.value.slice((pPage.value - 1) * pSize.value, pPage.value * pSize.value));
    const rowNo = (i) => (pPage.value - 1) * pSize.value + i + 1;
    // 状态色块：进行中（橙）/ 已完成（绿）/ 已终止（灰）/ 未开展（-）
    const stClass = (v) => v === "进行中" ? "run" : v === "已完成" ? "done" : (v === "已终止" || v === "已作废") ? "none" : "wait";
    const onPSize = (v) => { pSize.value = v; pPage.value = 1; };

    /* 训练情况表：完成评估才可进入训练；列表只含已开始训练的患者（训练中 / 已完成） */
    const trainTab = ref("all");
    const trainPage = ref(1), trainSize = ref(10);
    const trainStateOf = (p) => (p.train_status && p.train_status !== "-") ? p.train_status : "未开始";
    const assessed = (p) => (p.assess_done || 0) > 0;
    const trainEligible = computed(() => patients.value.filter(p => assessed(p) && trainStateOf(p) !== "未开始"));
    const trainRunning = computed(() => trainEligible.value.filter(p => trainStateOf(p) === "进行中"));
    const trainDone = computed(() => trainEligible.value.filter(p => trainStateOf(p) === "已完成"));
    /* 疗程到期由服务端自动归档为「已完成」，列表不再单独标记到期 */
    const trainShown = computed(() => trainTab.value === "running" ? trainRunning.value
      : trainTab.value === "done" ? trainDone.value : trainEligible.value);
    const trainTotal = computed(() => trainShown.value.length);
    const trainRows = computed(() => trainShown.value.slice((trainPage.value - 1) * trainSize.value, trainPage.value * trainSize.value));
    const trainNo = (i) => (trainPage.value - 1) * trainSize.value + i + 1;
    watch(trainTab, () => { trainPage.value = 1; });
    const doSearch = () => { pPage.value = 1; loadPatients(); };
    const resetSearch = () => { kw.value = ""; deptFilter.value = ""; assessFilter.value = ""; pPage.value = 1; loadPatients(); };
    watch(deptFilter, () => { pPage.value = 1; });
    watch(assessFilter, () => { pPage.value = 1; });
    const reg = reactive({ show: false, saving: false, form: {} });
    const blank = { name: "", sex: "男", birth_date: "", education: "初中", id_card: "", outpatient_no: "", dept: "康复科", phone: "", guardian: "", history: "" };
    const openReg = () => { Object.assign(reg.form, blank); reg.show = true; };
    const saveReg = async () => {
      if (!reg.form.name.trim()) return msg.warning("姓名为必填项");
      if (!reg.form.birth_date) return msg.warning("请选择出生日期");
      const f = reg.form;
      const opNo = (f.outpatient_no || "").trim() || "系统自动生成";
      const info = "请与患者当面核对以下信息：\n"
        + "姓名：" + f.name + " · " + f.sex + "\n"
        + "出生日期：" + f.birth_date + "（" + ageOf(f.birth_date) + " 岁）\n"
        + "教育程度：" + f.education + "\n"
        + "门诊号：" + opNo + "\n"
        + "科室：" + f.dept + "\n\n确认无误并保存建档？";
      try {
        await mbx.confirm(info, "建档前核对", { type: "warning", confirmButtonText: "核对无误，保存", customClass: "mbx-lg" });
      } catch (e) { return; }
      reg.saving = true;
      try {
        await api("/patients", { method: "POST", body: reg.form });
        reg.show = false; msg.success("登记成功");
        // 登记后停留在患者信息列表（新患者排首位），不自动打开详情
        kw.value = ""; deptFilter.value = ""; assessFilter.value = ""; pPage.value = 1;
        await loadPatients(); view.value = "patients";
      } catch (e) { msg.error(e.message); } finally { reg.saving = false; }
    };

    /* ---------- 患者详情 ---------- */
    const cur = ref(null);
    const openDetail = async (id) => {
      cur.value = await api("/patients/" + id);
      view.value = "detail";
    };

    /* ---------- 患者端登录码（家庭训练：扫码进入登录页，用任务账号 + 初始密码登录） ---------- */
    const tkDlg = reactive({ show: false, loading: false, url: "", account: "", password: "", err: "" });
    const openTicket = async (p) => {
      Object.assign(tkDlg, { show: true, loading: true, url: "", account: "", password: "", err: "" });
      try {
        const d = await api("/patients/" + p.id + "/ticket", { method: "POST" });
        Object.assign(tkDlg, { url: d.url, account: d.account, password: d.password || "", loading: false });
        // 弹窗首次打开时内容才挂载，等两帧再绘制二维码
        await nextTick(); await nextTick();
        const box = document.getElementById("tkQr");
        if (box && window.qrcode) {
          const qr = window.qrcode(0, "M");
          qr.addData(d.url); qr.make();
          box.innerHTML = qr.createSvgTag({ cellSize: 5, margin: 2 });
        }
      } catch (e) { tkDlg.err = e.message; } finally { tkDlg.loading = false; }
    };

    /* ---------- 家属代操作账号 ---------- */
    const famDlg = reactive({ show: false, pid: 0, pname: "", rows: [], saving: false });
    const famForm = reactive({ real_name: "", relation: "", phone: "" });
    const loadFamily = async () => {
      try { famDlg.rows = await api("/patients/" + famDlg.pid + "/family"); } catch (e) { famDlg.rows = []; }
    };
    const openFamily = async (p) => {
      Object.assign(famDlg, { show: true, pid: p.id, pname: p.name });
      Object.assign(famForm, { real_name: "", relation: "", phone: "" });
      await loadFamily();
    };
    const addFamily = async () => {
      if (!famForm.real_name.trim()) return msg.warning("请填写家属姓名");
      famDlg.saving = true;
      try {
        const d = await api("/patients/" + famDlg.pid + "/family", { method: "POST", body: { ...famForm } });
        msg.success("已创建；账号 " + d.username + "，初始密码 hs123456");
        Object.assign(famForm, { real_name: "", relation: "", phone: "" });
        await loadFamily();
      } catch (e) { msg.error(e.message); } finally { famDlg.saving = false; }
    };
    const toggleFamily = async (f) => {
      try { await api("/family/" + f.id, { method: "PUT", body: { status: f.status ? 0 : 1 } }); msg.success("已更新"); loadFamily(); }
      catch (e) { msg.error(e.message); }
    };
    const resetFamilyPwd = async (f) => {
      try { await api("/family/" + f.id + "/reset-password", { method: "POST" }); msg.success("已重置为初始密码 hs123456"); }
      catch (e) { msg.error(e.message); }
    };
    const removeFamily = async (f) => {
      try { await mbx.confirm("解除「" + f.real_name + "」的代操作绑定？", "提示", { type: "warning" }); } catch (e) { return; }
      try { await api("/family/" + f.id, { method: "DELETE" }); msg.success("已解除"); loadFamily(); }
      catch (e) { msg.error(e.message); }
    };
    /* 详情页两张配置卡：已完成评估次数 / 当前进行中的训练方案 */
    const curAssessDone = computed(() => ((cur.value && cur.value.assess) || []).filter(a => a.status === "已完成").length);
    const activePlan = computed(() => ((cur.value && cur.value.plans) || []).find(p => p.status === "进行中") || null);
    /* 方案编号：按该患者方案的创建顺序从 1 编号（最早为 1），与「历次评估」口径一致 */
    const planNo = (pl) => {
      if (!pl) return "";
      const list = [...((cur.value && cur.value.plans) || [])].sort((a, b) => a.id - b.id);
      const i = list.findIndex(x => x.id === pl.id);
      return i >= 0 ? i + 1 : "";
    };
    const goPrescribe = () => {
      if (!curAssessDone.value) return msg.warning("该患者尚未完成评估，完成评估后才能配置训练方案");
      openPrescribe(cur.value.id);
    };
    /* 终止方案：after 指定终止后的刷新动作，缺省回患者详情 */
    const stopPlan = async (pl, after) => {
      const no = pl.no || planNo(pl);
      const who = pl.patientName ? `${pl.patientName}的训练方案` : "训练方案";
      try { await mbx.confirm(`确认终止${who}${no ? " " + no : ""}？终止后患者端不再显示该方案任务。`, "提示", { type: "warning" }); } catch (e) { return; }
      try {
        await api("/prescriptions/" + pl.id + "/status", { method: "PUT", body: { status: "已终止" } });
        msg.success("已终止");
        if (typeof after === "function") await after(); else openDetail(pl.patient_id);
      } catch (e) { msg.error(e.message); }
    };
    /* 训练情况表行内终止：按患者取当前进行中方案再终止 */
    const stopPlanOfPatient = async (row) => {
      let pl;
      try {
        const ps = await api("/prescriptions?patientId=" + row.id);
        pl = (ps || []).find(x => x.status === "进行中");
      } catch (e) { return msg.error(e.message); }
      if (!pl) return msg.warning("该患者当前没有进行中的训练方案");
      await stopPlan({ ...pl, patientName: row.name }, async () => { await loadPatients(); });
    };
    /* 训练方案页：终止该患者当前进行中的方案，终止后重载本页以便重新配置 */
    const stopActivePlan = async () => {
      const pl = activePlan.value; if (!pl || !cur.value) return;
      await stopPlan({ ...pl, patientName: cur.value.name }, async () => {
        await loadPatients();
        await openPrescribe(cur.value.id);
      });
    };
    /* ---------- 评估 ---------- */
    /* 方案库（方案管理 = 评估/训练方案唯一出口，评估功能直接调用） */
    const planLib = ref([]);
    const loadPlanLib = async () => { try { planLib.value = await api("/plan-lib?kind=assess"); } catch (e) { /* 忽略 */ } };
    const libStandard = computed(() => planLib.value.filter(p => p.category === "standard"));
    const libCustom = computed(() => planLib.value.filter(p => p.category === "custom"));
    const libTab = ref("standard");
    const planById = (id) => planLib.value.find(p => p.id === id);
    const itemName = (it) => {
      if (!banks.value) return it.code;
      const s = it.type === "scale" ? banks.value.scales.find(x => x.code === it.code) : banks.value.paradigms.find(x => x.code === it.code);
      return s ? s.name.replace(/（.*?）/g, "") : it.code;
    };
    // 待开放项目（服务端 pending）：置灰不可勾选，统一排在各自分组最后
    const bankItem = (it) => {
      if (!banks.value) return null;
      return it.type === "scale" ? banks.value.scales.find(x => x.code === it.code) : banks.value.paradigms.find(x => x.code === it.code);
    };
    const itemPending = (it) => { const s = bankItem(it); return !!(s && s.pending); };
    const sortPendingLast = (a, b) => (a.pending ? 1 : 0) - (b.pending ? 1 : 0);
    const pickGroups = computed(() => [
      { k: "量表", items: [...activeScales.value].sort(sortPendingLast) },
      { k: "范式", items: [...activeParadigms.value].sort(sortPendingLast) },
    ]);
    const libEdit = reactive({ show: false, saving: false, id: null, isBuiltin: 0, category: "custom", name: "", desc: "", minutes: 30 });
    const libChecked = ref([]);
    const openLibEdit = (row) => {
      libEdit.id = row ? row.id : null;
      libEdit.isBuiltin = row ? row.is_builtin : 0;
      libEdit.category = row ? row.category : "custom";
      libEdit.name = row ? row.name : "";
      libEdit.desc = row ? row.desc : "";
      libEdit.minutes = row ? row.minutes : 30;
      libChecked.value = row ? row.items.map(i => i.type + ":" + i.code) : [];
      libEdit.show = true;
    };
    const saveLib = async () => {
      if (!libEdit.name.trim()) return msg.warning("请填写方案名称");
      if (!libChecked.value.length) return msg.warning("请至少选择一个评估项目");
      const items = libChecked.value.map(v => { const [type, code] = v.split(":"); return { type, code }; });
      libEdit.saving = true;
      try {
        const body = { name: libEdit.name, desc: libEdit.desc, items, minutes: libEdit.minutes, category: libEdit.category };
        if (libEdit.id) await api("/plan-lib/" + libEdit.id, { method: "PUT", body });
        else await api("/plan-lib", { method: "POST", body: { ...body, kind: "assess" } });
        libEdit.show = false; msg.success("方案已保存"); await loadPlanLib();
      } catch (e) { msg.error(e.message); } finally { libEdit.saving = false; }
    };
    const delLib = async (row) => {
      // 有进行中的评估正在使用该方案时不可删除（服务端同样校验，这里先拦一层给出明确原因）
      if (row.in_use) {
        try {
          await mbx.alert(`${row.name} 评估进行中，不可删除；请完成评估后再操作！`, "不可删除", { type: "warning", confirmButtonText: "我知道了" });
        } catch (e) { /* 关闭弹窗 */ }
        return;
      }
      try { await mbx.confirm(`删除后不可恢复，确认删除「${row.name}」？`, "删除方案", { type: "warning", confirmButtonText: "删除" }); } catch (e) { return; }
      try { await api("/plan-lib/" + row.id, { method: "DELETE" }); msg.success("已删除"); await loadPlanLib(); } catch (e) { msg.error(e.message); }
    };

    const ap = reactive({ pid: null, patient: null, planId: null, custom: false, customDone: false, customName: "", identityOk: false, items: [] });
    const ckItems = ref([]);

    // 选择患者：mode=assess 发起评估（排除已有进行中评估的患者）；mode=train 配置训练方案（须已完成评估且不在训练中）
    const pick = reactive({ show: false, kw: "", page: 1, size: 8, mode: "assess" });
    const pickAll = computed(() => {
      const k = pick.kw.trim();
      return [...patients.value]
        .filter(p => pick.mode === "train"
          ? ((p.assess_done || 0) > 0 && p.train_status !== "进行中")
          : (p.assess_status !== "进行中"))
        .filter(p => !k || (p.name || "").indexOf(k) >= 0)
        .sort((a, b) => b.id - a.id);
    });
    const pickTotal = computed(() => pickAll.value.length);
    const pickRows = computed(() => pickAll.value.slice((pick.page - 1) * pick.size, pick.page * pick.size));
    const pickNo = (i) => (pick.page - 1) * pick.size + i + 1;
    const openPick = async (mode) => {
      pick.mode = mode === "train" ? "train" : "assess";
      pick.show = true; pick.kw = ""; pick.page = 1;
      try { await loadPatients(); } catch (e) { /* 无权限时沿用已加载列表 */ }
    };
    const choosePick = (p) => {
      pick.show = false;
      if (pick.mode === "train") openPrescribe(p.id);
      else startAssess(p.id);
    };

    const startAssess = async (pid) => {
      // 已有进行中评估时不允许再次发起，引导到评估情况表继续
      const row = patients.value.find(x => x.id === pid);
      if (row && row.assess_status === "进行中") {
        msg.warning("该患者已有评估正在进行中，请提交后再发起");
        go("assess"); return;
      }
      ap.pid = pid; ap.patient = await api("/patients/" + pid);
      if (!planLib.value.length) await loadPlanLib();
      // 默认选中「全面」方案；标准方案被删空时退回任一可用方案
      const def = libStandard.value.find(p => p.name.indexOf("全面") >= 0) || libStandard.value[0] || planLib.value[0];
      ap.planId = def ? def.id : null;
      ap.custom = false; ap.customDone = false; ap.customName = ""; ap.identityOk = false; ckItems.value = []; started.value = false;
      view.value = "assess-new";
    };

    // 临时自定义项目：勾选并「确认」后才生成「方案包含项目」摘要
    const customItems = computed(() => ckItems.value.map(c => { const [t, code] = c.split(":"); return { type: t, code }; }));
    const customMinutes = computed(() => Math.max(10, ckItems.value.length * 10));
    // 临时自定义方案的名称：医生可自行命名（如「记忆与执行专项」），留空则按所选项目自动生成
    const autoName = computed(() => {
      const names = customItems.value.map(it => itemName(it));
      if (!names.length) return "";
      if (names.length === 1) return names[0];
      if (names.length === 2) return names[0] + " + " + names[1];
      return names[0] + " + " + names[1] + " 等 " + names.length + " 项";
    });
    const customName = computed(() => (ap.customName || "").trim() || autoName.value || "自定义评估方案");
    const confirmCustom = () => {
      if (!ckItems.value.length) return msg.warning("请至少勾选一个评估项目");
      ap.customDone = true;
    };
    watch([() => ap.custom, ckItems], () => { ap.customDone = false; }, { deep: true });

    const goCheck = () => {
      let items;
      if (ap.custom) {
        if (!ap.customDone) return msg.warning("请先确认自定义评估项目");
        items = customItems.value;
      } else {
        const pl = planById(ap.planId);
        if (!pl) return msg.warning("请选择评估方案（可在「方案管理」中维护）");
        items = pl.items.map(i => ({ type: i.type, code: i.code }));
      }
      ap.items = items; view.value = "assess-check";
    };
    const started = ref(false);
    // 身份确认：只推进到「开始评估」步骤，评估记录在点击「开始评估」时才创建
    const confirmStart = () => {
      if (!ap.identityOk) return msg.warning("请勾选确认：已当面核对患者身份信息");
      runRec.value = null; started.value = false; view.value = "assess-start";
    };
    // 评估执行一律在独立沉浸窗口中打开，避免医生端其他操作干扰
    const openRunWindow = (rec) => {
      const w = window.open("/doctor?run=" + rec, "hsrun_" + rec, "width=1320,height=920,menubar=no,toolbar=no");
      if (!w) { msg.warning("浏览器拦截了新窗口，已改为当前页执行"); runRec.value = rec; view.value = "assess-run"; nextTick(loadRun); return false; }
      w.focus(); return true;
    };
    const openImmersive = async () => {
      if (!runRec.value) {
        const pl = planById(ap.planId);
        try {
          const d = await api("/assessments", { method: "POST", body: { patientId: ap.pid, planName: ap.custom ? customName.value : (pl ? pl.name : "评估方案"), planId: ap.custom ? 0 : (pl ? pl.id : 0), items: ap.items, mode: "doctor" } });
          runRec.value = d.recordId; loadAssessList();
        } catch (e) { return msg.error(e.message); }
      }
      if (openRunWindow(runRec.value)) started.value = true;
    };
    const closeRunWindow = () => { window.close(); setTimeout(() => { if (!window.closed) go("assess"); }, 120); };
    const assessList = ref([]);
    const loadAssessList = async () => { try { assessList.value = await api("/assessments"); } catch (e) { /* 治疗师无权限时忽略 */ } };
    const assessRunning = computed(() => assessList.value.filter(a => a.status === "进行中"));
    const assessDone = computed(() => assessList.value.filter(a => a.status === "已完成"));
    const assessVoided = computed(() => assessList.value.filter(a => a.status === "已作废"));
    // 进行中 / 已完成 / 已作废 共用一个列表区域，用切换按钮换数据源；三套分页状态各自独立记忆
    const assessTab = ref("running");
    const aPager = reactive({
      running: { page: 1, size: 10 },
      done: { page: 1, size: 10 },
      voided: { page: 1, size: 10 },
    });
    const curList = computed(() =>
      assessTab.value === "running" ? assessRunning.value
        : assessTab.value === "voided" ? assessVoided.value
          : assessDone.value);
    const curTotal = computed(() => curList.value.length);
    const curPage = computed(() => aPager[assessTab.value].page);
    const curSize = computed(() => aPager[assessTab.value].size);
    const curSizes = [5, 10, 20];
    const curRows = computed(() => curList.value.slice((curPage.value - 1) * curSize.value, curPage.value * curSize.value));
    const curNo = (i) => (curPage.value - 1) * curSize.value + i + 1;
    const onCurPage = (v) => { aPager[assessTab.value].page = v; };
    const onCurSize = (v) => { aPager[assessTab.value].size = v; aPager[assessTab.value].page = 1; };
    // 作废：中途放弃本次评估，释放「同患者只允许 1 条进行中」的名额
    const CANCEL_REASONS = computed(() => {
      const list = dict.stop_reason.map(d => d.label);
      return list.length ? list : ["患者中途离开", "患者身体不适，无法继续", "评估方案选择有误", "重复发起评估", "其他原因"];
    });
    const cx = reactive({ show: false, id: null, name: "", plan: "", reason: "", saving: false });
    const openCancel = (row) => {
      cx.id = row.id; cx.name = row.name; cx.plan = row.plan_name; cx.reason = ""; cx.show = true;
    };
    const doCancel = async () => {
      const reason = (cx.reason || "").trim();
      if (!reason) return msg.warning("请选择或填写作废原因");
      cx.saving = true;
      try {
        await api(`/assessments/${cx.id}/cancel`, { method: "POST", body: { reason } });
        msg.success("已作废");
        cx.show = false;
        await loadAssessList(); await loadPatients();
      } catch (e) { msg.error(e.message); } finally { cx.saving = false; }
    };

    const runRec = ref(null), runData = ref(null);
    const pForm = reactive({});          // 范式施测记录（按项目代码分组）
    const guideOpen = reactive({});      // 施测指导展开状态
    const quiz = reactive({ on: false, code: null, meta: null, idx: 0, ans: {}, score: {}, t0: 0, tip: false });
    /* 朗读开关：关闭后不再自动朗读指导语，正在朗读的立即停止 */
    const sound = reactive({ on: true });
    /* 右侧主试面板折叠状态（题号 / 评估操作 / 评分要点 / 本题评分） */
    const qxPanel = reactive({ open: true });
    const toggleSound = () => {
      sound.on = !sound.on;
      if (!sound.on) stopSpeak(); else speakCurrent();
    };

    const planItems = computed(() => runData.value ? JSON.parse(runData.value.items || "[]") : []);
    const doneCodes = computed(() => new Set(runData.value ? runData.value.details.map(d => d.code) : []));
    const doneCount = computed(() => planItems.value.filter(i => doneCodes.value.has(i.code)).length);
    const totalCount = computed(() => planItems.value.length);
    const allDone = computed(() => totalCount.value > 0 && doneCount.value >= totalCount.value);
    const answeredMap = computed(() => {
      const m = {};
      ((runData.value && runData.value.answered) || []).forEach(r => m[r.code] = r.c);
      return m;
    });
    const scoredMap = computed(() => {
      const m = {};
      ((runData.value && runData.value.scored) || []).forEach(r => m[r.code] = r.c);
      return m;
    });
    /* 主试口述量表没有作答记录，进度按「已评分题数」计；
       分母只算计分题——演示题（学习阶段、练习组）没有分档，不计入评分进度 */
    const scorable = (c) => (c.meta && c.meta.items ? c.meta.items.filter(it => !it.demo).length : 0);
    const qDone = (c) => (c.meta && c.meta.examinerOnly) ? (scoredMap.value[c.code] || 0) : c.answeredCount;
    const qLabel = (c) => (c.meta && c.meta.examinerOnly) ? "评分进度" : "作答进度";
    const qPct = (c) => {
      const n = (c.meta && c.meta.examinerOnly) ? scorable(c) : (c.meta && c.meta.items ? c.meta.items.length : 0);
      return n ? Math.round(qDone(c) / n * 100) : 0;
    };
    const qTotal = (c) => (c.meta && c.meta.examinerOnly) ? scorable(c) : (c.meta && c.meta.items ? c.meta.items.length : 0);

    const scaleCards = computed(() => {
      if (!runData.value || !banks.value) return [];
      return planItems.value.filter(i => i.type === "scale").map(i => {
        const meta = banks.value.scales.find(s => s.code === i.code) || null;
        return {
          code: i.code, meta, guide: meta ? meta.guide : null,
          det: runData.value.details.find(d => d.code === i.code) || null,
          answeredCount: answeredMap.value[i.code] || 0,
        };
      });
    });
    const paraCards = computed(() => {
      if (!runData.value || !banks.value) return [];
      return planItems.value.filter(i => i.type === "paradigm").map(i => {
        const meta = banks.value.paradigms.find(p => p.code === i.code) || null;
        return {
          code: i.code, meta, guide: meta ? meta.guide : null,
          det: runData.value.details.find(d => d.code === i.code) || null,
          answeredCount: answeredMap.value[i.code] || 0,
        };
      });
    });
    const detTotal = (det) => { try { const p = JSON.parse(det.payload); return p.total + " / " + p.max; } catch (e) { return ""; } };
    const metricText = (det) => {
      try { const p = JSON.parse(det.payload); return Object.entries(p.metrics || {}).map(([k, v]) => k + " " + v).join(" · "); } catch (e) { return ""; }
    };
    const toggleGuide = (code) => { guideOpen[code] = !guideOpen[code]; };

    /* ---- 患者施测：逐题作答 ---- */
    const quizItems = computed(() => (quiz.meta && quiz.meta.items) ? quiz.meta.items : []);
    /* 当前评估项目名称：主试版式顶栏展示，便于主试确认正在做哪个项目 */
    const quizProjectName = computed(() => (quiz.meta && quiz.meta.name) || quiz.code || "");
    const curQuizItem = computed(() => quizItems.value[quiz.idx] || null);
    const quizProgress = computed(() => quizItems.value.length ? Math.round((quiz.idx + 1) / quizItems.value.length * 100) : 0);
    const quizModeOf = (it) => {
      if (!it || !it.parts) return "oral";
      if (it.figure === "paper") return "paper";
      if (it.parts.some(p => p.mode === "draw")) return "draw";
      if (it.parts.some(p => p.mode === "order")) return "order";
      if (it.parts.some(p => p.mode === "choice")) return "choice";
      if (it.parts.some(p => p.mode === "fill")) return "fill";
      return "oral";
    };
    const curQuizMode = computed(() => quizModeOf(curQuizItem.value));
    /* 当前题的施测指导（指导语 / 客观操作 / 评分要点），来自 guide-data */
    const curQuizGuide = computed(() => {
      const it = curQuizItem.value, g = quiz.meta && quiz.meta.guide;
      if (!it || !g || !g.items) return null;
      return g.items[it.id] || null;
    });
    /* ---- 范式右侧「评估要点」：评估操作 / 评分要点 / 本次得分 ---- */
    const paraGuide = computed(() => (quiz.meta && quiz.meta.guide) || null);
    const paraOps = computed(() => {
      const pg = paraGuide.value;
      if (pg && pg.steps && pg.steps.length) return pg.steps.map(s => ({ t: s.t, d: s.d }));
      const g = isSpan.value ? null : curQuizGuide.value;   // 数字广度按阶段走，不取单题指导
      return g && g.o ? [{ t: "", d: g.o }] : [];
    });
    const paraPoints = computed(() => {
      const pg = paraGuide.value, g = isSpan.value ? null : curQuizGuide.value, out = [];
      if (g && g.n) out.push(g.n);
      if (pg && pg.score) out.push(pg.score);
      ((pg && pg.notes) || []).forEach(n => out.push(n));
      return out;
    });
    /* 范式本次得分（目前仅数字广度有分数口径；其余范式供医师判读） */
    const paraScore = computed(() => (isSpan.value ? {
      total: spanTotal.value, totalMax: spanMax.value.fwd + spanMax.value.bwd,
      fwd: span.score.fwd, fwdMax: spanMax.value.fwd,
      bwd: span.score.bwd, bwdMax: spanMax.value.bwd,
      cut: spanCut.value, edu: (cur.value && cur.value.education) || "",
    } : null));
    /* 主试口述量表（MMSE 等）：屏幕只给指导语，逐题由主试评分，不设患者交互 */
    const isExaminer = computed(() => !!(quiz.meta && quiz.meta.examinerOnly));
    /* 范式项目（数字广度 / CPT / SDMT …）：主试施测，右侧同样给「评估要点」折叠区 */
    const isParadigm = computed(() => !isExaminer.value && !!(quiz.meta && quiz.meta.runner));
    /* 数字广度用专属施测引擎（练习 → 开始 → 每长度 2 试，同长度 2 错终止） */
    const isSpan = computed(() => !!(quiz.meta && quiz.meta.runner === "span"));
    /* 符号数字转换用专属施测引擎（KEY + 练习行 + 90 秒正式表） */
    const isSdmt = computed(() => !!(quiz.meta && quiz.meta.runner === "sdmt"));
    /* 连线测试用专属施测引擎（A/B 各一张作答纸，练习 → 正式，计时 + 错误计数） */
    const isTmt = computed(() => !!(quiz.meta && quiz.meta.runner === "tmt"));
    /* Stroop 色词测验用专属施测引擎（三张卡片 A/B/C，逐格判对错 + 计时） */
    const isStroop = computed(() => !!(quiz.meta && quiz.meta.runner === "stroop"));
    /* 画钟测验：手写作答 + 六种评分法逐项勾选（右侧面板换评分法/本题评分两块） */
    const isCdt = computed(() => !!(quiz.meta && quiz.meta.code === "CDT"));
    /* 波士顿命名：30 幅图逐张出示 + 三级提示评分（专属施测引擎） */
    const isBnt = computed(() => !!(quiz.meta && quiz.meta.runner === "bnt"));
    /* 伦敦塔：左边可操作原始状态、右边锁定目标状态，2 练习 + 10 正式 */
    const isTol = computed(() => !!(quiz.meta && quiz.meta.runner === "tol"));
    const guideOf = (it) => {
      const g = quiz.meta && quiz.meta.guide;
      return (it && g && g.items && g.items[it.id]) || null;
    };
    const bandsOf = (it) => {
      const g = guideOf(it);
      return (g && g.bands && g.bands.length) ? g.bands : [];
    };
    const maxOf = (it) => bandsOf(it).reduce((a, b) => Math.max(a, Number(b[0]) || 0), 0);
    /* 患者侧只呈现指导语：没有指导语时才退回题干 */
    const curQuizSay = computed(() => {
      const it = curQuizItem.value, g = curQuizGuide.value;
      return (g && g.p) || (it && it.t) || "";
    });
    /* 作答单元：指令序列类条目（如 ADAS 命令）逐条列给主试念读 */
    const curQuizUnits = computed(() => {
      const g = curQuizGuide.value;
      return (g && Array.isArray(g.units)) ? g.units : [];
    });
    const curQuizBands = computed(() => bandsOf(curQuizItem.value));
    const curQuizMax = computed(() => maxOf(curQuizItem.value));
    const curQuizScore = computed(() => {
      const it = curQuizItem.value;
      if (!it) return null;
      const v = quiz.score[it.id];
      return v === undefined || v === null ? null : Number(v);
    });
    const curQuizScoreText = computed(() =>
      (curQuizScore.value === null ? "未评分" : curQuizScore.value + " 分") + " / " + curQuizMax.value);
    const setQuizScore = (v) => {
      const it = curQuizItem.value;
      if (!it) return;
      quiz.score[it.id] = Number(v) || 0;
    };

    /* ---- 词表类条目（ADAS 单词回忆 / 单词再认）：多套词表切换 + 逐词打钩计分 ---- */
    const wordState = reactive({ set: 0, trial: 0, marks: {} });
    const curWordList = computed(() => {
      const g = curQuizGuide.value;
      if (!g || !g.lists || !g.lists.length) return null;
      return { sets: g.lists, mode: g.wordScore || "recall" };
    });
    const wordSet = computed(() => {
      if (!curWordList.value) return null;
      const i = Math.min(wordState.set, curWordList.value.sets.length - 1);
      return curWordList.value.sets[i];
    });
    const wordHit = (gi, w) => !!wordState.marks[gi + "|" + w];
    const wordCount = (gi) => {
      const s = wordSet.value;
      if (!s || !s.groups[gi]) return 0;
      return s.groups[gi].words.filter(w => wordHit(gi, w)).length;
    };
    /* 回忆类：分组 = 逐次试验，一次只呈现一组；再认类：分组 = 旧词/新词，同屏呈现 */
    const isTrialList = computed(() => !!(curWordList.value && curWordList.value.mode === "recall"
      && wordSet.value && wordSet.value.groups.length > 1));
    const wordTrialIdx = computed(() => isTrialList.value
      ? Math.min(wordState.trial, wordSet.value.groups.length - 1) : -1);
    const shownGroups = computed(() => {
      const s = wordSet.value;
      if (!s) return [];
      return isTrialList.value ? [wordTrialIdx.value] : s.groups.map((_, i) => i);
    });
    /* 某次试验未能回忆的词数 */
    const trialMiss = (gi) => {
      const s = wordSet.value;
      if (!s || !s.groups[gi]) return 0;
      return s.groups[gi].words.length - wordCount(gi);
    };
    const wordScore = computed(() => {
      const wl = curWordList.value, s = wordSet.value;
      if (!wl || !s) return 0;
      if (wl.mode === "recognize") {
        /* 再认：错误数 = 旧词漏认 + 新词误认（0–12，0 = 全对） */
        const oldTotal = s.groups[0].words.length;
        return Math.max(0, Math.min(12, (oldTotal - wordCount(0)) + wordCount(1)));
      }
      /* 回忆：评分 = 各次试验未能回忆词数的平均数（0 = 全部回忆出，10 = 全部未回忆） */
      const n = s.groups.length || 1;
      const sum = s.groups.reduce((a, g, gi) => a + (g.words.length - wordCount(gi)), 0);
      return Math.round(sum / n * 10) / 10;
    });
    const wordMarksN = computed(() => {
      if (!curWordList.value) return 0;
      return wordCount(0) + (curWordList.value.mode === "recognize" ? wordCount(1) : 0);
    });
    const wordScoreText = computed(() => {
      const wl = curWordList.value, s = wordSet.value;
      if (!wl || !s) return "";
      if (wl.mode === "recognize") {
        const miss = s.groups[0].words.length - wordCount(0);
        return `错误 ${wordScore.value} 个 · 旧词漏认 ${miss} · 新词误认 ${wordCount(1)}`;
      }
      const miss = s.groups.map((_, gi) => trialMiss(gi));
      if (miss.length > 1) return `各次未回忆 ${miss.join(" / ")} · 平均 ${wordScore.value} 个`;
      return `未能回忆 ${miss[0]} 个 · 已勾选 ${wordCount(0)} 个`;
    });
    const toggleWord = (gi, w) => {
      const k = gi + "|" + w;
      if (wordState.marks[k]) delete wordState.marks[k]; else wordState.marks[k] = 1;
      const it = curQuizItem.value;
      if (it) quiz.score[it.id] = wordScore.value;
    };
    const pickWordSet = (i) => {
      wordState.set = i; wordState.trial = 0; wordState.marks = {};
      const it = curQuizItem.value;
      if (it) quiz.score[it.id] = wordScore.value;
    };
    /* ---- 命名类条目（ADAS 命名）：勾选「命名正确」的项，按不正确项数自动对应分档 ---- */
    const namingState = reactive({ marks: {} });
    /* 物品线索折叠状态（默认收起，未作答时才需要展开查看） */
    const namingCueOpen = ref(false);
    /* 作答单元注意事项折叠状态（如结构性练习的逐图判定要点，默认收起） */
    const notesOpen = ref(false);
    const curNaming = computed(() => {
      const g = curQuizGuide.value;
      if (!g || !g.naming || !g.naming.groups) return null;
      let k = 0;
      const groups = g.naming.groups.map(x => ({
        t: x.t,
        items: (x.items || []).map(it => ({ ...it, k: k++ })),
      }));
      return { groups, ranges: g.naming.ranges || [], all: groups.flatMap(x => x.items) };
    });
    /* 勾选数 = 命名正确项数 */
    const namingCount = computed(() => {
      const n = curNaming.value;
      if (!n) return 0;
      return n.all.filter(it => namingState.marks[it.k]).length;
    });
    /* 命名不正确项数 = 总项数 − 命名正确项数 */
    const namingWrong = computed(() => {
      const n = curNaming.value;
      return n ? n.all.length - namingCount.value : 0;
    });
    /* 不正确项数 → 对应分档分值（ranges 与 bands 同序） */
    const namingScore = computed(() => {
      const n = curNaming.value;
      if (!n) return null;
      const c = namingWrong.value;
      const i = n.ranges.findIndex(r => c >= r[0] && c <= r[1]);
      if (i < 0) return null;
      const b = curQuizBands.value[i];
      return b ? Number(b[0]) : null;
    });
    /* 物品线索按频率分组（仅右侧主试面板展示，不在左侧清单里露出答案） */
    const namingCues = computed(() => {
      const n = curNaming.value;
      if (!n) return [];
      const order = ["高", "中", "低"];
      const map = new Map();
      n.all.forEach(it => {
        if (!it.cue) return;
        const key = it.f || "其他";
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(it);
      });
      return order.filter(k => map.has(k)).map(k => ({ t: k + "频率词", items: map.get(k) }));
    });
    const toggleNaming = (k) => {
      if (namingState.marks[k]) delete namingState.marks[k]; else namingState.marks[k] = 1;
      const it = curQuizItem.value;
      if (it && namingScore.value !== null) quiz.score[it.id] = namingScore.value;
    };
    /* ---- 延迟回忆（MoCA M15）：勾选 = 自由回忆正确，得分 = 勾选词数；线索回忆折叠展示，不计分 ---- */
    const recallState = reactive({ marks: {}, open: false });
    const curRecall = computed(() => {
      const g = curQuizGuide.value;
      if (!g || !g.recall || !g.recall.items) return null;
      return { t: g.recall.t || "", items: g.recall.items.map((x, i) => ({ ...x, k: i })) };
    });
    const recallCount = computed(() => (curRecall.value
      ? curRecall.value.items.filter(it => recallState.marks[it.k]).length : 0));
    const recallScore = computed(() => (curRecall.value ? recallCount.value : null));
    const toggleRecall = (k) => {
      if (recallState.marks[k]) delete recallState.marks[k]; else recallState.marks[k] = 1;
      const it = curQuizItem.value;
      if (it && recallScore.value !== null) quiz.score[it.id] = recallScore.value;
    };
    /* 需主试逐字念读的数字串（MoCA 警觉性），拆成单字方块便于照读 */
    const curQuizDigits = computed(() => {
      const g = curQuizGuide.value;
      if (!g || !g.digits) return [];
      return String(g.digits).split(/[\s,，]+/).filter(Boolean);
    });
    /* 换题重置勾选；词表类条目按「一个词也没勾」起算（回忆 = 10 分全未回忆，再认 = 10 分全漏认），与纸笔记录单一致 */
    const checkState = reactive({ marks: {} });
    watch(() => quiz.idx + "|" + (quiz.code || ""), () => {
      wordState.set = 0; wordState.trial = 0; wordState.marks = {};
      namingState.marks = {};
      checkState.marks = {};
      errState.v = [null, null, null];
      recState.set = 0; recState.trial = 0; recState.marks = {}; recShowTarget.value = true;
      recallState.marks = {}; recallState.open = false;
      namingCueOpen.value = false;
      notesOpen.value = false;
      const it = curQuizItem.value;
      if (it && curWordList.value && quiz.score[it.id] === undefined) quiz.score[it.id] = wordScore.value;
      if (it && curNaming.value && quiz.score[it.id] === undefined) quiz.score[it.id] = namingScore.value;
      if (it && curChecklist.value && quiz.score[it.id] === undefined) quiz.score[it.id] = checkScore.value;
      if (it && curRecall.value && quiz.score[it.id] === undefined) quiz.score[it.id] = recallScore.value;
      if (it && curRecognize.value && quiz.score[it.id] === undefined) quiz.score[it.id] = recScore.value;
    });

    /* ---- 定向类条目：拆成若干小问逐项勾选。mode=wrong 得分按错误项数（ADAS），
       mode=right 得分按正确项数（MoCA 定向 6 项对几项得几分） ---- */
    const curChecklist = computed(() => {
      const g = curQuizGuide.value;
      if (!g || !g.checklist || !g.checklist.items) return null;
      return {
        t: g.checklist.t || "",
        mode: g.checklist.mode === "right" ? "right" : "wrong",
        cols: g.checklist.cols === 1 ? 1 : 2,
        items: g.checklist.items.map((x, i) => ({ l: x, k: i })),
      };
    });
    const checkCount = computed(() => (curChecklist.value
      ? curChecklist.value.items.filter(x => checkState.marks[x.k]).length : 0));
    const checkWrong = computed(() => (curChecklist.value ? curChecklist.value.items.length - checkCount.value : 0));
    const checkScore = computed(() => {
      const c = curChecklist.value;
      if (!c) return null;
      return c.mode === "right" ? checkCount.value : checkWrong.value;
    });
    const toggleCheck = (k) => {
      if (checkState.marks[k]) delete checkState.marks[k]; else checkState.marks[k] = 1;
      const it = curQuizItem.value;
      if (it && checkScore.value !== null) quiz.score[it.id] = checkScore.value;
    };

    /* ---- 多次测试记错误数的条目（ADAS 单词辨认：三次测试各 0–12，得分 = 平均） ---- */
    const errState = reactive({ v: [null, null, null] });
    const curErrTrials = computed(() => {
      const g = curQuizGuide.value;
      return (g && g.errTrials) ? g.errTrials : null;
    });
    const errScore = computed(() => {
      const c = curErrTrials.value;
      if (!c) return null;
      const vals = errState.v.slice(0, c.n).map(v => (v === null || v === undefined || v === "") ? null : Number(v));
      if (vals.some(v => v === null)) return null;
      const sum = vals.reduce((a, b) => a + b, 0);
      return Math.round(sum / c.n * 10) / 10;
    });
    const applyErrScore = () => {
      const it = curQuizItem.value;
      if (it && errScore.value !== null) quiz.score[it.id] = errScore.value;
    };

    /* ---- 单词辨认（ADAS A07）：三次测试逐词勾「是」，12 个目标词高亮，得分 = 三次错误数平均数 ---- */
    const recState = reactive({ set: 0, trial: 0, marks: {} });
    /* 目标词标记默认显示；被试读词时应隐藏，避免被试据此猜答案 */
    const recShowTarget = ref(true);
    const curRecognize = computed(() => {
      const g = curQuizGuide.value;
      return (g && g.recognize && g.recognize.sets) ? g.recognize : null;
    });
    const recSetIdx = computed(() => {
      const r = curRecognize.value;
      if (!r) return 0;
      return Math.min(recState.set, r.sets.length - 1);
    });
    const recSet = computed(() => {
      const r = curRecognize.value;
      return r ? r.sets[recSetIdx.value] : null;
    });
    const recTrial = computed(() => {
      const s = recSet.value;
      if (!s) return null;
      return s.trials[Math.min(recState.trial, s.trials.length - 1)];
    });
    const recKey = (w, ti) => recSetIdx.value + "|" + (ti === undefined ? recState.trial : ti) + "|" + w;
    const recHit = (w) => !!recState.marks[recKey(w)];
    const recIsTarget = (w) => !!(recSet.value && recSet.value.targets.indexOf(w) >= 0);
    /* 单次错误数 = 目标词漏认 + 非目标词误认（每次最多 12） */
    const recTrialErrors = (ti) => {
      const s = recSet.value;
      if (!s || !s.trials[ti]) return 0;
      let miss = 0, fp = 0;
      s.trials[ti].words.forEach(w => {
        const hit = !!recState.marks[recKey(w, ti)];
        const tgt = s.targets.indexOf(w) >= 0;
        if (hit && !tgt) fp++;
        if (!hit && tgt) miss++;
      });
      return Math.min(12, miss + fp);
    };
    const recErrors = computed(() => {
      const s = recSet.value;
      return s ? s.trials.map((_, i) => recTrialErrors(i)) : [];
    });
    const recScore = computed(() => {
      const e = recErrors.value;
      if (!e.length) return null;
      return Math.round(e.reduce((a, b) => a + b, 0) / e.length * 10) / 10;
    });
    const applyRecScore = () => {
      const it = curQuizItem.value;
      if (it && recScore.value !== null) quiz.score[it.id] = recScore.value;
    };
    const toggleRec = (w) => {
      const k = recKey(w);
      if (recState.marks[k]) delete recState.marks[k]; else recState.marks[k] = 1;
      applyRecScore();
    };
    const pickRecSet = (i) => { recState.set = i; recState.trial = 0; applyRecScore(); };
    const pickRecTrial = (i) => { recState.trial = i; };

    /* 连线题：按顺序点选节点，点完自动连线 */
    const orderNodes = computed(() => (curQuizItem.value && curQuizItem.value.nodes) || []);
    const orderPicked = computed(() => {
      const it = curQuizItem.value;
      if (!it || !quiz.ans[it.id]) return [];
      const v = quiz.ans[it.id].parts[0];
      return v ? String(v).split(",").filter(Boolean) : [];
    });
    const orderSegs = computed(() => {
      const pos = {};
      orderNodes.value.forEach(n => pos[n[0]] = [n[1], n[2]]);
      const pk = orderPicked.value, out = [];
      for (let i = 0; i < pk.length - 1; i++) {
        const a = pos[pk[i]], b = pos[pk[i + 1]];
        if (a && b) out.push([a[0], a[1], b[0], b[1]]);
      }
      return out;
    });
    const pickNode = (label) => {
      const it = curQuizItem.value;
      if (!it || !quiz.ans[it.id]) return;
      const cur = orderPicked.value.slice();
      if (cur.includes(label)) return;
      cur.push(label);
      quiz.ans[it.id].parts[0] = cur.join(",");
    };
    const undoPick = () => {
      const it = curQuizItem.value;
      if (!it || !quiz.ans[it.id]) return;
      const cur = orderPicked.value.slice();
      cur.pop();
      quiz.ans[it.id].parts[0] = cur.join(",");
    };

    const stopSpeak = () => { try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) { } };
    /* 朗读读音补丁：多音字按测验语境固定读法（只作用于语音，不改变界面文字）
       —— 「背出来」的「背」TTS 默认读 bēi，改为同音字「贝」(bèi)；「重复」同理避免读成 zhòng */
    const SPEAK_FIX = [
      [/背(?=出来|一遍|着|给我|下来|诵)/g, "贝"],
      [/重(?=复)/g, "虫"],
    ];
    const speak = (text) => {
      try {
        if (!sound.on || !window.speechSynthesis || !text) return;
        window.speechSynthesis.cancel();
        let s = String(text);
        SPEAK_FIX.forEach(([re, to]) => { s = s.replace(re, to); });
        const u = new SpeechSynthesisUtterance(s);
        u.lang = "zh-CN"; u.rate = 0.85;
        window.speechSynthesis.speak(u);
      } catch (e) { }
    };
    const speakCurrent = () => {
      const it = curQuizItem.value;
      if (!it) return;
      if (isSpan.value) return speak(spanSay.value);   // 数字广度只念阶段指导语，不念题目序列
      speak(isExaminer.value ? curQuizSay.value : it.t);
    };

    /* ================= 数字广度（SPAN）施测引擎 =================
       阶段：顺背练习(1位2个/2位2个) → 开始 → 顺背正式(3–12位) → 倒背练习(1位2个) → 开始 → 倒背正式(2–10位)
       每长度 2 试；每正确背出 1 个序列 1 分；同长度两试均错即终止该方向 */
    const SPAN_SAY_FWD = "下面请您仔细听我说一些数字，当我说完时。请您照样背出来。";
    const SPAN_SAY_BWD = "下面我再说一些数字，您仔细听。当我说完时请您按我说的数字顺序倒着背出来。";
    const span = reactive({
      phase: "practice-fwd",          // practice-fwd | ready-fwd | formal-fwd | practice-bwd | ready-bwd | formal-bwd | done
      gi: 0, trial: 0, chars: [], fb: null,
      score: { fwd: 0, bwd: 0 },
      practice: { fwd: 0, bwd: 0 },
      /* 念读呈现状态：reveal=已显示位数（逐个出现）；hidden=念完已隐藏；reading=正在念读 */
      reveal: 0, hidden: false, reading: false,
    });
    let spanTimer = 0, spanReadTimers = [], spanHideTimer = 0;
    const spanPrepTrial = () => {
      stopSpanRead();
      span.reveal = 0; span.hidden = false; span.reading = false;
    };
    const spanReset = () => {
      clearTimeout(spanTimer); spanTimer = 0; stopSpanRead();
      span.phase = "practice-fwd"; span.gi = 0; span.trial = 0; span.chars = []; span.fb = null;
      span.score.fwd = 0; span.score.bwd = 0; span.practice.fwd = 0; span.practice.bwd = 0;
      spanPrepTrial();
    };
    const spanGroup = (g) => quizItems.value.filter(it => it.g === g);
    const spanPracticeFwd = computed(() => spanGroup("顺背练习"));
    const spanFormalFwd = computed(() => spanGroup("顺背"));
    const spanPracticeBwd = computed(() => spanGroup("倒背练习"));
    const spanFormalBwd = computed(() => spanGroup("倒背"));
    const spanList = computed(() => {
      switch (span.phase) {
        case "practice-fwd": return spanPracticeFwd.value;
        case "formal-fwd": return spanFormalFwd.value;
        case "practice-bwd": return spanPracticeBwd.value;
        case "formal-bwd": return spanFormalBwd.value;
      }
      return [];
    });
    const spanCurItem = computed(() => spanList.value[span.gi] || null);
    const spanCurPart = computed(() => {
      const it = spanCurItem.value;
      return (it && it.parts) ? (it.parts[span.trial] || null) : null;
    });
    const spanSeq = computed(() => (spanCurPart.value ? String(spanCurPart.value.shown || spanCurPart.value.expect || "") : ""));
    const spanExpect = computed(() => (spanCurPart.value ? String(spanCurPart.value.expect || "") : ""));
    const spanLen = computed(() => spanSeq.value.length);
    const spanIsPractice = computed(() => span.phase === "practice-fwd" || span.phase === "practice-bwd");
    const spanDir = computed(() => (span.phase.indexOf("bwd") >= 0 ? "倒背" : "顺背"));
    const spanSay = computed(() => (spanDir.value === "倒背" ? SPAN_SAY_BWD : SPAN_SAY_FWD));
    const spanMax = computed(() => ({
      fwd: spanFormalFwd.value.reduce((a, it) => a + (it.parts || []).length, 0),
      bwd: spanFormalBwd.value.reduce((a, it) => a + (it.parts || []).length, 0),
    }));
    const spanTotal = computed(() => span.score.fwd + span.score.bwd);
    const spanCut = computed(() => {
      const e = (cur.value && cur.value.education) || "";
      return /文盲/.test(e) ? 5 : /小学/.test(e) ? 6 : 7;
    });
    const spanLabel = computed(() => {
      if (span.phase === "ready-fwd" || span.phase === "ready-bwd") return spanDir.value + " · 准备开始";
      if (span.phase === "done") return "测验完成";
      const it = spanCurItem.value;
      if (!it) return "";
      const multi = (it.parts || []).length > 1;
      return (spanIsPractice.value ? "练习 · " : "") + spanDir.value + " " + it.len + " 位" + (multi ? " · 第 " + (span.trial + 1) + " 试" : "");
    });
    const spanProgress = computed(() => {
      const list = spanList.value;
      if (!list.length) return "";
      return (span.gi + 1) + " / " + list.length;
    });
    /* 逐题对错：parts 与 expect 一一比对（供终止判断与计分复用） */
    const spanPartOk = (it, i) => {
      const a = quiz.ans[it.id];
      const v = a && a.parts ? a.parts[i] : "";
      const p = (it.parts || [])[i];
      return !!p && v !== "" && v != null && String(v) === String(p.expect);
    };
    const spanItemCorrect = (it) => (it.parts || []).reduce((a, p, i) => a + (spanPartOk(it, i) ? 1 : 0), 0);
    const spanPush = (d) => {
      if (span.fb || span.phase === "done" || span.phase.indexOf("ready") === 0) return;
      if (span.reading || !span.hidden) return;      // 未念读 / 正在念读时不允许录入
      if (span.chars.length >= spanLen.value) return;
      span.chars.push(String(d));
    };
    const spanBack = () => { if (!span.fb && span.hidden) span.chars.pop(); };
    const spanJudge = () => {
      if (span.fb || !spanCurPart.value || !span.hidden) return;
      const got = span.chars.join("");
      const exp = spanExpect.value;
      const ok = got === exp;
      const it = spanCurItem.value;
      if (it && quiz.ans[it.id]) {
        quiz.ans[it.id].parts[span.trial] = got;
        quiz.ans[it.id].sec = (quiz.ans[it.id].sec || 0) + 1;
      }
      if (spanIsPractice.value) {
        if (ok) span.practice[spanDir.value === "倒背" ? "bwd" : "fwd"]++;
      } else if (ok) {
        span.score[spanDir.value === "倒背" ? "bwd" : "fwd"]++;
      }
      span.fb = { ok, got, exp };
      clearTimeout(spanTimer);
      spanTimer = setTimeout(spanNext, ok ? 900 : 1600);
    };
    /* 进入某方向：顺背正式 → 倒背练习 → 倒背正式 */
    const spanEnter = (phase) => {
      span.phase = phase; span.gi = 0; span.trial = 0; span.chars = []; span.fb = null;
      spanPrepTrial();
      nextTick(() => speakCurrent());
    };
    const spanNext = () => {
      clearTimeout(spanTimer);
      span.fb = null; span.chars = [];
      spanPrepTrial();
      const it = spanCurItem.value, list = spanList.value;
      if (!it) return;
      if (spanIsPractice.value) {
        if (span.gi + 1 < list.length) { span.gi++; return; }
        span.gi = 0; span.trial = 0;
        span.phase = span.phase === "practice-fwd" ? "ready-fwd" : "ready-bwd";
        nextTick(() => speak(spanSay.value));
        return;
      }
      const multi = (it.parts || []).length > 1;
      if (multi && span.trial === 0) { span.trial = 1; return; }
      // 一个长度做完：2 试均错 → 终止该方向
      const oks = (it.parts || []).map((p, i) => spanPartOk(it, i));
      if (!oks.some(Boolean)) {
        if (span.phase === "formal-fwd") return spanEnter("practice-bwd");
        return spanEnter("done");
      }
      if (span.gi + 1 < list.length) { span.gi++; span.trial = 0; return; }
      if (span.phase === "formal-fwd") return spanEnter("practice-bwd");
      spanEnter("done");
    };
    const spanStartFormal = () => {
      clearTimeout(spanTimer); stopSpanRead();
      spanEnter(span.phase === "ready-fwd" ? "formal-fwd" : "formal-bwd");
    };
    /* 逐位念读：每秒 1 个数字，边念边逐个显示；念完自动隐藏数字，只保留输入区
       （隐藏是防被试照着屏幕复述；静音时计时照走，只是不发声，避免卡在「未念读」状态） */
    const stopSpanRead = () => {
      spanReadTimers.forEach(t => clearTimeout(t)); spanReadTimers = [];
      if (spanHideTimer) { clearTimeout(spanHideTimer); spanHideTimer = 0; }
    };
    const spanReadDigits = () => {
      if (!spanSeq.value || span.reading || span.hidden) return;
      stopSpanRead(); stopSpeak();
      const ds = spanSeq.value.split("");
      span.reveal = 0; span.reading = true;
      ds.forEach((d, i) => {
        spanReadTimers.push(setTimeout(() => {
          span.reveal = i + 1;
          if (!sound.on || !window.speechSynthesis) return;
          try {
            const u = new SpeechSynthesisUtterance(d);
            u.lang = "zh-CN"; u.rate = 0.8;
            window.speechSynthesis.speak(u);
          } catch (e) { }
        }, i * 1000));
      });
      spanHideTimer = setTimeout(() => {
        spanHideTimer = 0;
        span.reading = false; span.hidden = true; span.reveal = 0;
      }, (ds.length - 1) * 1000 + 900);
    };
    /* 键盘录入：数字键追加、退格删除、回车提交（外接键盘时不必点屏幕） */
    const spanKeydown = (e) => {
      if (!quiz.on || !isSpan.value || span.phase.indexOf("ready") === 0 || span.phase === "done") return;
      if (!span.hidden || span.reading) return;
      if (/^[0-9]$/.test(e.key)) { e.preventDefault(); spanPush(e.key); return; }
      if (e.key === "Backspace") { e.preventDefault(); spanBack(); return; }
      if (e.key === "Enter") { e.preventDefault(); spanJudge(); }
    };
    window.addEventListener("keydown", spanKeydown);
    /* 完成：先存作答，再按题目化计分写范式结果（顺背/倒背/总分 + 教育分层判读） */
    const spanSave = async (finish) => {
      const answers = {};
      const scores = {};
      quizItems.value.forEach((it) => {
        const a = quiz.ans[it.id];
        if (!a) return;
        if (!(a.parts || []).some(v => v !== "" && v != null)) return;
        answers[it.id] = a;
        if (!it.demo) scores[it.id] = spanItemCorrect(it);
      });
      await api("/assessments/" + runRec.value + "/answers", { method: "POST", body: { code: "SPAN", answers, reset: true } });
      if (finish) await api("/assessments/" + runRec.value + "/paradigm", { method: "POST", body: { code: "SPAN", answers: scores } });
    };
    const spanFinish = async () => {
      const name = quiz.meta ? quiz.meta.name : "数字广度测验";
      try {
        await spanSave(true);
        quiz.on = false; stopSpeak(); stopSpanRead();
        await loadRun();
        if (allDone.value) return msg.success("全部评估项目已完成，可评分并提交");
        const next = scaleCards.value.find(c => !c.det && c.meta && c.meta.items)
          || paraCards.value.find(c => !c.det && c.meta && c.meta.items);
        if (!next) return msg.success(name + " 已完成，结果已记录");
        try {
          await mbx.confirm(`已完成「${name}」，是否继续评估「${next.meta.name}」？`, "继续评估",
            { type: "info", confirmButtonText: "继续评估", cancelButtonText: "稍后" });
          startQuiz(next.meta);
        } catch (e) { /* 医生选择稍后 */ }
      } catch (e) { msg.error(e.message); }
    };

    /* ================= 符号数字转换测验（SDMT）施测引擎 =================
       测试前练习（15 格，即时判对错、可改）→ 点「开始」→ 90 秒正式表（7 行 × 15 格 = 105 格）
       得分 = 90 秒内正确填写的个数（练习不计分）；错误个数另记；到点自动停止 */
    const sdmt = reactive({ phase: "practice", cur: 0, filled: {}, prac: {}, left: 90, practiceCur: 0, tip: "" });
    let sdmtTimer = 0;
    const sdmtCfg = computed(() => (quiz.meta && quiz.meta.cfg) || {});
    const sdmtKey = computed(() => sdmtCfg.value.key || []);
    const sdmtPrac = computed(() => sdmtCfg.value.practice || []);
    const sdmtRows = computed(() => sdmtCfg.value.rows || []);
    const sdmtCols = computed(() => sdmtCfg.value.cols || 15);
    const sdmtCells = computed(() => sdmtRows.value.reduce((a, r) => a + r.length, 0));
    const sdmtMax = computed(() => sdmtCfg.value.maxScore || 110);
    const sdmtCut = computed(() => sdmtCfg.value.cutoff || 21);
    const sdmtDur = computed(() => sdmtCfg.value.duration || 90);
    const sdmtSym = (n) => (sdmtKey.value[n - 1] || {}).sym || "plus";
    const sdmtAnsOf = (i) => (sdmtRows.value[Math.floor(i / sdmtCols.value)] || [])[i % sdmtCols.value];
    const sdmtReset = () => {
      clearInterval(sdmtTimer); sdmtTimer = 0;
      sdmt.phase = "practice"; sdmt.cur = 0; sdmt.filled = {}; sdmt.prac = {};
      sdmt.practiceCur = 0; sdmt.left = sdmtDur.value;
    };
    const sdmtClock = computed(() => {
      const s = Math.max(0, sdmt.left);
      return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
    });
    const sdmtLabel = computed(() => {
      if (sdmt.phase === "practice") return "测试前练习";
      if (sdmt.phase === "running") return "90 秒计时 · 剩余 " + sdmtClock.value;
      return "时间到 · 作答结束";
    });
    const sdmtStat = computed(() => {
      let ok = 0, bad = 0, filled = 0;
      Object.keys(sdmt.filled).forEach(k => {
        const v = sdmt.filled[k]; if (!v) return;
        filled++;
        if (Number(v) === Number(sdmtAnsOf(Number(k)))) ok++; else bad++;
      });
      return { ok, bad, filled };
    });
    /* 按记录单要求「不要跳格」：只能填第一个空格，或回头修改已填的格子 */
    const sdmtFront = computed(() => {
      const n = sdmtCells.value;
      for (let i = 0; i < n; i++) if (!sdmt.filled[i]) return i;
      return n;
    });
    const sdmtPracFront = computed(() => {
      const list = sdmtPrac.value;
      for (let i = 0; i < list.length; i++) if (!sdmt.prac[i]) return i;
      return list.length;
    });
    const SDMT_SKIP_TIP = "请按顺序填写，不要跳过任何一个";
    const sdmtFocus = (i) => {
      if (sdmt.phase !== "running") return;
      if (i > sdmtFront.value) { sdmt.tip = SDMT_SKIP_TIP; return; }
      sdmt.cur = i; sdmt.tip = "";
    };
    const sdmtFocusPrac = (i) => {
      if (sdmt.phase !== "practice") return;
      if (i > sdmtPracFront.value) { sdmt.tip = SDMT_SKIP_TIP; return; }
      sdmt.practiceCur = i; sdmt.tip = "";
    };
    const sdmtType = (d) => {
      if (sdmt.phase === "practice") {
        const i = sdmt.practiceCur;
        if (i >= sdmtPrac.value.length) return;
        sdmt.prac[i] = String(d);
        sdmt.tip = "";
        /* 练习填错时停在该格，提示正确数字并等主试纠正后再前进 */
        if (Number(d) === Number(sdmtPrac.value[i])) {
          sdmt.practiceCur = Math.min(sdmtPracFront.value, sdmtPrac.value.length - 1);
        }
        return;
      }
      if (sdmt.phase !== "running" || sdmt.cur >= sdmtCells.value) return;
      sdmt.filled[sdmt.cur] = String(d);
      sdmt.tip = "";
      sdmt.cur = Math.min(sdmtFront.value, sdmtCells.value - 1);
    };
    const sdmtBack = () => {
      if (sdmt.phase === "practice") {
        if (sdmt.prac[sdmt.practiceCur]) delete sdmt.prac[sdmt.practiceCur];
        else if (sdmt.practiceCur > 0) { sdmt.practiceCur--; delete sdmt.prac[sdmt.practiceCur]; }
        return;
      }
      if (sdmt.phase !== "running") return;
      if (sdmt.filled[sdmt.cur]) delete sdmt.filled[sdmt.cur];
      else if (sdmt.cur > 0) { sdmt.cur--; delete sdmt.filled[sdmt.cur]; }
      sdmt.tip = "";
    };
    const sdmtStop = () => {
      clearInterval(sdmtTimer); sdmtTimer = 0;
      if (sdmt.phase === "running") sdmt.phase = "done";
    };
    const sdmtStart = () => {
      sdmt.phase = "running"; sdmt.cur = 0; sdmt.filled = {}; sdmt.left = sdmtDur.value;
      clearInterval(sdmtTimer);
      sdmtTimer = setInterval(() => {
        sdmt.left--;
        if (sdmt.left <= 0) { sdmt.left = 0; sdmtStop(); }
      }, 1000);
    };
    const sdmtPracOk = (i) => Number(sdmt.prac[i]) === Number(sdmtPrac.value[i]);
    const sdmtPracFilled = computed(() => Object.keys(sdmt.prac).filter(k => sdmt.prac[k]).length);
    /* 键盘录入：数字键填写并自动跳下一格，退格删除并回退（外接键盘 / 触屏数字条共用） */
    const sdmtKeydown = (e) => {
      if (!quiz.on || !isSdmt.value || sdmt.phase === "done") return;
      if (/^[1-9]$/.test(e.key)) { e.preventDefault(); sdmtType(e.key); return; }
      if (e.key === "Backspace") { e.preventDefault(); sdmtBack(); }
    };
    window.addEventListener("keydown", sdmtKeydown);
    const sdmtSave = async (finish) => {
      /* 整张作答表按「行内 15 字符、行间 | 分隔、_ 表示空」留存，便于复核具体错在哪格 */
      const sheet = sdmtRows.value
        .map((row, ri) => row.map((_, ci) => sdmt.filled[ri * sdmtCols.value + ci] || "_").join("")).join("|");
      const answers = { S1: { parts: [sheet], sec: sdmtDur.value - sdmt.left } };
      await api("/assessments/" + runRec.value + "/answers", { method: "POST", body: { code: "SDMT", answers, reset: true } });
      /* 施测端已逐格比对出正确数，先写进评分表（评分页可复核修改），避免评分页显示 0 分 */
      await api("/assessments/" + runRec.value + "/review-scores", {
        method: "POST", body: { code: "SDMT", scores: { S1: sdmtStat.value.ok } },
      });
      if (finish) await api("/assessments/" + runRec.value + "/paradigm", {
        method: "POST",
        body: {
          code: "SDMT",
          answers: { S1: sdmtStat.value.ok },
          raw: { count: sdmtStat.value.ok, wrong: sdmtStat.value.bad, filled: sdmtStat.value.filled, duration: sdmtDur.value },
        },
      });
    };
    const sdmtFinish = async () => {
      const name = quiz.meta ? quiz.meta.name : "符号数字转换测验";
      try {
        await sdmtSave(true);
        quiz.on = false; stopSpeak(); sdmtStop();
        await loadRun();
        if (allDone.value) return msg.success("全部评估项目已完成，可评分并提交");
        const next = scaleCards.value.find(c => !c.det && c.meta && c.meta.items)
          || paraCards.value.find(c => !c.det && c.meta && c.meta.items);
        if (!next) return msg.success(name + " 已完成，结果已记录");
        try {
          await mbx.confirm(`已完成「${name}」，是否继续评估「${next.meta.name}」？`, "继续评估",
            { type: "info", confirmButtonText: "继续评估", cancelButtonText: "稍后" });
          startQuiz(next.meta);
        } catch (e) { /* 医生选择稍后 */ }
      } catch (e) { msg.error(e.message); }
    };

    /* ================= 连线测试（TMT-A/B）施测引擎 =================
       顺序：A 部分练习 → A 部分测试 → B 部分练习 → B 部分测试。
       作答纸上每个圆圈是一个可点节点，被试点到一个节点就落一条线：
         · 点对下一个应连节点 → 连线前进；
         · 跳过应连节点去点后一个 → 记 1 次「忽略错误」；
         · 点其它任意节点 → 记 1 次「连接错误」。
       计时从被试连到起点（1）开始，连到终点停表；B 部分 300 秒未完成记 300 秒。 */
    const TMT_ORDER = ["A_prac", "A_test", "B_prac", "B_test"];
    const tmt = reactive({
      stage: "A_prac", pos: 0, path: [], started: 0, elapsed: 0,
      err: 0, skip: 0, bad: "", tip: "", tipKind: "",
      done: false, result: { A_prac: null, A_test: null, B_prac: null, B_test: null }, guideOpen: false,
    });
    let tmtTimer = 0, tmtBadTimer = 0;
    const tmtCfg = computed(() => (quiz.meta && quiz.meta.cfg) || {});
    const tmtBoards = computed(() => tmtCfg.value.boards || {});
    const tmtBoard = computed(() => tmtBoards.value[tmt.stage] || { nodes: [], seq: [], w: 727, h: 846 });
    const tmtSeq = computed(() => tmtBoard.value.seq || []);
    const tmtNodes = computed(() => tmtBoard.value.nodes || []);
    const tmtIsPrac = computed(() => /_prac$/.test(tmt.stage));
    const tmtPart = computed(() => tmt.stage.charAt(0));
    const tmtLimit = computed(() => (tmtPart.value === "B" ? (tmtCfg.value.limitB || 300) : (tmtCfg.value.limitA || 300)));
    const tmtReset = () => {
      clearInterval(tmtTimer); clearTimeout(tmtBadTimer); tmtTimer = 0;
      tmt.stage = "A_prac"; tmt.pos = 0; tmt.path = []; tmt.started = 0; tmt.elapsed = 0;
      tmt.err = 0; tmt.skip = 0; tmt.bad = ""; tmt.tip = ""; tmt.tipKind = "";
      tmt.done = false;
      ["A_prac", "A_test", "B_prac", "B_test"].forEach((k) => { tmt.result[k] = null; });
    };
    const tmtLabel = computed(() => {
      const map = { A_prac: "A 部分 · 练习", A_test: "A 部分 · 测试", B_prac: "B 部分 · 练习", B_test: "B 部分 · 测试" };
      return map[tmt.stage] || "连线测试";
    });
    const tmtSec = computed(() => Math.round(tmt.elapsed));
    const tmtClock = computed(() => {
      const s = Math.max(0, tmtSec.value);
      return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
    });
    const tmtLeft = computed(() => Math.max(0, tmtLimit.value - tmtSec.value));
    const tmtNextKey = computed(() => tmtSeq.value[tmt.pos] || "");
    const tmtPts = computed(() => tmt.path.map((k) => {
      const n = tmtNodes.value.find((x) => x.k === k);
      return n ? n.x + "," + n.y : "";
    }).filter(Boolean).join(" "));
    const tmtNodeOf = (k) => tmtNodes.value.find((x) => x.k === k) || null;
    const tmtStartNode = computed(() => tmtNodeOf(tmtBoard.value.begin));
    const tmtEndNode = computed(() => tmtNodeOf(tmtBoard.value.end));
    const tmtGuideIdx = computed(() => Math.max(0, TMT_ORDER.indexOf(tmt.stage)));
    const tmtGuideText = computed(() => {
      const st = (paraGuide.value && paraGuide.value.steps) || [];
      const s = st[tmtGuideIdx.value];
      return s ? s.d : "";
    });
    const tmtPct = computed(() => (tmtSeq.value.length ? Math.round((tmt.pos / tmtSeq.value.length) * 100) : 0));
    /* 当前阶段的成绩快照（练习与正式分开存，练习不会顶掉正式数据） */
    const tmtCur = computed(() => tmt.result[tmt.stage] || null);
    /* 某一部分（A/B）的正式成绩：测完取快照，正在测取实时值 */
    const tmtStatOf = (part) => {
      const key = part + "_test";
      const r = tmt.result[key];
      if (r) return r;
      if (tmt.stage !== key) return null;
      return { sec: tmtSec.value, err: tmt.err, skip: tmt.skip, completed: false, live: true };
    };
    const tmtStartTimer = () => {
      clearInterval(tmtTimer);
      tmt.started = Date.now(); tmt.elapsed = 0;
      tmtTimer = setInterval(() => {
        if (!tmt.started || tmt.done) return;
        tmt.elapsed = (Date.now() - tmt.started) / 1000;
        if (tmt.elapsed >= tmtLimit.value) { tmt.elapsed = tmtLimit.value; tmtEndPart(false); }
      }, 200);
    };
    const tmtFlash = (k) => {
      tmt.bad = k; clearTimeout(tmtBadTimer);
      tmtBadTimer = setTimeout(() => { tmt.bad = ""; }, 900);
    };
    /* 点一个节点：判对 / 判漏 / 判错，练习只提示不计数 */
    const tmtTouch = (k) => {
      if (!quiz.on || !isTmt.value || tmt.done) return;
      const seq = tmtSeq.value, want = seq[tmt.pos], idx = seq.indexOf(k);
      if (idx < 0) return;
      if (idx === tmt.pos) {
        if (tmt.pos === 0) tmtStartTimer();
        tmt.path.push(k); tmt.pos = idx + 1;
        tmt.tip = ""; tmt.tipKind = ""; tmt.bad = "";
        if (tmt.pos >= seq.length) tmtEndPart(true);
        return;
      }
      if (!tmtIsPrac.value) { if (idx === tmt.pos + 1) tmt.skip++; else tmt.err++; }
      tmtFlash(k);
      if (idx === tmt.pos + 1) {
        tmt.tip = "漏掉了「" + want + "」：请回到「" + want + "」继续"; tmt.tipKind = "skip";
      } else {
        tmt.tip = "连错了：这里应该连「" + want + "」"; tmt.tipKind = "bad";
      }
    };
    /* 练习阶段允许撤销一步（演示用；测试阶段不提供，避免把错误擦掉） */
    const tmtUndo = () => {
      if (!tmtIsPrac.value || !tmt.path.length) return;
      tmt.path.pop(); tmt.pos = Math.max(0, tmt.pos - 1);
      tmt.tip = ""; tmt.tipKind = "";
      if (!tmt.path.length) { clearInterval(tmtTimer); tmtTimer = 0; tmt.started = 0; tmt.elapsed = 0; }
    };
    const tmtEndPart = async (completed) => {
      clearInterval(tmtTimer); tmtTimer = 0;
      const sec = completed ? Math.max(1, Math.round(tmt.elapsed)) : tmtLimit.value;
      tmt.result[tmt.stage] = { sec, err: tmt.err, skip: tmt.skip, completed: !!completed };
      tmt.done = true;
      tmt.tip = ""; tmt.tipKind = "";
      /* 练习不计分也不落库；正式部分随时落库，避免中途退出丢掉已测数据 */
      if (!tmtIsPrac.value) { try { await tmtSave(false); } catch (e) { /* 保存失败不阻塞施测 */ } }
    };
    const tmtNextLabel = computed(() => {
      if (tmt.stage === "A_prac") return "开始 A 部分测试";
      if (tmt.stage === "A_test") return "进入 B 部分练习";
      if (tmt.stage === "B_prac") return "开始 B 部分测试";
      return "完成并记录";
    });
    const tmtNext = () => {
      if (!tmt.done) return;
      if (tmt.stage === "B_test") return tmtFinish();
      tmt.stage = TMT_ORDER[TMT_ORDER.indexOf(tmt.stage) + 1];
      tmt.pos = 0; tmt.path = []; tmt.err = 0; tmt.skip = 0;
      tmt.started = 0; tmt.elapsed = 0; tmt.done = false;
      tmt.bad = ""; tmt.tip = ""; tmt.tipKind = "";
      clearInterval(tmtTimer); tmtTimer = 0;
    };
    /* 落库：完成时间写评分表（评分页可改），连接/忽略错误数随作答留存 */
    const tmtSave = async (finish) => {
      const pack = (p) => {
        const r = tmt.result[p + "_test"];
        if (!r) return null;
        return { parts: [r.sec], sec: r.sec, err: r.err, skip: r.skip, completed: r.completed };
      };
      const A = pack("A"), B = pack("B");
      const answers = {}, scores = {};
      if (A) { answers.TA = A; scores.TA = A.sec; }
      if (B) { answers.TB = B; scores.TB = B.sec; }
      if (!Object.keys(answers).length) return;
      await api("/assessments/" + runRec.value + "/answers", { method: "POST", body: { code: "TMT", answers, reset: true } });
      await api("/assessments/" + runRec.value + "/review-scores", { method: "POST", body: { code: "TMT", scores } });
      if (finish) await api("/assessments/" + runRec.value + "/paradigm", {
        method: "POST",
        body: {
          code: "TMT",
          answers: scores,
          answerMap: { TA: A, TB: B },
          raw: {
            timeA: A ? A.sec : 0, timeB: B ? B.sec : 0,
            errA: A ? A.err : 0, skipA: A ? A.skip : 0,
            errB: B ? B.err : 0, skipB: B ? B.skip : 0,
          },
        },
      });
    };
    const tmtFinish = async () => {
      const name = quiz.meta ? quiz.meta.name : "连线测试";
      try {
        await tmtSave(true);
        quiz.on = false; stopSpeak(); clearInterval(tmtTimer); tmtTimer = 0;
        await loadRun();
        if (allDone.value) return msg.success("全部评估项目已完成，可评分并提交");
        const next = scaleCards.value.find(c => !c.det && c.meta && c.meta.items)
          || paraCards.value.find(c => !c.det && c.meta && c.meta.items);
        if (!next) return msg.success(name + " 已完成，结果已记录");
        try {
          await mbx.confirm(`已完成「${name}」，是否继续评估「${next.meta.name}」？`, "继续评估",
            { type: "info", confirmButtonText: "继续评估", cancelButtonText: "稍后" });
          startQuiz(next.meta);
        } catch (e) { /* 医生选择稍后 */ }
      } catch (e) { msg.error(e.message); }
    };

    /* ================= Stroop 色词测验（SCWT）施测引擎 =================
       三张卡片 A（黑字读字）→ B（圆点读色）→ C（彩字读墨色）。
       主试持机：被试试读一个，主试按「读对 / 读错」，光标右移一格；读完 50 格自动停表。
       评分为完成时间与正确数，SIE = 卡片 C − 卡片 B（耗时差、准确数差）。 */
    const ST_ORDER = ["A", "B", "C"];
    const st = reactive({
      phase: "ready",           // ready（准备页）| run（施测中）| done（本卡结算）
      card: "A", idx: 0, ok: 0, bad: 0, marks: [],
      said: {},                 // 卡片 C：被试每格读出的颜色（用于判对错与统计「读成字义」）
      started: 0, elapsed: 0, guideOpen: false, tip: "",
      open: { A: true, B: false, C: false },   // 右侧面板各卡片的展开状态
      result: { A: null, B: null, C: null },
    });
    let stTimer = 0;
    const stCfg = computed(() => (quiz.meta && quiz.meta.cfg) || {});
    const stCards = computed(() => stCfg.value.cards || {});
    const stCard = computed(() => stCards.value[st.card] || { name: "", kind: "word", cells: [], task: "" });
    const stCells = computed(() => stCard.value.cells || []);
    const stKind = computed(() => stCard.value.kind || "word");
    const stInk = computed(() => stCfg.value.ink || {});
    const stPer = computed(() => stCfg.value.perCard || 50);
    const stCut = computed(() => stCfg.value.cutoff || 39);
    const stSec = computed(() => Math.round(st.elapsed));
    const stClock = computed(() => {
      const v = Math.max(0, stSec.value);
      return String(Math.floor(v / 60)).padStart(2, "0") + ":" + String(v % 60).padStart(2, "0");
    });
    const stLabel = computed(() => {
      const base = { A: "卡片 A · 词语任务", B: "卡片 B · 颜色任务", C: "卡片 C · 色词任务" }[st.card] || "Stroop";
      if (st.phase === "ready") return base + " · 准备";
      if (st.phase === "run") return base + " · 计时中";
      return base + " · 完成";
    });
    const stGuideIdx = computed(() => Math.max(0, ST_ORDER.indexOf(st.card)));
    const stGuideText = computed(() => {
      const steps = (paraGuide.value && paraGuide.value.steps) || [];
      const s = steps[stGuideIdx.value];
      return s ? s.d : "";
    });
    const stCur = computed(() => st.result[st.card] || null);
    /* 四色清单（顺序即 1–4 快捷键与按钮顺序） */
    const stColors = computed(() => stCfg.value.colors || ["红", "黄", "蓝", "绿"]);
    /* 卡片 C 专项：把字义当颜色读出来的次数（Stroop 干扰的典型错误形态）。
       只统计「字义 ≠ 墨色」的真冲突格——字义本＝墨色的格子无法区分是读字还是读色，不计。 */
    const stSemantic = computed(() => {
      const cells = stCells.value;
      let n = 0;
      for (let i = 0; i < st.idx; i++) {
        const c = cells[i], said = st.said[i];
        if (said && c && c.w && c.w !== c.ink && said === c.w) n++;
      }
      return n;
    });
    /* 右侧面板「测试进程」：三张卡片的进度与评估操作 */
    const stPanelCards = computed(() => {
      const steps = (paraGuide.value && paraGuide.value.steps) || [];
      const NAME = { A: "词语任务", B: "颜色任务", C: "色词任务" };
      return ST_ORDER.map((k, i) => {
        const r = st.result[k];
        const cur = st.card === k;
        const live = cur && st.phase === "run";
        return {
          k, name: NAME[k],
          op: (steps[i] && steps[i].d) || "",
          state: r ? "done" : (cur ? "now" : "todo"),
          stateText: r ? "已完成" : (live ? "计时中" : (cur ? "待开始" : "未开始")),
          open: !!st.open[k],
        };
      });
    });
    /* 右侧面板「本题评分」：卡片 A/B/C 各自算，另加 SIE 耗时数与 SIE 准确数 */
    const stItemScore = computed(() => {
      const rows = ST_ORDER.map((k) => {
        const r = st.result[k];
        const live = st.card === k && st.phase === "run";
        const stat = r || (live ? { sec: stSec.value, ok: st.ok, bad: st.bad } : null);
        const semantic = k === "C" ? (r ? r.semantic : (live ? stSemantic.value : null)) : null;
        return {
          k, on: st.card === k,
          sec: stat ? stat.sec : "—",
          ok: stat ? stat.ok : "—",
          bad: stat ? stat.bad : "—",
          semantic: semantic == null ? null : semantic,
          flag: r && r.completed === false ? "未读完" : "",
        };
      });
      const B = st.result.B, C = st.result.C;
      const sign = (v) => (v > 0 ? "+" : "") + v;
      return {
        rows,
        /* 记录单：SIE 耗时数 = 完成 C − 完成 B；SIE 准确数 = 正确 C − 正确 B */
        sieSec: B && C ? sign(C.sec - B.sec) + " 秒" : "—",
        sieOk: B && C ? sign(C.ok - B.ok) + " 个" : "—",
      };
    });
    const stToggleCard = (k) => { st.open[k] = !st.open[k]; };
    /* 卡片 C 点颜色：按当前格「墨色」判对错，并记下被试实际读的颜色 */
    const stMarkColor = (c) => {
      if (st.phase !== "run" || st.idx >= stCells.value.length) return;
      const cell = stCells.value[st.idx];
      const ink = stKind.value === "dot" ? cell : (cell && cell.ink);
      const good = ink === c;
      st.said[st.idx] = c;
