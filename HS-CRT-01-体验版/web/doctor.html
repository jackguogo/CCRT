      st.tip = good ? "" : "错：应读「" + ink + "」，被试读「" + c + "」" + (cell && cell.w && c === cell.w ? "（读成了字义）" : "");
      stMark(good);
    };
    const stStatOf = (k) => {
      const r = st.result[k];
      if (r) return r;
      if (st.card !== k) return null;
      return { sec: stSec.value, ok: st.ok, bad: st.bad, read: st.idx, completed: false, live: true };
    };
    const stReset = () => {
      clearInterval(stTimer); stTimer = 0;
      st.phase = "ready"; st.card = "A"; st.idx = 0; st.ok = 0; st.bad = 0; st.marks = [];
      st.said = {}; st.open.A = true; st.open.B = false; st.open.C = false;
      st.started = 0; st.elapsed = 0; st.tip = "";
      ST_ORDER.forEach((k) => { st.result[k] = null; });
    };
    const stStart = () => {
      st.phase = "run"; st.idx = 0; st.ok = 0; st.bad = 0; st.marks = []; st.said = {};
      st.started = Date.now(); st.elapsed = 0; st.tip = "";
      clearInterval(stTimer);
      stTimer = setInterval(() => {
        if (!st.started || st.phase !== "run") return;
        st.elapsed = (Date.now() - st.started) / 1000;
      }, 100);
    };
    /* 逐格判对错：正确 → 光标右移；读完 50 格自动停表 */
    const stMark = (good) => {
      if (st.phase !== "run") return;
      if (st.idx >= stCells.value.length) return;
      st.marks[st.idx] = good ? 1 : 0;
      if (good) st.ok++; else st.bad++;
      st.idx++;
      if (st.idx >= stCells.value.length) stEndCard(true);
    };
    const stUndo = () => {
      if (st.phase !== "run" || st.idx <= 0) return;
      st.idx--;
      const m = st.marks[st.idx];
      if (m === 1) st.ok--; else if (m === 0) st.bad--;
      st.marks[st.idx] = null;
      st.said[st.idx] = null;
      st.tip = "";
    };
    const stEndCard = async (completed) => {
      clearInterval(stTimer); stTimer = 0;
      st.result[st.card] = {
        sec: Math.max(0, Math.round(st.elapsed)), ok: st.ok, bad: st.bad,
        read: st.idx, completed: !!completed,
        semantic: st.card === "C" ? stSemantic.value : null,
      };
      st.phase = "done"; st.tip = "";
      try { await stSave(false); } catch (e) { /* 保存失败不阻塞施测 */ }
    };
    const stNextLabel = computed(() => (st.card === "A" ? "进入卡片 B" : st.card === "B" ? "进入卡片 C" : "完成并记录"));
    const stNext = () => {
      if (st.phase !== "done") return;
      if (st.card === "C") return stFinish();
      st.card = ST_ORDER[ST_ORDER.indexOf(st.card) + 1];
      st.phase = "ready"; st.idx = 0; st.ok = 0; st.bad = 0; st.marks = []; st.said = {};
      st.open.A = st.card === "A"; st.open.B = st.card === "B"; st.open.C = st.card === "C";
      st.started = 0; st.elapsed = 0; st.tip = "";
      clearInterval(stTimer); stTimer = 0;
    };
    const stSave = async (finish) => {
      const pack = (k) => {
        const r = st.result[k];
        if (!r) return null;
        return {
          parts: [r.sec], sec: r.sec, ok: r.ok, bad: r.bad, read: r.read,
          completed: r.completed, semantic: r.semantic == null ? undefined : r.semantic,
        };
      };
      const A = pack("A"), B = pack("B"), C = pack("C");
      const answers = {}, scores = {};
      if (A) answers.SA = A;
      if (B) answers.SB = B;
      if (C) answers.SC = C;
      /* 本题只有一个计分项 S1：满分 50，得分 = 卡片 C 正确数；
         A/B 用时、读成字义、SIE 只作主试评估，仍按卡片记在 SA/SB/SC 里 */
      if (C) {
        answers.S1 = { parts: [C.ok], sec: C.sec, completed: C.completed };
        scores.S1 = C.ok;
      }
      if (!Object.keys(answers).length) return;
      await api("/assessments/" + runRec.value + "/answers", { method: "POST", body: { code: "STROOP", answers, reset: true } });
      if (Object.keys(scores).length) {
        await api("/assessments/" + runRec.value + "/review-scores", { method: "POST", body: { code: "STROOP", scores } });
      }
      if (finish) await api("/assessments/" + runRec.value + "/paradigm", {
        method: "POST",
        body: { code: "STROOP", answers: scores, answerMap: { SA: A, SB: B, SC: C } },
      });
    };
    const stFinish = async () => {
      const name = quiz.meta ? quiz.meta.name : "Stroop 色词测验";
      try {
        await stSave(true);
        quiz.on = false; stopSpeak(); clearInterval(stTimer); stTimer = 0;
        await loadRun();
        if (allDone.value) return msg.success("全部评估项目已完成，可评分并提交");
        const next = scaleCards.value.find(c => !c.det && c.meta && c.meta.items)
          || paraCards.value.find(c => !c.det && c.meta && c.meta.items);
        if (!next) return msg.success(name + " 已完成，结果已记录");
        try {
          await mbx.confirm(`已完成「${name}」，是否继续评估「${next.meta.name}」？`, "继续评估",
            { type: "info", confirmButtonText: "继续评估", cancelButtonText: "稍后" });
          startQuiz(next.meta);
        } catch (e) { /* 医生选择稍后 */ }
      } catch (e) { msg.error(e.message); }
    };
    /* 键盘：空格/回车 = 读对，X = 读错，退格 = 撤销 */
    const stKeydown = (e) => {
      if (!quiz.on || !isStroop.value || st.phase !== "run") return;
      /* 卡片 C 用 1–4 直接选被试读出的颜色 */
      if (stKind.value === "colorword") {
        const n = "1234".indexOf(e.key);
        if (n >= 0 && n < stColors.value.length) { e.preventDefault(); stMarkColor(stColors.value[n]); return; }
      }
      if (e.key === " " || e.key === "Enter") { e.preventDefault(); stMark(1); return; }
      if (e.key === "x" || e.key === "X") { e.preventDefault(); stMark(0); return; }
      if (e.key === "Backspace") { e.preventDefault(); stUndo(); }
    };
    window.addEventListener("keydown", stKeydown);

    /* ---- 口述题：按住说话按钮（呼吸提示 + 口述时长 + 语音转文本） ---- */
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
    const mic = reactive({ on: false, t0: 0, id: null, live: "", err: "", supported: !!SR });
    let recog = null;
    const micStart = (e) => {
      if (e) e.preventDefault();
      stopSpeak();
      const it = curQuizItem.value;
      mic.on = true; mic.t0 = Date.now(); mic.id = it ? it.id : null; mic.live = ""; mic.err = "";
      if (!SR) return;
      const myId = mic.id;
      try {
        recog = new SR();
        recog.lang = "zh-CN"; recog.continuous = true; recog.interimResults = true;
        recog.onresult = (ev) => {
          let t = "";
          for (let i = 0; i < ev.results.length; i++) t += ev.results[i][0].transcript;
          mic.live = t;
        };
        recog.onerror = (ev) => {
          mic.err = ev.error === "not-allowed" ? "未授权麦克风，仅记录口述时长"
            : ev.error === "network" ? "语音服务不可用，仅记录口述时长" : "语音识别失败，仅记录口述时长";
        };
        recog.onend = () => {
          const t = (mic.live || "").trim();
          const a = myId ? quiz.ans[myId] : null;
          if (a && t) a.speech = ((a.speech || "") + t).slice(0, 800);
        };
        recog.start();
      } catch (err) { mic.err = "语音识别不可用，仅记录口述时长"; }
    };
    const micStop = () => {
      if (!mic.on) return;
      mic.on = false;
      const sec = Math.max(1, Math.round((Date.now() - mic.t0) / 1000));
      const a = mic.id ? quiz.ans[mic.id] : null;
      if (a) a.spoken = (a.spoken || 0) + sec;
      if (recog) { try { recog.stop(); } catch (e) { } recog = null; }
    };
    const micSec = (id) => { const a = quiz.ans[id]; return a && a.spoken ? a.spoken : 0; };
    const micSpeech = (id) => { const a = quiz.ans[id]; return a && a.speech ? a.speech : ""; };

    /* ---- 主试施测：刺激材料 ---- */
    /* MoCA 交替连线图：按记录单原图坐标散布 10 个圆点（5、1、戊、甲、乙、2、丁、4、3、丙），
       1→甲→2 之间以虚线箭头提示起笔方向；被试在记录单上用笔连线，屏幕只作出示。 */
    const MOCA_PATH = [
      { l: "戊", x: 125, y: 31 }, { l: "甲", x: 254, y: 30 },
      { l: "5", x: 42, y: 104 }, { l: "乙", x: 230, y: 124 }, { l: "2", x: 325, y: 124 },
      { l: "1", x: 125, y: 152 }, { l: "丁", x: 60, y: 233 }, { l: "4", x: 207, y: 229 },
      { l: "3", x: 322, y: 248 }, { l: "丙", x: 125, y: 285 },
    ];
    /* 起笔方向提示由 MOCA_SEGS 前两段承担（见下方 moca 演示逻辑），此处只保留「开始 / 结束」文字标注 */
    const MOCA_LABELS = [{ t: "开始", x: 125, y: 201 }, { t: "结束", x: 125, y: 79 }];

    /* MoCA 交替连线：进题先做「提示演示」——起笔点闪烁 + 虚线箭头走 1→甲→2（与原版施测一致，
       不演示后半程，否则等于把答案给被试）；演示结束出现「开始」，由主试按顺序点圆点连线直到「戊」。
       phase：playing 演示中 / ready 待开始 / drawing 连线中 / done 已连到「戊」。 */
    const MOCA_SEQ = ["1", "甲", "2", "乙", "3", "丙", "4", "丁", "5", "戊"];
    const MOCA_HINT_SEGS = 2;   // 提示只走两段：1→甲、甲→2
    const MOCA_GAP = 23;        // 线段两端与圆心的留白（圆半径 20 + 2）
    const MOCA_SEGS = MOCA_SEQ.slice(0, -1).map((l, i) => {
      const a = MOCA_PATH.find(n => n.l === l), b = MOCA_PATH.find(n => n.l === MOCA_SEQ[i + 1]);
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
      return {
        x1: +(a.x + ux * MOCA_GAP).toFixed(1), y1: +(a.y + uy * MOCA_GAP).toFixed(1),
        x2: +(b.x - ux * MOCA_GAP).toFixed(1), y2: +(b.y - uy * MOCA_GAP).toFixed(1),
      };
    });
    const moca = reactive({ phase: "playing", step: 0, active: "", wrong: "", fails: 0, timer: 0 });
    const mocaHinting = computed(() => moca.phase === "playing" || moca.phase === "ready");
    const mocaPlay = () => {
      clearTimeout(moca.timer);
      moca.phase = "playing"; moca.step = 0; moca.wrong = ""; moca.fails = 0;
      moca.active = MOCA_SEQ[0];
      const tick = () => {
        if (moca.phase !== "playing") return;
        if (moca.step >= MOCA_HINT_SEGS) { moca.phase = "ready"; moca.active = ""; return; }
        moca.step += 1;
        moca.active = MOCA_SEQ[moca.step];
        moca.timer = setTimeout(tick, 900);
      };
      moca.timer = setTimeout(tick, 900);
    };
    const mocaStart = () => {
      clearTimeout(moca.timer);
      moca.phase = "drawing"; moca.step = 0; moca.active = ""; moca.wrong = ""; moca.fails = 0;
    };
    const mocaHit = (l) => !mocaHinting.value && MOCA_SEQ.indexOf(l) <= moca.step;
    const mocaClick = (l) => {
      if (moca.phase !== "drawing") return;
      if (l === MOCA_SEQ[moca.step]) return;          // 重复点当前点，忽略
      if (l === MOCA_SEQ[moca.step + 1]) {
        moca.step += 1; moca.wrong = "";
        if (moca.step >= MOCA_SEQ.length - 1) moca.phase = "done";
        return;
      }
      moca.wrong = l; moca.fails += 1;               // 点错只红闪提示，不自动扣分（能否自纠由主试判定）
      setTimeout(() => { if (moca.wrong === l) moca.wrong = ""; }, 700);
    };
    /* 进题 / 上一题下一题：重播提示演示 */
    watch(() => (curQuizItem.value && curQuizItem.value.figure) || "", (f) => {
      if (f === "mocaPath") mocaPlay(); else clearTimeout(moca.timer);
    }, { immediate: true });

    /* ---- 三步命令：数字化折纸（拖动纸张 / 点击折边 / 放到左腿或地上） ---- */
    const paper = reactive({ x: 0, y: 0, foldsH: 0, foldsV: 0, zone: "", picked: false, drag: false, moved: false, sx: 0, sy: 0, ox: 0, oy: 0 });
    const PAPER_FOLDS = [
      { label: "上折", dir: "v", style: { left: "50%", top: "-15px", transform: "translateX(-50%)" } },
      { label: "下折", dir: "v", style: { left: "50%", bottom: "-15px", transform: "translateX(-50%)" } },
      { label: "左折", dir: "h", style: { left: "-15px", top: "50%", transform: "translateY(-50%)" } },
      { label: "右折", dir: "h", style: { right: "-15px", top: "50%", transform: "translateY(-50%)" } },
    ];
    const resetPaper = () => {
      paper.x = 0; paper.y = 0; paper.foldsH = 0; paper.foldsV = 0;
      paper.zone = ""; paper.picked = false; paper.drag = false; paper.moved = false;
    };
    const syncPaper = () => {
      const it = curQuizItem.value;
      if (!it || !quiz.ans[it.id]) return;
      const f = paper.foldsH + paper.foldsV;
      const acts = [
        paper.picked ? "拿起纸张" : "未拿起",
        f ? `对折 ${f} 次` : "未对折",
        paper.zone === "leg" ? "放在左腿" : paper.zone === "floor" ? "放在地上" : "未放置",
      ];
      quiz.ans[it.id].parts[0] = acts.join(" → ");
    };
    const doFold = (dir) => {
      if (paper.zone) return;
      paper.picked = true;
      if (dir === "h") paper.foldsH = 1; else paper.foldsV = 1;
      syncPaper();
    };
    const paperDown = (e) => {
      paper.drag = true; paper.moved = false; paper.picked = true;
      paper.sx = e.clientX; paper.sy = e.clientY; paper.ox = paper.x; paper.oy = paper.y;
      syncPaper();
      e.preventDefault();
    };
    const paperMove = (e) => {
      if (!paper.drag) return;
      const dx = e.clientX - paper.sx, dy = e.clientY - paper.sy;
      if (Math.abs(dx) > 6 || Math.abs(dy) > 6) paper.moved = true;
      paper.x = paper.ox + dx; paper.y = paper.oy + dy;
    };
    const paperUp = () => {
      if (!paper.drag) return;
      paper.drag = false;
      // 未拖动 = 单击纸张：取回并重置，便于重做
      if (!paper.moved) {
        if (paper.zone || paper.foldsH || paper.foldsV) {
          paper.zone = ""; paper.foldsH = 0; paper.foldsV = 0; paper.x = 0; paper.y = 0; syncPaper();
        }
        return;
      }
      const el = document.querySelector(".quiz-paper");
      if (!el) return;
      const pr = el.getBoundingClientRect();
      // 以纸张中心点落位为准，避免纸张体积较大时同时压住两个区域
      const cx = pr.left + pr.width / 2, cy = pr.top + pr.height / 2;
      for (const z of ["leg", "floor"]) {
        const ze = document.querySelector(".paper-zone." + z);
        if (!ze) continue;
        const zr = ze.getBoundingClientRect();
        if (cx >= zr.left && cx <= zr.right && cy >= zr.top && cy <= zr.bottom) {
          paper.zone = z; paper.x = 0; paper.y = 0; syncPaper(); return;
        }
      }
    };
    const dropTo = (z) => { paper.picked = true; paper.zone = z; paper.x = 0; paper.y = 0; syncPaper(); };
    const paperHint = computed(() => {
      if (paper.zone) return `纸张已放在${paper.zone === "leg" ? "左腿" : "地上"}，点纸张可取回重做`;
      if (paper.foldsH + paper.foldsV) return "已对折，请把它放到左腿或地上";
      return "拖动纸张可以移动，点击纸边的小按钮可以对折";
    });

    /* ================= 画钟测验（CDT）：六种评分法 + 逐项勾选 =================
       评分法决定满分与判读界值（3/4/5/7/10/30 分法），每一项勾中即累加该项分值；
       7 分法是「错误计分」，勾中代表该象限数字数目有错。勾选结果随作答落库，
       评分页据此预填得分，满分也按所选评分法变化。 */
    const cdt = reactive({
      scale: "s10",     // 当前评分法 key
      picks: {},        // { 评分法key: { 项id: 1 } }，切换评分法不丢已勾内容
    });
    /* 手写画布：笔画历史（撤销上一笔）与当前笔数 */
    const draw = reactive({ ink: 0 });
    const cdtCfg = computed(() => (quiz.meta && quiz.meta.cfg) || {});
    const cdtScales = computed(() => cdtCfg.value.scales || []);
    const cdtCur = computed(() => cdtScales.value.find(s => s.k === cdt.scale) || cdtScales.value[0] || null);
    const cdtPicked = computed(() => cdt.picks[cdt.scale] || {});
    const cdtTotal = computed(() => {
      const s = cdtCur.value;
      if (!s) return 0;
      const p = cdtPicked.value;
      return (s.items || []).reduce((a, it) => a + (p[it.id] ? it.pts : 0), 0);
    });
    const cdtMethods = computed(() => cdtScales.value.map(s => ({
      k: s.k, name: s.name, short: s.name.replace(/\s*评分法$/, ""), max: s.max, on: s.k === cdt.scale,
    })));
    const cdtChecklist = computed(() => {
      const s = cdtCur.value;
      if (!s) return null;
      const p = cdtPicked.value;
      return {
        title: s.name + (s.source ? " · " + s.source : ""),
        items: (s.items || []).map(it => ({ id: it.id, label: it.label, pts: it.pts, tip: it.tip || "", on: !!p[it.id] })),
        note: s.note || "",
        total: cdtTotal.value, max: s.max, rule: s.rule || "", reverse: s.direction === "lower_better",
      };
    });
    /* 把评分法 / 勾选 / 得分写进作答对象（随作答一起落库，重进可恢复） */
    const cdtSync = () => {
      const it = quizItems.value.find(x => x.id === "D1") || quizItems.value[0];
      if (!it || !quiz.ans[it.id]) return null;
      const a = quiz.ans[it.id], s = cdtCur.value;
      a.cdtScale = cdt.scale;
      a.cdtScaleName = s ? s.name : "";
      a.cdtRule = s ? s.rule || "" : "";
      a.cdtPicks = JSON.parse(JSON.stringify(cdt.picks));
      a.cdtTotal = cdtTotal.value;
      quiz.score[it.id] = cdtTotal.value;
      return it.id;
    };
    const cdtLoad = () => {
      cdt.picks = {};
      cdt.scale = cdtCfg.value.defaultScale || "s10";
      const it = quizItems.value.find(x => x.id === "D1") || quizItems.value[0];
      const a = it && quiz.ans[it.id];
      if (a && a.cdtScale && cdtScales.value.some(s => s.k === a.cdtScale)) cdt.scale = a.cdtScale;
      if (a && a.cdtPicks && typeof a.cdtPicks === "object") {
        cdt.picks = JSON.parse(JSON.stringify(a.cdtPicks));
        /* 旧记录只存了勾选、没存分：补一次同步，保证评分页有分可预填 */
        if (a.cdtTotal == null) cdtSync();
      }
    };
    const cdtSetScale = (k) => { cdt.scale = k; cdtSync(); };
    const cdtToggle = (id) => {
      const m = cdt.picks[cdt.scale] || (cdt.picks[cdt.scale] = {});
      if (m[id]) delete m[id]; else m[id] = 1;
      cdtSync();
    };

    /* 撤销上一笔：重绘画布（底图 + 笔画历史），笔数归零则视为未作答 */
    const undoStroke = () => {
      const cv = document.querySelector("canvas.quiz-canvas");
      if (!cv || !cv._strokes || !cv._strokes.length) return;
      cv._strokes.pop();
      if (cv._repaint) cv._repaint();
      draw.ink = cv._strokes.length;
      cv.dataset.ink = String(draw.ink);
    };

    /* ================= 波士顿命名测验（BNT）：30 幅逐张出示 + 三级提示评分 =================
       每张 20 秒；同一张按记录单五列勾选——无提示正确 / 语义提示（正确·错误）/ 语音提示（正确·错误）。
       语义提示后仍错才给语音提示，因此「语义错误」本身不算终局，要等语音列勾定。
       总分 = 无提示正确数 + 语义提示后正确数（最高 30），语义/语音提示的数只作临床参考。 */
    const bnt = reactive({
      idx: 0, left: 20, run: true, showHint: false,
      rows: {},        // { 序号: { free?:1, sem?:1|2, ph?:1|2 } }
      tip: "",
    });
    let bntTimer = 0;
    const bntCfg = computed(() => (quiz.meta && quiz.meta.cfg) || {});
    const bntItems = computed(() => bntCfg.value.items || []);
    const bntSec = computed(() => Number(bntCfg.value.seconds) || 20);
    const bntCut = computed(() => Number(bntCfg.value.cutoff) || 24);
    const bntCur = computed(() => bntItems.value[bnt.idx] || { name: "", hint: "", img: "" });
    const bntRec = (i) => bnt.rows[i] || {};
    /* 当前这张是否已判完：无提示正确 / 语义正确 / 语音列已勾 */
    const bntDone = (i) => {
      const r = bntRec(i);
      return !!(r.free || r.sem === 1 || r.ph);
    };
    const bntCount = (fn) => bntItems.value.reduce((a, _, i) => a + (fn(bntRec(i)) ? 1 : 0), 0);
    const bntStat = computed(() => {
      const ok1 = bntCount(r => r.free);
      const ok3 = bntCount(r => r.sem === 1);
      const sem = bntCount(r => r.sem === 1 || r.sem === 2);
      const ph = bntCount(r => r.ph === 1 || r.ph === 2);
      const ok5 = bntCount(r => r.ph === 1);
      const total = ok1 + ok3;
      return { ok1, sem, ok3, ph, ok5, total };
    });
    const bntStage = computed(() => {
      const r = bntRec(bnt.idx);
      if (r.free) return "done";
      if (r.sem === 1) return "done";
      if (r.sem === 2) return "ph";
      return "free";
    });
    const bntStats = computed(() => {
      const s = bntStat.value;
      return {
        title: "记录单六项",
        total: s.total, max: Number(bntCfg.value.max) || 30,
        rows: [
          { k: "① 无提示正确数", v: s.ok1 + " 个" },
          { k: "② 语义提示数", v: s.sem + " 次" },
          { k: "③ 语义提示后正确数", v: s.ok3 + " 个" },
          { k: "④ 语音提示数", v: s.ph + " 次", na: true },
          { k: "⑤ 语音提示后正确数", v: s.ok5 + " 个", na: true },
        ],
        rule: "总分 = ① + ③，最高 " + (Number(bntCfg.value.max) || 30) + " 分；> " + bntCut.value + " 分为正常。④⑤ 只用于临床，不记分。",
        grid: bntItems.value.map((it, i) => {
          const r = bntRec(i);
          const st = r.free ? "free" : (r.sem === 1 ? "ok3" : (r.ph === 1 ? "ok5" : ((r.ph === 2 || r.sem === 2) ? "bad" : "none")));
          return { i, st, now: i === bnt.idx };
        }),
      };
    });
    const bntLoad = () => {
      bnt.idx = 0; bnt.rows = {}; bnt.tip = ""; bnt.showHint = false; bnt.run = true;
      const it = quizItems.value[0];
      const a = it && quiz.ans[it.id];
      if (a && a.rows) {
        /* 恢复：把逐张记录还原回 rows 结构（键为序号 0-based 字符串） */
        bnt.rows = JSON.parse(JSON.stringify(a.rows || {}));
        const first = bntItems.value.findIndex((_, i) => !bntRec(i).free && !(bntRec(i).sem === 1) && !bntRec(i).ph);
        bnt.idx = first < 0 ? Math.max(0, bntItems.value.length - 1) : first;
      }
      bntRestart();
    };
    const bntSync = () => {
      const it = quizItems.value[0];
      if (!it || !quiz.ans[it.id]) return null;
      const s = bntStat.value;
      quiz.ans[it.id] = {
        parts: [s.total], total: s.total,
        ok1: s.ok1, sem: s.sem, ok3: s.ok3, ph: s.ph, ok5: s.ok5,
        rows: JSON.parse(JSON.stringify(bnt.rows)),
      };
      quiz.score[it.id] = s.total;
      return it.id;
    };
    const bntRestart = () => {
      clearInterval(bntTimer); bntTimer = 0;
      bnt.left = bntSec.value;
      if (!bnt.run || bnt.idx >= bntItems.value.length) return;
      const t0 = Date.now();
      bntTimer = setInterval(() => {
        if (!bnt.run) return;
        const rest = bntSec.value - Math.floor((Date.now() - t0) / 1000);
        bnt.left = Math.max(0, rest);
        if (rest <= 0) bntTimeout();
      }, 200);
    };
    /* 20 秒到：本阶段视为未答对，自动进入下一级提示（末级则记「语音提示后错误」） */
    const bntTimeout = () => {
      clearInterval(bntTimer); bntTimer = 0;
      const r = bntRec(bnt.idx);
      if (r.free || r.sem === 1) return;
      if (r.sem !== 2) {
        bnt.rows[bnt.idx] = { ...r, sem: 2 };
        bnt.tip = "20 秒未答对 · 请给语音提示";
        bnt.left = bntSec.value;
        bntRestart();
        return;
      }
      bnt.rows[bnt.idx] = { ...r, ph: 2 };
      bntNext("20 秒未答对 · 记语音提示后错误");
    };
    const bntMark = (kind) => {
      if (bnt.idx >= bntItems.value.length) return;
      const r = bntRec(bnt.idx);
      if (kind === "free") { bnt.rows[bnt.idx] = { free: 1 }; bntNext("无提示正确"); return; }
      if (kind === "semOk") { bnt.rows[bnt.idx] = { ...r, sem: 1 }; bntNext("语义提示后正确"); return; }
      if (kind === "semBad") {
        bnt.rows[bnt.idx] = { ...r, sem: 2 };
        bnt.tip = "语义提示后仍不准确 · 请给语音提示";
        bnt.left = bntSec.value;
        bntRestart();
        return;
      }
      if (kind === "phOk") { bnt.rows[bnt.idx] = { ...r, sem: r.sem || 2, ph: 1 }; bntNext("语音提示后正确"); return; }
      if (kind === "phBad") { bnt.rows[bnt.idx] = { ...r, sem: r.sem || 2, ph: 2 }; bntNext("语音提示后仍错误"); return; }
    };
    const bntNext = (tip) => {
      clearInterval(bntTimer); bntTimer = 0;
      bnt.tip = tip || "";
      bntSync();
      if (bnt.idx >= bntItems.value.length - 1) { bnt.idx = bntItems.value.length; return bntFinish(); }
      bnt.idx++;
      bnt.showHint = false;
      bntRestart();
    };
    /* 回退一张（点错了用）：清掉上一张的记录并跳回 */
    const bntBack = () => {
      if (bnt.idx <= 0) return;
      bnt.idx--;
      delete bnt.rows[bnt.idx];
      bnt.tip = "";
      bntSync();
      bntRestart();
    };
    const bntSaveOnly = async () => {
      const id = bntSync();
      if (!id) return 0;
      const s = bntStat.value;
      await api("/assessments/" + runRec.value + "/answers", { method: "POST", body: { code: "BNT", answers: { [id]: quiz.ans[id] } } });
      await api("/assessments/" + runRec.value + "/review-scores", { method: "POST", body: { code: "BNT", scores: { [id]: s.total } } });
      return s.total;
    };
    const bntFinish = async () => {
      clearInterval(bntTimer); bntTimer = 0;
      const name = quiz.meta ? quiz.meta.name : "波士顿命名测验";
      try {
        await bntSaveOnly();
        const rd = await api("/assessments/" + runRec.value + "/record-item", { method: "POST", body: { code: "BNT" } });
        quiz.on = false; stopSpeak();
        await loadRun();
        if (rd && rd.allDone) return msg.success("全部评估项目已完成，可评分并提交");
        const next = scaleCards.value.find(c => !c.det && c.meta && c.meta.items)
          || paraCards.value.find(c => !c.det && c.meta && c.meta.items);
        if (!next) return msg.success(name + " 已完成，结果已记录");
        try {
          await mbx.confirm(`已完成「${name}」，是否继续评估「${next.meta.name}」？`, "继续评估",
            { type: "info", confirmButtonText: "继续评估", cancelButtonText: "稍后" });
          startQuiz(next.meta);
        } catch (e) { /* 医生选择稍后 */ }
      } catch (e) { msg.error(e.message); }
    };
    /* 提前结束：按已记录的张数结算 */
    const bntStop = async () => {
      bnt.run = false; clearInterval(bntTimer); bntTimer = 0;
      await bntFinish();
    };

    /* ================= 伦敦塔测验（TOL）：左可动 / 右锁定，2 练习 + 10 正式 =================
       记三项时间：呈现 → 第一步 = 计划时间；第一步 → 完成 = 执行时间；单题限时 60 秒。
       每题"正确"的口径是：限时内完成、且实际步数等于最少步数。连续 3 题不正确即可停止。 */
    const tol = reactive({
      idx: 0, pegs: [[], [], []], sel: -1, moves: 0,
      t0: 0, mv0: 0, endAt: 0, done: false, run: true,
      rows: {}, streak: 0, tick: 0, tip: "",
    });
    let tolTimer = 0;
    const tolCfg = computed(() => (quiz.meta && quiz.meta.cfg) || {});
    const tolItems = computed(() => tolCfg.value.items || []);
    const tolBeadList = computed(() => tolCfg.value.beads || []);
    const tolPegCfg = computed(() => tolCfg.value.pegs || []);
    const tolLimit = computed(() => Number(tolCfg.value.limitSec) || 60);
    const tolMaxN = computed(() => Number(tolCfg.value.max) || 10);
    const tolStopN = computed(() => Number(tolCfg.value.stopAfter) || 3);
    const tolCur = computed(() => tolItems.value[tol.idx] || null);
    const tolColorOf = (b) => tolBeadList.value[b] || { hex: "#94a3b8", shade: "#64748b", name: "" };
    /* 一根柱子的展示高度按容量等比：容量 4 → 160px */
    const tolPegH = (cap) => 40 + Number(cap || 1) * 34;
    const tolPane = (st) => (tolPegCfg.value || []).map((p, i) => ({
      k: p.k, cap: p.cap, h: tolPegH(p.cap),
      stack: (st && st[i]) || [],
      sel: tol.sel === i,
      full: ((st && st[i]) || []).length >= p.cap,
    }));
    const tolPanes = computed(() => ({ cur: tolPane(tol.pegs), goal: tolPane(tolCur.value && tolCur.value.goal) }));

    const tolNow = () => (tol.done ? tol.endAt : (tol.tick || Date.now()));
    const tolLeft = computed(() => {
      if (!tolCur.value || tol.done) return 0;
      return Math.max(0, tolLimit.value - Math.round((tolNow() - tol.t0) / 1000));
    });
    const tolPlanSec = computed(() => (tol.mv0 ? Math.max(0, Math.round((tol.mv0 - tol.t0) / 1000)) : 0));
    const tolExecSec = computed(() => {
      if (!tol.mv0) return 0;
      const end = tol.done ? tol.endAt : tolNow();
      return Math.max(0, Math.round((end - tol.mv0) / 1000));
    });
    const tolRowOf = (i) => tol.rows[i] || null;
    const tolStat = computed(() => {
      const rows = Object.keys(tol.rows).map(k => tol.rows[k]).filter(r => r && !r.prac);
      const correct = rows.filter(r => r.ok).length;
      const extra = rows.reduce((a, r) => a + Math.max(0, (r.moves || 0) - (r.min || 0)), 0);
      const plan = rows.reduce((a, r) => a + (r.plan || 0), 0);
      const exec = rows.reduce((a, r) => a + (r.exec || 0), 0);
      return { correct, extra, plan, exec, done: rows.length, total: tolMaxN.value };
    });
    const tolStats = computed(() => {
      const s = tolStat.value;
      return {
        title: "主要指标（练习不计）",
        total: s.correct, max: tolMaxN.value,
        rows: [
          { k: "总正确数", v: s.correct + " / " + tolMaxN.value + " 题" },
          { k: "总步数（超出最少）", v: s.extra + " 步" },
          { k: "总计划时间", v: s.plan + " 秒" },
          { k: "总执行时间", v: s.exec + " 秒" },
          { k: "连续未正确", v: tol.streak + " 题", na: true },
        ],
        rule: "总正确数 = 限时内用最少步数解决的题数；总步数 = Σ(实际步数 − 最少步数)；总计划时间 = Σ(呈现→第一步)；总执行时间 = Σ(第一步→完成)。",
        unit: "题",
        /* 练习不计分、也不占序号：格子里只列 10 道正式题 */
        gridNote: `练习 ${tolItems.value.filter(x => x.prac).length} 题不计分，格内为 ${tolMaxN.value} 道正式题`,
        grid: tolItems.value.map((it, i) => ({ it, i })).filter(x => !x.it.prac).map((x, k) => {
          const r = tol.rows[x.i];
          const st = !r ? "none" : (r.ok ? "free" : (r.solved ? "ok3" : "bad"));
          return { i: k, st, now: x.i === tol.idx };
        }),
      };
    });
    const tolStartQ = () => {
      const it = tolCur.value;
      clearInterval(tolTimer); tolTimer = 0;
      if (!it) return;
      tol.pegs = JSON.parse(JSON.stringify(it.start));
      tol.sel = -1; tol.moves = 0; tol.done = false; tol.tip = "";
      tol.t0 = Date.now(); tol.mv0 = 0; tol.endAt = 0; tol.tick = Date.now();
      if (!tol.run) return;
      tolTimer = setInterval(() => {
        if (!tol.run || tol.done) return;
        tol.tick = Date.now();
        if (tol.tick - tol.t0 >= tolLimit.value * 1000) tolEndQ("timeout");
      }, 200);
    };
    const tolWin = () => {
      const g = (tolCur.value && tolCur.value.goal) || [[], [], []];
      return tol.pegs.every((p, i) => {
        const q = g[i] || [];
        return p.length === q.length && p.every((b, k) => b === q[k]);
      });
    };
    const tolPick = (pi) => {
      if (!tol.run || tol.done || !tolCur.value) return;
      const cap = Number((tolPegCfg.value[pi] || {}).cap) || 9;
      const name = (tolPegCfg.value[pi] || {}).k || "";
      if (tol.sel < 0) {
        if (!tol.pegs[pi].length) { tol.tip = "这根柱子是空的，请先点有珠子的柱子。"; return; }
        tol.sel = pi; tol.tip = ""; return;
      }
      if (tol.sel === pi) { tol.sel = -1; tol.tip = ""; return; }
      if (tol.pegs[pi].length >= cap) { tol.tip = `${name} 柱最多放 ${cap} 颗，放不下了。`; return; }
      const bead = tol.pegs[tol.sel].pop();
      tol.pegs[pi].push(bead);
      tol.sel = -1;
      tol.moves++;
      if (!tol.mv0) tol.mv0 = Date.now();   /* 第一次移动 → 计划时间定格 */
      tol.tip = "";
      if (tolWin()) tolEndQ("win");
    };
    const tolEndQ = (kind) => {
      const it = tolCur.value; if (!it || tol.done) return;
      const endAt = kind === "timeout" ? tol.t0 + tolLimit.value * 1000 : Date.now();
      const plan = tol.mv0 ? Math.max(0, Math.round((tol.mv0 - tol.t0) / 1000)) : 0;
      const exec = tol.mv0 ? Math.max(0, Math.round((endAt - tol.mv0) / 1000)) : 0;
      const solved = kind === "win";
      const ok = solved && tol.moves === Number(it.min);
      tol.done = true; tol.endAt = endAt; clearInterval(tolTimer); tolTimer = 0;
      tol.rows[tol.idx] = {
        i: tol.idx, prac: !!it.prac, moves: tol.moves, min: Number(it.min) || 0,
        plan, exec, ok, solved, timeout: kind === "timeout",
      };
      if (!it.prac) tol.streak = ok ? 0 : tol.streak + 1;
      tol.tip = solved
        ? `完成 · 用了 ${tol.moves} 步（最少 ${it.min} 步）${ok ? "，正确" : "，未用最少步数"}`
        : `超时未完成 · 已走 ${tol.moves} 步（最少 ${it.min} 步）`;
      tolSync();
    };
    /* 重来本题：盘面回到起点，计时与步数一并重算（不计已走步数） */
    const tolResetQ = () => {
      if (!tol.run || !tolCur.value) return;
      const prev = tol.rows[tol.idx];
      if (prev) {
        delete tol.rows[tol.idx];
        /* 撤销的那一题若记为失败，连续未正确计数要跟着减回来 */
        if (!prev.ok && !prev.prac) tol.streak = Math.max(0, tol.streak - 1);
      }
      tolStartQ();
      tolSync();
    };
    const tolSync = () => {
      const it = quizItems.value[0];
      if (!it || !quiz.ans[it.id]) return null;
      const s = tolStat.value;
      quiz.ans[it.id] = {
        parts: [s.correct], correct: s.correct, extra: s.extra,
        planSec: s.plan, execSec: s.exec,
        rows: tolItems.value.map((x, i) => tol.rows[i]).filter(Boolean),
      };
      quiz.score[it.id] = s.correct;
      return it.id;
    };
    const tolSaveOnly = async () => {
      const id = tolSync();
      if (!id) return 0;
      const s = tolStat.value;
      await api("/assessments/" + runRec.value + "/answers", { method: "POST", body: { code: "TOL", answers: { [id]: quiz.ans[id] } } });
      await api("/assessments/" + runRec.value + "/review-scores", { method: "POST", body: { code: "TOL", scores: { [id]: s.correct } } });
      return s.correct;
    };
    const tolLoad = () => {
      tol.idx = 0; tol.rows = {}; tol.streak = 0; tol.tip = ""; tol.run = true;
      const it = quizItems.value[0];
      const a = it && quiz.ans[it.id];
      if (a && Array.isArray(a.rows) && a.rows.length) {
        a.rows.forEach(r => { if (r && r.i != null) tol.rows[r.i] = r; });
        const first = tolItems.value.findIndex((_, i) => !tol.rows[i]);
        tol.idx = first < 0 ? Math.max(0, tolItems.value.length - 1) : first;
      }
      tolStartQ();
    };
    const tolFinish = async () => {
      clearInterval(tolTimer); tolTimer = 0;
      tol.run = false;
      const name = quiz.meta ? quiz.meta.name : "伦敦塔测验";
      try {
        await tolSaveOnly();
        const rd = await api("/assessments/" + runRec.value + "/record-item", { method: "POST", body: { code: "TOL" } });
        quiz.on = false; stopSpeak();
        await loadRun();
        if (rd && rd.allDone) return msg.success("全部评估项目已完成，可评分并提交");
        const next = scaleCards.value.find(c => !c.det && c.meta && c.meta.items)
          || paraCards.value.find(c => !c.det && c.meta && c.meta.items);
        if (!next) return msg.success(name + " 已完成，结果已记录");
        try {
          await mbx.confirm(`已完成「${name}」，是否继续评估「${next.meta.name}」？`, "继续评估",
            { type: "info", confirmButtonText: "继续评估", cancelButtonText: "稍后" });
          startQuiz(next.meta);
        } catch (e) { /* 医生选择稍后 */ }
      } catch (e) { msg.error(e.message); }
    };
    const tolNext = async () => {
      if (!tol.done) return;
      /* 连续 3 题没有正确解决 → 停止测验（练习题不参与计数） */
      if (tol.streak >= tolStopN.value) {
        tol.tip = `已连续 ${tol.streak} 题未正确解决，按记录单停止测验。`;
        return tolFinish();
      }
      if (tol.idx >= tolItems.value.length - 1) return tolFinish();
      tol.idx++;
      tolStartQ();
      tolSync();
    };
    const tolStop = async () => {
      clearInterval(tolTimer); tolTimer = 0;
      tol.run = false;
      await tolFinish();
    };

    const saveCanvas = () => {
      if (curQuizMode.value !== "draw") return;
      const cv = document.querySelector("canvas.quiz-canvas");
      const it = curQuizItem.value;
      if (!cv || !it || !quiz.ans[it.id]) return;
      // 未落笔则视为未作答，避免存下一张空白图
      if (Number(cv.dataset.ink || 0) === 0) { quiz.ans[it.id].parts[0] = null; return; }
      quiz.ans[it.id].parts[0] = cv.toDataURL("image/png");
    };
    const initQuizCanvas = () => {
      nextTick(() => {
        const cv = document.querySelector("canvas.quiz-canvas");
        const it = curQuizItem.value;
        if (!cv || !it || curQuizMode.value !== "draw") return;
        cv.width = 640; cv.height = 320;
        const ctx = cv.getContext("2d");
        ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#0f172a";
        const saved = quiz.ans[it.id] && quiz.ans[it.id].parts[0];
        /* 笔画历史：每次落笔记一笔，撤销时弹出最后一笔后整张重画 */
        const strokes = [];
        let img = null;
        cv._strokes = strokes;
        const paint = () => {
          ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
          if (img) ctx.drawImage(img, 0, 0, cv.width, cv.height);
          ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#0f172a";
          strokes.forEach(s => {
            if (!s.length) return;
            if (s.length === 1) {
              ctx.fillStyle = "#0f172a"; ctx.beginPath(); ctx.arc(s[0][0], s[0][1], 1.6, 0, 7); ctx.fill();
              return;
            }
            ctx.beginPath(); ctx.moveTo(s[0][0], s[0][1]);
            for (let i = 1; i < s.length; i++) ctx.lineTo(s[i][0], s[i][1]);
            ctx.stroke();
          });
        };
        cv._repaint = paint;
        cv.dataset.ink = saved ? "1" : "0";
        draw.ink = 0;
        paint();
        if (saved) {
          img = new Image();
          img.onload = () => paint();
          img.src = saved;
        }
        let dr = false, last = null;
        const pos = e => { const r = cv.getBoundingClientRect(); const t = e.touches ? e.touches[0] : e; return [(t.clientX - r.left) * (cv.width / r.width), (t.clientY - r.top) * (cv.height / r.height)]; };
        cv.onpointerdown = e => {
          dr = true; last = pos(e);
          strokes.push([last]);
          draw.ink = strokes.length;
          cv.dataset.ink = String(strokes.length);
          ctx.fillStyle = "#0f172a"; ctx.beginPath(); ctx.arc(last[0], last[1], 1.6, 0, 7); ctx.fill();
          e.preventDefault();
        };
        cv.onpointermove = e => {
          if (!dr) return; const p = pos(e);
          const s = strokes[strokes.length - 1];
          if (s) s.push(p);
          ctx.strokeStyle = "#0f172a"; ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke();
          last = p; e.preventDefault();
        };
        cv.onpointerup = cv.onpointerleave = () => { dr = false; };
      });
    };
    const afterNav = () => { mic.on = false; initQuizCanvas(); speakCurrent(); quiz.t0 = Date.now(); };
    /* 作答耗时：记录每题停留秒数（来回切换时累加），作为报告里的客观指标；结算后清零避免重复累加 */
    const stampQuiz = () => {
      const it = curQuizItem.value;
      if (!it || !quiz.t0) return;
      const a = quiz.ans[it.id];
      const sec = Math.max(1, Math.round((Date.now() - quiz.t0) / 1000));
      if (a) a.sec = (a.sec || 0) + sec;
      quiz.t0 = 0;
    };

    const startQuiz = async (meta) => {
      if (!meta || !meta.items) return;
      quiz.code = meta.code; quiz.meta = meta; quiz.idx = 0; quiz.ans = {}; quiz.score = {};
      mic.on = false;
      resetPaper();
      /* 数字广度：从练习重新开始（不做断点续测，避免练习阶段被跳过） */
      if (meta.runner === "span") spanReset();
      /* 符号数字转换：同样从练习行重新开始，计时归零 */
      if (meta.runner === "sdmt") sdmtReset();
      /* 连线测试：从 A 部分练习重新开始，计时与错误数归零 */
      if (meta.runner === "tmt") tmtReset();
      /* Stroop：从卡片 A 的准备页重新开始 */
      if (meta.runner === "stroop") stReset();
      /* 画钟：评分法回到默认、勾选清空（历史记录在作答合并后再恢复） */
      if (meta.code === "CDT") cdtLoad();
      /* 波士顿命名：从第 1 幅重新开始，计时归零 */
      if (meta.runner === "bnt") bntLoad();
      /* 伦敦塔：从练习第 1 题重新开始（历史记录在作答合并后再恢复） */
      if (meta.runner === "tol") { clearInterval(tolTimer); tolTimer = 0; tolLoad(); }
      meta.items.forEach(it => {
        const mode = quizModeOf(it);
        quiz.ans[it.id] = { parts: it.parts.map(() => (mode === "draw" ? null : "")) };
      });
      // 主试口述量表：恢复已评分数，并从第一道尚未评分的题目继续
      if (meta.examinerOnly) {
        try {
          const rv = await api("/assessments/" + runRec.value + "/review");
          const pj = (rv.projects || []).find(x => x.code === meta.code);
          if (pj) {
            let first = -1;
            pj.items.forEach((r, i) => {
              if (r.scored) quiz.score[r.id] = Number(r.score) || 0;
              else if (first < 0) first = i;
            });
            quiz.idx = first >= 0 ? first : Math.max(0, meta.items.length - 1);
          }
        } catch (e) { /* 无历史评分时从第一题开始 */ }
        quiz.on = true;
        quiz.t0 = Date.now();
        nextTick(() => speakCurrent());
        return;
      }
      // 续测断点：定位到上次最后作答的那道题
      let last = -1;
      try {
        const saved = await api("/assessments/" + runRec.value + "/answers?code=" + meta.code);
        Object.keys(saved || {}).forEach(k => {
          const v = saved[k];
          if (quiz.ans[k] && v && Array.isArray(v.parts) && v.parts.length === quiz.ans[k].parts.length) {
            quiz.ans[k] = v;
            const i = meta.items.findIndex(x => x.id === k);
            if (i > last) last = i;
          }
        });
      } catch (e) { /* 无历史作答时忽略 */ }
      if (last >= 0) quiz.idx = last;
      /* 画钟：恢复上次用的评分法与逐项勾选（放在作答合并之后） */
      if (isCdt.value) cdtLoad();
      /* 波士顿命名：从上次中断的那一幅继续（同样是作答合并之后） */
      if (isBnt.value) bntLoad();
      /* 伦敦塔：从上次中断的那一题继续（同样是作答合并之后） */
      if (isTol.value) tolLoad();
      quiz.on = true;
      quiz.t0 = Date.now();
      nextTick(() => { initQuizCanvas(); speakCurrent(); });
    };
    const nextQ = () => {
      if (isExaminer.value) {
        const it = curQuizItem.value;
        /* 演示题（学习阶段 / 练习组）没有分档，不拦评分 */
        if (it && !it.demo && quiz.score[it.id] === undefined) return msg.warning("请先为本题评分");
      }
      saveCanvas(); stampQuiz();
      if (quiz.idx >= quizItems.value.length - 1) return finishQuiz();
      quiz.idx++; afterNav();
    };
    const prevQ = () => { saveCanvas(); stampQuiz(); if (quiz.idx > 0) { quiz.idx--; afterNav(); } };

    const persistAnswers = async () => {
      // 主试口述量表不记录机器作答，评分另存
      if (isExaminer.value) return 0;
      // 只提交已翻到且确有作答内容的题目；口述类翻到即视为已作答，未填写的填空题不计入进度
      const answers = {};
      quizItems.value.slice(0, quiz.idx + 1).forEach(it => {
        const a = quiz.ans[it.id];
        if (!a) return;
        const hasContent = quizModeOf(it) === "oral"
          || a.parts.some(v => v !== "" && v !== null && v !== undefined)
          /* 画钟：即使一笔未画，只要医生选过评分法/勾过分，也要把这部分连同得分记下来 */
          || !!a.cdtScale;
        if (hasContent) answers[it.id] = a;
      });
      const n = Object.keys(answers).length;
      if (n) await api("/assessments/" + runRec.value + "/answers", { method: "POST", body: { code: quiz.code, answers } });
      return n;
    };
    /* ---- 主试口述量表：逐题评分 → 完成评估 → 核对全部题目与评分 → 确认 ---- */
    const qp = reactive({ show: false, code: null, name: null, rows: [], total: 0, max: 0, allDone: false });
    const persistQuizScores = async () => {
      const scores = {};
      quizItems.value.forEach(it => {
        const v = quiz.score[it.id];
        if (v !== undefined && v !== null) scores[it.id] = Number(v) || 0;
      });
      const n = Object.keys(scores).length;
      if (n) await api("/assessments/" + runRec.value + "/review-scores", { method: "POST", body: { code: quiz.code, scores } });
      return n;
    };
    const finishExaminerQuiz = async () => {
      saveCanvas(); stampQuiz();
      const miss = quizItems.value.findIndex(it => !it.demo && quiz.score[it.id] === undefined);
      if (miss >= 0) { quiz.idx = miss; return msg.warning("第 " + (miss + 1) + " 题尚未评分"); }
      const code = quiz.code, name = quiz.meta ? quiz.meta.name : code;
      try {
        await persistQuizScores();
        const rd = await api("/assessments/" + runRec.value + "/record-item", { method: "POST", body: { code } });
        quiz.on = false; stopSpeak();
        await loadRun();
        qp.code = code; qp.name = name; qp.allDone = !!(rd && rd.allDone);
        qp.rows = quizItems.value.map((it, i) => ({
          id: it.id, no: i + 1,
          t: (guideOf(it) && guideOf(it).p) || it.t,
          score: Number(quiz.score[it.id]) || 0,
          max: maxOf(it),
          demo: !!it.demo,
        }));
        qp.total = qp.rows.reduce((a, r) => a + r.score, 0);
        qp.max = qp.rows.reduce((a, r) => a + r.max, 0);
        qp.show = true;
      } catch (e) { quiz.on = false; stopSpeak(); msg.error(e.message); }
    };
    const backToQuiz = () => {
      qp.show = false;
      quiz.on = true;
      quiz.t0 = Date.now();
      nextTick(() => speakCurrent());
    };
    const confirmQuizDone = async () => {
      qp.show = false;
      if (!qp.allDone) { msg.success(qp.name + " 已完成，可继续下一项评估"); return; }
      try {
        const d = await api("/assessments/" + runRec.value + "/complete-review", { method: "POST" });
        msg.success("评估已完成，报告已生成：" + d.reportNo);
        await loadAssessList();
        openReport(d.reportId);
      } catch (e) { msg.error(e.message); }
    };
    const finishQuiz = async () => {
      if (isExaminer.value) return finishExaminerQuiz();
      saveCanvas(); stampQuiz();
      const code = quiz.code, name = quiz.meta ? quiz.meta.name : code;
      let n = 0;
      try { n = await persistAnswers(); } catch (e) { msg.error(e.message); }
      /* 画钟：医生在右侧勾选的评分结果就是本题得分，先写评分表，
         record-item 再按评分生成项目明细（满分随所选评分法变化） */
      if (isCdt.value) {
        try {
          const id = cdtSync();
          if (id) await api("/assessments/" + runRec.value + "/review-scores",
            { method: "POST", body: { code, scores: { [id]: cdtTotal.value } } });
        } catch (e) { msg.error(e.message); }
      }
      try {
        // 只记录作答，不计分：标记该项目完成（允许整项未作答，如实记录为 0 题）
        const rd = await api("/assessments/" + runRec.value + "/record-item", { method: "POST", body: { code } });
        quiz.on = false; stopSpeak();
        await loadRun();
        if (rd && rd.allDone) {
          msg.success("全部评估项目已完成，可评分并提交");
          return;
        }
        msg.success(n ? "本次评估已完成，作答记录已保存" : "本次评估已结束，该项未记录作答内容");
        // 按顺序衔接下一个未完成项目
        const next = scaleCards.value.find(c => !c.det && c.meta && c.meta.items)
          || paraCards.value.find(c => !c.det && c.meta && c.meta.items);
        if (next) {
          try {
            await mbx.confirm(`已完成「${name}」，是否继续评估「${next.meta.name}」？`, "继续评估",
              { type: "info", confirmButtonText: "继续评估", cancelButtonText: "稍后" });
            startQuiz(next.meta);
          } catch (e) { /* 医生选择稍后 */ }
        }
      } catch (e) { quiz.on = false; stopSpeak(); msg.error(e.message); }
    };
    const quitQuiz = async () => {
      try {
        await mbx.confirm("确认退出本次评估？已作答内容会保留缓存已答题目", "提示",
          { type: "warning", confirmButtonText: "确认退出", cancelButtonText: "继续作答" });
      } catch (e) { return; }
      saveCanvas();
      clearTimeout(spanTimer); stopSpanRead();
      quiz.on = false; stopSpeak();
      try {
        if (isTol.value) { clearInterval(tolTimer); tolTimer = 0; }
        if (isSpan.value) await spanSave(false);
        else if (isSdmt.value) { sdmtStop(); await sdmtSave(false); }
        else if (isTmt.value) { clearInterval(tmtTimer); tmtTimer = 0; await tmtSave(false).catch(() => { }); }
        else if (isStroop.value) { clearInterval(stTimer); stTimer = 0; await stSave(false).catch(() => { }); }
        else if (isExaminer.value) await persistQuizScores();
        else await persistAnswers();
        await loadRun();
      } catch (e) { msg.error(e.message); }
    };

    /* ---- 评估情况：逐题展示评估结果（与评分页项目详情同构，只读） ---- */
    const recPanel = reactive({ show: false, code: null, project: null, loading: false });
    const openRecord = async (code) => {
      recPanel.code = code; recPanel.project = null; recPanel.show = true; recPanel.loading = true;
      try {
        const d = await api("/assessments/" + runRec.value + "/review");
        recPanel.project = (d.projects || []).find(p => p.code === code) || null;
      } catch (e) { msg.error(e.message); }
      recPanel.loading = false;
    };

    /* ---- 范式施测（医生按指导语施测后录入指标） ---- */
    const submitParadigm = async (c) => {
      const g = c.guide;
      if (!g || !g.fields || !g.fields.length) return msg.warning("该项目暂无评估记录项");
      const f = pForm[c.code] || {};
      const miss = g.fields.filter(x => f[x.k] === null || f[x.k] === undefined || f[x.k] === "");
      if (miss.length) return msg.warning(`请先记录：${miss.map(x => x.l).join("、")}`);
      const raw = {};
      g.fields.forEach(x => raw[x.k] = Number(f[x.k]) || 0);
      if (c.meta && c.meta.runner === "canvas") { raw.max = 10; raw.reviewed = true; }
      try {
        await api("/assessments/" + runRec.value + "/paradigm", { method: "POST", body: { code: c.code, raw } });
        msg.success((c.meta ? c.meta.name : c.code) + " 评估结果已记录");
        loadRun();
      } catch (e) { msg.error(e.message); }
    };

    const initRunUi = () => {
      if (!banks.value) return;
      planItems.value.forEach(i => {
        const done = doneCodes.value.has(i.code);
        if (!(i.code in guideOpen)) guideOpen[i.code] = !done;
        if (i.type !== "scale") {
          const meta = banks.value.paradigms.find(p => p.code === i.code);
          const det = runData.value.details.find(d => d.code === i.code);
          let raw = {};
          if (det) { try { raw = JSON.parse(det.raw || "{}"); } catch (e) { raw = {}; } }
          const o = {};
          ((meta && meta.guide && meta.guide.fields) || []).forEach(f => {
            o[f.k] = raw[f.k] !== undefined ? raw[f.k] : (f.k === "total" ? 10 : null);
          });
          pForm[i.code] = o;
        }
      });
    };

    const loadRun = async () => {
      runData.value = await api("/assessments/" + runRec.value);
      cur.value = await api("/patients/" + runData.value.patient_id);
      if (!banks.value) banks.value = await api("/banks");
      initRunUi();
    };

    /* ---------- 报告 ---------- */
    const repData = ref(null), repRadar = ref(null);
    const openReport = async (id) => {
      repData.value = await api("/reports/" + id); view.value = "report";
    };
    /* 认知域画像：固定六轴模板，只有实测域点亮（画点与连线），未测域保持灰底模板 */
    const radarSvg = (r, opts) => {
      if (!r) return null;
      const showVal = !opts || opts.showVal !== false;
      const cx = 170, cy = 150, R = 100;
      const ang = (i) => (-90 + i * 60) * Math.PI / 180;
      const at = (i, k) => ({ x: +(cx + Math.cos(ang(i)) * R * k).toFixed(1), y: +(cy + Math.sin(ang(i)) * R * k).toFixed(1) });
      const pts = DOMS.map((d, i) => {
        const v = r[d];
        const lit = v != null;
        const p = at(i, lit ? Math.max(0, Math.min(100, v)) / 100 : 0);
        const a = at(i, 1);
        const c = Math.cos(ang(i));
        return {
          d, v, lit, x: p.x, y: p.y, ax: a.x, ay: a.y,
          txt: lit && showVal ? d + " " + v : d,
          lx: +(cx + c * (R + 17)).toFixed(1), ly: +(cy + Math.sin(ang(i)) * (R + 17)).toFixed(1),
          anchor: Math.abs(c) < 0.2 ? "middle" : (c > 0 ? "start" : "end"),
        };
      });
      const lit = pts.filter(p => p.lit);
      // 只在相邻且都实测的两点之间连线，避免跨越未测域造成误读；实测域 ≥3 个即连成闭合区域
      const segs = [];
      for (let i = 0; i < 6; i++) {
        const a = pts[i], b = pts[(i + 1) % 6];
        if (a.lit && b.lit) segs.push({ x1: a.x, y1: a.y, x2: b.x, y2: b.y });
      }
      return {
        cx, cy, R, pts, lit, segs, full: lit.length >= 3,
        rings: [0.25, 0.5, 0.75, 1].map(k => DOMS.map((_, i) => { const p = at(i, k); return `${p.x},${p.y}`; }).join(" ")),
        spokes: DOMS.map((_, i) => at(i, 1)),
        poly: lit.map(p => `${p.x},${p.y}`).join(" "),
      };
    };
    const radarModel = computed(() => radarSvg(repData.value && repData.value.radar, { showVal: false }));
    /* 认知域分值：雷达图下方逐域呈现百分比，未测域标「未测」 */
    const repDomains = computed(() => {
      const r = (repData.value && repData.value.radar) || null;
      return DOMS.map(d => ({ d, v: r && r[d] != null ? r[d] : null }));
    });
    /* 报告：量表 / 范式分两块，渲染见全局组件 <project-result>（训练方案页共用同一套） */
    const weakDoms = computed(() => (repData.value && repData.value.radar) ? Object.entries(repData.value.radar).filter(([, v]) => v < 55).map(([k]) => k) : []);
    const midDoms = computed(() => (repData.value && repData.value.radar) ? Object.entries(repData.value.radar).filter(([, v]) => v >= 55 && v < 75).map(([k]) => k) : []);
    const openReportByRec = async (rid, pid) => {
      const p = pid || (runData.value && runData.value.patient_id) || (cur.value && cur.value.id);
      const rs = await api("/reports?patientId=" + p);
      const r = rs.find(x => x.record_id === rid);
      if (r) openReport(r.id); else msg.warning("该评估尚未生成报告");
    };

    /* ---------- 评分提交：核对作答并逐项打分 ---------- */
    const reviewRec = ref(null), reviewData = ref(null), reviewLoading = ref(false);
    /* 项目折叠：点击项目名称栏展开题目与分数，再点收起 */
    const rvOpen = ref({});
    const toggleRv = (code) => { rvOpen.value = { ...rvOpen.value, [code]: !rvOpen.value[code] }; };
    const openReview = async (rec) => {
      reviewRec.value = rec; view.value = "assess-review"; reviewData.value = null;
      rvOpen.value = {}; // 整体评分页默认全部收起，只看各项目得分
      await loadReview();
    };
    /* 返回：回到该评估方案的项目表，可继续施测未完成项目 */
    const backToRun = async () => {
      runRec.value = reviewRec.value;
      view.value = "assess-run";
      await loadRun();
    };
    const loadReview = async () => {
      reviewLoading.value = true;
      try { reviewData.value = await api("/assessments/" + reviewRec.value + "/review"); }
      catch (e) { msg.error(e.message); }
      reviewLoading.value = false;
    };
    /* 演示题（学习阶段 / 练习组）不计分：汇总与保存都要跳过，否则练习得分会被算进项目总分 */
    /* 项目标题：编码与名称重复时只显示一个（如 STROOP / Stroop 色词测验（SCWT）） */
    const projTitle = (code, name) => {
      const c = String(code || "").trim(), n = String(name || "").trim();
      if (!c) return n;
      if (n.toLowerCase().startsWith(c.toLowerCase())) return n;
      return c + " " + n;
    };
    const pjScore = (pj) => pj.items.reduce((a, i) => a + (i.demo ? 0 : (Number(i.score) || 0)), 0);
    const pjMax = (pj) => pj.items.reduce((a, i) => a + (i.demo ? 0 : (i.max || 0)), 0);
    /* 未完成施测的项目数：全部完成才允许确认提交 */
    const rvPending = computed(() => (reviewData.value ? (reviewData.value.projects || []).filter(p => !p.recorded).length : 0));
    /* 方案项目数（含尚未施测的），页头用它而不是已施测项目数 */
    const rvPlanCount = computed(() => {
      if (!reviewData.value) return 0;
      let total = 0;
      try { total = JSON.parse(reviewData.value.record.items || "[]").length; } catch (e) { total = 0; }
      return total || (reviewData.value.projects || []).length;
    });
    const saveReviewScores = async (silent) => {
      if (!reviewData.value) return true;
      try {
        for (const pj of reviewData.value.projects) {
          const scores = {};
          pj.items.forEach(i => { if (!i.demo) scores[i.id] = Number(i.score) || 0; });
          await api("/assessments/" + reviewRec.value + "/review-scores", { method: "POST", body: { code: pj.code, scores } });
        }
        if (!silent) {
          msg.success("评分已保存");
          // 保存后回到该评估方案的项目表，继续施测其余项目
          runRec.value = reviewRec.value;
          view.value = "assess-run";
          await loadRun();
        }
        return true;
      } catch (e) { msg.error(e.message); return false; }
    };
    const completeReview = async () => {
      try {
        await mbx.confirm("将按当前评分生成评估报告并归档，确认提交？", "确认提交",
          { type: "warning", confirmButtonText: "确认提交", cancelButtonText: "再核对一下" });
      } catch (e) { return; }
      if (!(await saveReviewScores(true))) return;
      try {
        const d = await api("/assessments/" + reviewRec.value + "/complete-review", { method: "POST" });
        msg.success("已提交，报告已生成：" + d.reportNo);
        await loadAssessList();
        openReport(d.reportId);
      } catch (e) { msg.error(e.message); }
    };

    /* ---------- 方案管理 ---------- */
    const planTab = ref("assess");

    /* ---------- 训练方案 ---------- */
    const reco = ref(null), basket = ref([]);
    const prForm = reactive({ items: 3, minutes: 30, freq: 3, weeks: 12, locked: false });
    /* 生成 → 推送 两段式：planId 生成后置位（生成按钮置灰），pushed 推送后置位（推送按钮显示已推送并置灰） */
    const prPlanId = ref(null), prSaving = ref(false);
    /* 与评估报告同一口径：轴标签不带分值 + 下方六域百分比条 */
    const prRadarModel = computed(() => radarSvg(reco.value && reco.value.radar, { showVal: false }));
    const prDomains = computed(() => {
      const r = (reco.value && reco.value.radar) || null;
      return DOMS.map(d => ({ d, v: r && r[d] != null ? r[d] : null }));
    });
    /* 手动添加训练方案：从训练题库按认知域挑选，不受系统推荐限制 */
    const ARCH_NAME = { stream: "连续反应", grid: "目标搜索", tower: "规划搭建", seq: "序列回忆", recall: "词语回忆", scene: "情景任务", mcq: "图文选择", canvas: "临摹绘图" };
    const archName = (k) => ARCH_NAME[k] || k || "—";
    const trainPick = reactive({ show: false, dom: "全部", q: "", sel: [] });
    const trainPickRows = computed(() => {
      const list = activeTrainings.value;
      const q = (trainPick.q || "").trim();
      return list.filter(t => (trainPick.dom === "全部" || t.domain === trainPick.dom)
        && (!q || t.name.indexOf(q) >= 0 || t.code.toLowerCase().indexOf(q.toLowerCase()) >= 0));
    });
    const openTrainPick = () => {
      if (!banks.value) return msg.warning("题库尚未加载完成");
      trainPick.dom = "全部"; trainPick.q = ""; trainPick.sel = []; trainPick.show = true;
    };
    /* 训练项上限：3–24（默认 3），与方案清单条数一致 */
    const TRAIN_MIN = 3, TRAIN_MAX = 24;
    const trainItemOptions = Array.from({ length: TRAIN_MAX - TRAIN_MIN + 1 }, (_, i) => TRAIN_MIN + i);
    const inBasket = (code) => basket.value.some(b => b.program === code);
    const pushBasket = (domain, program, name, startLevel) => {
      basket.value.push({ domain, program, name, startLevel: startLevel || 1 });
    };
    /* 按「训练项」补齐：先用系统推荐（未被选中的），不足再从同认知域的题库补 */
    const fillBasket = (target) => {
      const recs = (reco.value && reco.value.ok ? reco.value.plans : []) || [];
      for (const p of recs) {
        if (basket.value.length >= target) break;
        if (!inBasket(p.program)) pushBasket(p.domain, p.program, p.name, p.start);
      }
      if (basket.value.length >= target) return;
      const all = activeTrainings.value;
      const doms = [...new Set(basket.value.map(b => b.domain).filter(Boolean))];
      const order = doms.length ? [...all.filter(t => doms.includes(t.domain)), ...all.filter(t => !doms.includes(t.domain))] : all;
      for (const t of order) {
        if (basket.value.length >= target) break;
        if (!inBasket(t.code)) pushBasket(t.domain, t.code, t.name, 1);
      }
    };
    /* 训练项变更：增加则自动补齐，减少则从末尾裁剪 */
    const applyTrainItems = (n) => {
      const target = Math.max(TRAIN_MIN, Math.min(TRAIN_MAX, Number(n) || TRAIN_MIN));
      if (target > basket.value.length) fillBasket(target);
      else if (target < basket.value.length) basket.value.splice(target);
      prForm.items = basket.value.length;
    };
    const removeBasket = (row) => {
      const i = basket.value.indexOf(row);
      if (i >= 0) basket.value.splice(i, 1);
      prForm.items = basket.value.length;
    };
    const addManual = (t) => {
      if (inBasket(t.code)) return msg.warning("该方案已在当前方案中");
      if (basket.value.length >= TRAIN_MAX) return msg.warning("训练项已达上限 " + TRAIN_MAX + " 项，请先移除一项");
      pushBasket(t.domain, t.code, t.name, 1);
      prForm.items = basket.value.length;
      msg.success("已加入「" + t.name + "」");
    };
    /* 批量加入所选 */
    const addManualBatch = () => {
      const rows = trainPickRows.value.filter(t => trainPick.sel.includes(t.code));
      if (!rows.length) return msg.warning("请先勾选要加入的训练方案");
      let added = 0, skipped = 0;
      for (const t of rows) {
        if (inBasket(t.code)) { skipped++; continue; }
        if (basket.value.length >= TRAIN_MAX) { skipped++; continue; }
        pushBasket(t.domain, t.code, t.name, 1); added++;
      }
      prForm.items = basket.value.length;
      trainPick.sel = [];
      msg.success(added ? "已加入 " + added + " 项" + (skipped ? "，" + skipped + " 项已存在或超出上限" : "") : "没有可加入的方案");
    };
    const openPrescribe = async (pid) => {
      cur.value = await api("/patients/" + pid);
      reco.value = await api("/recommendations?patientId=" + pid);
      basket.value = [];
      prPlanId.value = null;
      prForm.minutes = 30; prForm.freq = 3; prForm.weeks = 12; prForm.locked = false;
      // 进行中的方案已锁定：回填其内容，不再按推荐重新生成
      try {
        const ps = await api("/prescriptions?patientId=" + pid);
        const act = (ps || []).find(x => x.status === "进行中");
        if (act) {
          prPlanId.value = act.id;
          basket.value = (act.items || []).map(i => ({ domain: i.domain || "", program: i.program, name: i.name, startLevel: i.startLevel }));
          prForm.minutes = act.minutes || 30;
          prForm.freq = act.freq || 3;
          prForm.weeks = act.weeks || 12;
          prForm.locked = !!act.locked;
        }
      } catch (e) { /* 无权限时忽略 */ }
      if (!prPlanId.value && reco.value.ok) fillBasket(TRAIN_MIN);
      prForm.items = basket.value.length || TRAIN_MIN;
      view.value = "prescribe";
    };
    const addPlan = (pl) => {
      if (inBasket(pl.program)) return msg.warning("该方案已在当前方案中");
      if (basket.value.length >= TRAIN_MAX) return msg.warning("训练项已达上限 " + TRAIN_MAX + " 项，请先移除一项");
      pushBasket(pl.domain, pl.program, pl.name, pl.start);
      prForm.items = basket.value.length;
    };
    const savePlan = async () => {
      if (!basket.value.length) return msg.warning("请先加入训练方案");
      if (basket.value.length < TRAIN_MIN) return msg.warning("训练项至少 " + TRAIN_MIN + " 项，当前 " + basket.value.length + " 项");
      if (basket.value.length > TRAIN_MAX) return msg.warning("训练项最多 " + TRAIN_MAX + " 项，当前 " + basket.value.length + " 项");
      if (prPlanId.value) return msg.warning("训练方案已生成，可继续在患者端训练");
      prSaving.value = true;
      try {
        const r = await api("/prescriptions", { method: "POST", body: { patientId: cur.value.id, items: basket.value, itemsCount: basket.value.length, minutes: prForm.minutes, freq: prForm.freq, weeks: prForm.weeks, locked: prForm.locked } });
        prPlanId.value = r.planId;
        cur.value = await api("/patients/" + cur.value.id);   // 同步方案状态，页头锁定标识即时出现
        await loadPatients();   // 训练状态变「进行中」，返回训练情况表即为最新
        msg.success("训练方案已生成，患者端已可开始训练");
      } catch (e) { msg.error(e.message); }
      prSaving.value = false;
    };

    /* ---------- 数据记录（评估 → 训练 → 复评 全量数据） ---------- */
    const recPatient = ref(null), rec = ref(null), recLoading = ref(false);
    // 四个数据块：评估记录 / 训练记录 / 依从性 / 训练效果，点击切换下方内容
    const recBlock = ref("assess");
    const recAssessId = ref(null), recRep = ref(null);        // 选中的评估记录与该次报告
    const recPlanId = ref(null), recAdhPlanId = ref(null);    // 训练记录 / 依从性 各自选中的方案
    const recTrainView = ref("trend");                         // 成绩趋势 / 认知域 / 完成情况 / 明细
    const recPage = ref(1);
    const recSize = 10;
    const recLine = ref(null), recDom = ref(null), recWeek = ref(null);
    const recPick = reactive({ show: false, kw: "", page: 1, size: 8 });
    const p2 = (n) => String(n).padStart(2, "0");
    const DOMHEX = { "复合性注意": "#3b82f6", "执行能力": "#d97706", "学习与记忆": "#e05252", "语言": "#7c5cf0", "视结构-知觉能力": "#0e9f8a", "社会认知": "#db3f8a" };
    // 成绩趋势折线按项目区分，色相拉开（红/绿/蓝/橙/紫/青…），同域多项目也不混色
    const LINE_PALETTE = ["#e5484d", "#12a150", "#2f6fed", "#f59e0b", "#8b5cf6", "#06b6d4", "#ec4899", "#64748b"];

    const openRecords = async (pid, name, block) => {
      // 兼容旧入口：overview / detail → 训练记录，adherence → 依从性
      const map = { assess: "assess", train: "train", overview: "train", detail: "train", adhere: "adhere", adherence: "adhere", review: "review" };
      recBlock.value = map[block] || "assess";
      recTrainView.value = block === "detail" ? "detail" : "trend";
      recPatient.value = { id: pid, name };
      view.value = "records";
      recPage.value = 1; rec.value = null; recRep.value = null;
      recAssessId.value = null; recPlanId.value = null; recAdhPlanId.value = null;
      recBaseId.value = null; recCurId.value = null;
      await loadRecords();
    };
    const loadRecords = async () => {
      if (!recPatient.value) return;
      recLoading.value = true;
      try {
        rec.value = await api(`/stats/patient/${recPatient.value.id}?limit=${recSize}&offset=${(recPage.value - 1) * recSize}` +
          (recPlanId.value ? "&planId=" + recPlanId.value : ""));
        initRecSel();
        await loadRecAssessRep();
        if (recBlock.value === "review") loadRecCmp();
        nextTick(() => drawRec());
      } catch (e) { msg.error(e.message); } finally { recLoading.value = false; }
    };
    const initRecSel = () => {
      const d = rec.value; if (!d) return;
      if (!recAssessId.value || !d.assess.some(a => a.id === recAssessId.value)) {
        const a = d.assess.find(x => x.report_id) || d.assess[0];
        recAssessId.value = a ? a.id : null;
      }
      // 默认落到「有训练记录的方案」，避免新生成尚未开训的方案展示空图
      const withRec = d.plans.find(p => p.status === "进行中" && p.doneSessions > 0) || d.plans.find(p => p.doneSessions > 0) || d.plans[0];
      if (!recPlanId.value || !d.plans.some(p => p.id === recPlanId.value)) recPlanId.value = withRec ? withRec.id : null;
      if (!recAdhPlanId.value || !d.plans.some(p => p.id === recAdhPlanId.value)) recAdhPlanId.value = withRec ? withRec.id : null;
      initRecCompare();
    };
    const onRecPage = (p) => { recPage.value = p; loadRecords(); };

    /* 评估记录：切换历次评估并载入该次报告（报告详情按 id 缓存，来回切换不再重复请求） */
    const repCache = {};
    const getRep = async (id) => { if (!repCache[id]) repCache[id] = await api("/reports/" + id); return repCache[id]; };
    const loadRecAssessRep = async () => {
      recRep.value = null;
      const d = rec.value; if (!d || !recAssessId.value) return;
      const a = d.assess.find(x => x.id === recAssessId.value);
      if (!a || !a.report_id) return;
      try { recRep.value = await getRep(a.report_id); } catch (e) { /* 报告读取失败时保持空态 */ }
    };
    const recAssessCur = computed(() => {
      const d = rec.value; if (!d) return null;

    });
    const pickAssess = (row) => {
      if (row.id === recAssessId.value && recRep.value) return;

    /* 训练记录 / 依从性：切换方案 */
    const pickPlan = (p) => { if (p.id === recPlanId.value) return; recPlanId.value = p.id; recPage.value = 1; loadRecords(); };
    const pickAdhPlan = (p) => { recAdhPlanId.value = p.id; };

    const chart = (el, opt) => {
      if (!el) return;
      if (el.__inst) el.__inst.dispose();
      const inst = echarts.init(el); el.__inst = inst; inst.setOption(opt);
    };
    const AXL = { axisLine: { lineStyle: { color: "#e6ebf0" } }, axisLabel: { color: "#8b9aa8", fontSize: 10.5 }, axisTick: { show: false } };
    const GRID = { left: 42, right: 18, top: 34, bottom: 26 };

    const drawRec = () => {
      const d = rec.value; if (!d) return;
      const b = recBlock.value;

      // 训练成绩趋势：当前方案下各项目逐次正确率
      if (b === "train" && recTrainView.value === "trend") {
        const pl = recPlan.value; if (!pl || !pl.progs.length) return;
        const maxLen = Math.max(0, ...pl.progs.map(t => t.trend.length));
        chart(recLine.value, {
          tooltip: { trigger: "axis" },
          legend: { top: 0, icon: "roundRect", itemWidth: 8, itemHeight: 8, textStyle: { fontSize: 10.5 } },
          grid: GRID,
          xAxis: { type: "category", data: Array.from({ length: maxLen }, (_, i) => "第" + (i + 1) + "次"), ...AXL },
          yAxis: { type: "value", max: 100, min: 40, splitLine: { lineStyle: { color: "#f1f4f7" } }, axisLabel: { formatter: "{value}%", color: "#8b9aa8", fontSize: 10.5 } },
          series: pl.progs.map((t, i) => ({
            name: t.program + " " + t.name, type: "line", smooth: 0.3,
            showSymbol: t.trend.length <= 15, symbolSize: 5, lineStyle: { width: 2 },
            itemStyle: { color: LINE_PALETTE[i % LINE_PALETTE.length] }, data: t.trend.map(p => p.acc),
          })),
        });
      }

      // 训练认知域：当前方案内各认知域训练次数
      if (b === "train" && recTrainView.value === "domain") {
        const pl = recPlan.value; if (!pl || !pl.domains.length) return;
        const ds = [...pl.domains].reverse();
        chart(recDom.value, {
          tooltip: { trigger: "item", formatter: p => `${p.name}<br/>${p.value} 次 · 覆盖 ${ds[p.dataIndex].programs} 个方案 · 均分 ${ds[p.dataIndex].avgAcc}%` },
          grid: { left: 78, right: 52, top: 12, bottom: 12 },
          xAxis: { type: "value", splitLine: { lineStyle: { color: "#f1f4f7" } }, axisLabel: { color: "#8b9aa8", fontSize: 10.5 } },
          yAxis: { type: "category", data: ds.map(x => x.domain), axisLine: { show: false }, axisTick: { show: false }, axisLabel: { color: "#4b5f72", fontSize: 11.5 } },
          series: [{
            type: "bar", barWidth: 14,
            data: ds.map(x => ({ value: x.sessions, itemStyle: { color: DOMHEX[x.domain], borderRadius: [0, 4, 4, 0] } })),
            label: { show: true, position: "right", formatter: "{c} 次", color: "#7b8b9a", fontSize: 10.5 },
          }],
        });
      }

      // 依从性：方案周期内逐周执行量 vs 方案目标

        const pl = recAdhPlan.value; if (!pl || !pl.weekly.length) return;
        const w = pl.weekly;
        chart(recWeek.value, {
          tooltip: { trigger: "axis" },
          grid: { left: 40, right: 16, top: 26, bottom: 26 },
          xAxis: { type: "category", data: w.map(x => x.week.slice(5)), ...AXL },
          yAxis: { type: "value", minInterval: 1, splitLine: { lineStyle: { color: "#f1f4f7" } }, axisLabel: { color: "#8b9aa8", fontSize: 10.5 } },
          series: [{
            name: "训练次数", type: "bar", barWidth: 18,
            data: w.map(x => ({ value: x.sessions, itemStyle: { color: x.rate >= 80 ? "#0e9f8a" : x.rate >= 50 ? "#d97706" : "#e05252", borderRadius: [4, 4, 0, 0] } })),
            markLine: { silent: true, symbol: "none", data: [{ yAxis: pl.target, label: { formatter: "目标 " + pl.target + " 次", fontSize: 10, color: "#7b8b9a" }, lineStyle: { color: "#c3ced8", type: "dashed" } }] },
          }],
        });
      }
    };
    watch([recBlock, recTrainView, recAdhPlanId], () => nextTick(() => drawRec()));
    watch(recBlock, (b) => { if (b === "review") loadRecCmp(); });

    /* 当前选中的训练方案 / 依从性方案 */
    const recPlan = computed(() => {
      const d = rec.value; if (!d) return null;
      return d.plans.find(p => p.id === recPlanId.value) || d.plans[0] || null;
    });
    const recAdhPlan = computed(() => {
      const d = rec.value; if (!d) return null;

    /* 依从性：按方案周期铺日历（周一起始，共 N 周） */

      const pl = recAdhPlan.value;
      if (!pl || !pl.startAt) return { cells: [], weeks: 0 };
      const map = {};
      (pl.daily || []).forEach(x => { map[x.d] = x; });
      const start = new Date(pl.startAt + "T00:00:00");
      start.setDate(start.getDate() - ((start.getDay() + 6) % 7));
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const weeks = pl.weeks || 1;
      const cells = [];
      for (let i = 0; i < weeks * 7; i++) {
        const dt = new Date(start.getTime() + i * 86400000);
        const k = dt.getFullYear() + "-" + p2(dt.getMonth() + 1) + "-" + p2(dt.getDate());

        const m = r0 ? r0.minutes : 0;
        let lv = "l0";
        if (dt > today) lv = "fut";
        else if (m > 0 && m < 10) lv = "l1";
        else if (m >= 10 && m < 20) lv = "l2";
        else if (m >= 20 && m < 30) lv = "l3";
        else if (m >= 30) lv = "l4";

      const t0 = new Date(); t0.setHours(0, 0, 0, 0);
      const elapsed = (w) => {
        const s = new Date(String(w.week) + "T00:00:00");
        return !isNaN(s.getTime()) && new Date(s.getTime() + 6 * 86400000) < t0;

        weeks: wk.length,

        const days = from && to ? Math.round((new Date(to) - new Date(from)) / 86400000) : 0;
        nodes.push({ kind: "train", id: p.id, at: from, to, days, sessions: p.doneSessions, plans: 1, idx: i + 1 });

              <span class="tp-sub">六大认知域 · 24 项训练方案 · 10 级难度关卡</span>

                </el-form-item></el-col>

                <el-col :span="24"><el-form-item label="方案说明"><el-input v-model="libEdit.desc" placeholder="适用场景、注意事项等" /></el-form-item></el-col>

                <div style="border:1px solid var(--c-line);border-radius:10px;padding:12px 14px;width:100%;background:var(--c-surface-2)">

                    <el-checkbox v-for="s in pickGroups[0].items" :key="s.code" :disabled="s.pending" :value="'scale:' + s.code">

                    </el-checkbox>
                  </el-checkbox-group>
                  <div style="font-size:12px;color:var(--c-text-3);margin:12px 0 6px">全量项 · 范式（{{ activeParadigms.length }}）</div>
                  <el-checkbox-group v-model="libChecked" class="lib-pick">
                    <el-checkbox v-for="p in pickGroups[1].items" :key="p.code" :disabled="p.pending" :value="'paradigm:' + p.code">
                      <span class="mono" style="font-size:11.5px;color:var(--c-text-3)">{{ p.code }}</span> {{ p.name.replace(/（.*?）/g, "").replace(new RegExp("^" + p.code + "\\s*", "i"), "") }}<span v-if="p.pending" class="pending-tag">待开放</span>
                    </el-checkbox>
                  </el-checkbox-group>
                </div>
              </el-form-item>
              <div style="font-size:12px;color:var(--c-text-3)">已选 <b class="num">{{ libChecked.length }}</b> 项 · 全量项共 {{ activeScales.length + activeParadigms.length }} 项</div>
