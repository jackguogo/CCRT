<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理端 · 认知功能障碍评估与训练软件 HS-CRT-01</title>
<link rel="stylesheet" href="/vendor/element-plus.css"><link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/theme.css">
<style>[v-cloak]{display:none}
.el-menu-item{user-select:none}
.mini-chart{height:190px}
.act-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--c-line);font-size:12.5px}
.act-row:last-child{border-bottom:none}
.act-row .tm{color:var(--c-text-3);font-family:var(--font-num);width:120px;flex-shrink:0}
.act-row .who{width:76px;flex-shrink:0;color:var(--c-text-2)}
.act-row .ac{width:88px;flex-shrink:0;font-weight:600}
.act-row .dt{flex:1;color:var(--c-text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filter-line{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filter-line+.filter-line{margin-top:9px}
.dict-body{display:grid;grid-template-columns:212px 1fr;gap:14px;align-items:start}
.dict-nav{border:1px solid var(--c-line);border-radius:10px;overflow:hidden;background:#fff}
.dict-nav-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px 8px 12px;
  border-bottom:1px solid var(--c-line);background:var(--c-surface-2)}
.dict-nav-head .t{font-size:12.5px;font-weight:600;color:var(--c-text);white-space:nowrap;flex-shrink:0}
.dict-nav button{display:flex;align-items:center;gap:7px;width:100%;text-align:left;border:none;background:none;
  padding:10px 12px;font-size:13px;color:var(--c-text-2);cursor:pointer;border-left:2px solid transparent;font-family:inherit}
.dict-nav button+button{border-top:1px solid var(--c-line-2)}
.dict-nav button:hover{background:var(--c-surface-2)}
.dict-nav button.on{background:var(--c-primary-soft);color:var(--c-primary);border-left-color:var(--c-primary);font-weight:600}
.dict-nav button .dn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dict-nav button .dc{font-family:var(--font-num);font-size:11px;color:var(--c-text-3)}
.dsc{font-size:10.5px;line-height:1.6;padding:0 5px;border-radius:4px;background:var(--c-surface-2);
  color:var(--c-text-3);flex-shrink:0;white-space:nowrap}
</style></head><body>
<div id="app" v-cloak></div>
<script src="/vendor/vue.global.prod.js"></script>
<script src="/vendor/element-plus.full.min.js"></script>
<script src="/vendor/element-icons.iife.min.js"></script>
<script src="/vendor/element-zh-cn.min.js"></script>
<script src="/vendor/echarts.min.js"></script>
<script src="/icons.js"></script>
<script>
/* ============================================================================
   管理端 —— 工作台 / 用户管理 / 数据管理 / 系统设置
   对应 SRS FR-A（用户与权限）、FR-C（数据管理、导出、备份）
   ========================================================================== */
const { createApp, ref, reactive, computed, onMounted, nextTick, watch } = Vue;
const El = ElementPlus;
const msg = El.ElMessage, mbx = El.ElMessageBox;

const MENU = [
  { group: "用户管理", items: [{ k: "doctors", n: "医生管理", i: "User" }, { k: "patients", n: "患者管理", i: "Avatar" }] },
  { group: "数据管理", items: [{ k: "assess", n: "评估数据", i: "Tickets" }, { k: "train", n: "训练记录", i: "Histogram" }] },
  { group: "系统设置", items: [{ k: "accounts", n: "用户管理", i: "UserFilled" }, { k: "roles", n: "角色管理", i: "Lock" }, { k: "dict", n: "字典管理", i: "Collection" }, { k: "catalog", n: "项目配置", i: "Files" }] },
];
const TITLE = { doctors: "医生管理", patients: "患者管理", assess: "评估数据", train: "训练记录", accounts: "用户管理", roles: "角色管理", catalog: "项目配置", dict: "字典管理" };
const GROUP_OF = { doctors: "用户管理", patients: "用户管理", assess: "数据管理", train: "数据管理", accounts: "系统设置", roles: "系统设置", catalog: "系统设置", dict: "系统设置" };
const ROLE = { admin: "系统管理员", doctor: "医生", therapist: "治疗师", patient: "患者", family: "家属" };
const DICT_NAME = { dept: "科室", education: "学历", title: "职称", source: "患者来源", assess_type: "评估类型", stop_reason: "终止原因" };

const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const quickRange = (days) => { const e = new Date(); const s = new Date(); s.setDate(s.getDate() - days + 1); return [ymd(s), ymd(e)]; };

const App = {
  setup() {
    /* ---------- 基础设施 ---------- */
    const tk = ref(localStorage.getItem("hs_atk") || "");
    const user = ref(null);
    const view = ref("doctors");
    const loading = ref(false);
    const dicts = reactive({ dept: [], education: [], title: [], source: [], assess_type: [], stop_reason: [] });

    const api = async (u, opt = {}) => {
      const r = await fetch("/api/v1" + u, { ...opt, headers: { "Content-Type": "application/json", Authorization: "Bearer " + tk.value }, body: opt.body ? JSON.stringify(opt.body) : undefined });
      if (r.status === 401) { tk.value = ""; localStorage.removeItem("hs_atk"); user.value = null; throw new Error("会话已过期，请重新登录"); }
      const j = await r.json();
      if (j.code !== 0) throw new Error(j.message);
      return j.data;
    };
    const download = async (u, filename) => {
      try {
        const r = await fetch("/api/v1" + u, { headers: { Authorization: "Bearer " + tk.value } });
        if (!r.ok) throw new Error("导出失败（" + r.status + "）");
        const blob = await r.blob();
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob); a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        msg.success("已导出 " + filename);
      } catch (e) { msg.error(e.message); }
    };
    const loadDicts = async () => {
      for (const t of Object.keys(dicts)) {
        try { dicts[t] = await api("/dict/" + t); } catch (e) { dicts[t] = []; }
      }
    };

    /* ---------- 登录 ---------- */
    const lu = ref(""), lp = ref(""), logining = ref(false);
    /* 记住密码：仅存本机浏览器（localStorage），密码经 base64 转码后保存，取消勾选即清除 */
    const REMEMBER_KEY = "hs_remember_admin";
    const remember = ref(false);
    const b64e = (s) => btoa(String.fromCharCode(...new TextEncoder().encode(s)));
    const b64d = (s) => { try { return new TextDecoder().decode(Uint8Array.from(atob(s), c => c.charCodeAt(0))); } catch (e) { return ""; } };
    const loadRemember = () => {
      try {
        const raw = localStorage.getItem(REMEMBER_KEY);
        if (!raw) return;
        const o = JSON.parse(raw);
        if (o && o.u) { lu.value = o.u; lp.value = b64d(o.p || ""); remember.value = true; }
      } catch (e) { }
    };
    const saveRemember = () => {
      try {
        if (remember.value && lu.value.trim()) localStorage.setItem(REMEMBER_KEY, JSON.stringify({ u: lu.value.trim(), p: b64e(lp.value) }));
        else localStorage.removeItem(REMEMBER_KEY);
      } catch (e) { }
    };
    watch(remember, (v) => { if (!v) { try { localStorage.removeItem(REMEMBER_KEY); } catch (e) { } } });
    const doLogin = async () => {
      if (!lu.value.trim() || !lp.value) return msg.warning("请输入账号与密码");
      logining.value = true;
      try {
        const d = await api("/auth/login", { method: "POST", body: { username: lu.value.trim(), password: lp.value } });
        if (d.user.role !== "admin") return msg.error("请使用管理员账号登录管理端");
        saveRemember();
        tk.value = d.token; localStorage.setItem("hs_atk", d.token); user.value = d.user;
        await bootstrap();
        msg.success("欢迎回来，" + d.user.name);
      } catch (e) { msg.error(e.message); } finally { logining.value = false; }
    };
    const logout = async () => {
      try { await mbx.confirm("确认退出登录？", "提示", { type: "warning" }); } catch (e) { return; }
      tk.value = ""; localStorage.removeItem("hs_atk"); user.value = null;
    };

    /* ---------- 通用：空值占位与前端分页 ---------- */
    const dash = (v) => (v === null || v === undefined || v === "" || v === "-") ? "-" : v;
    const pager = (listRef, pageRef, sizeRef) => computed(() => {
      const a = listRef.value || [];
      const s = sizeRef.value;
      return a.slice((pageRef.value - 1) * s, pageRef.value * s);
    });
    const rowNo = (page, size, i) => (page - 1) * size + i + 1;

    /* ---------- 医生管理（工号 / 姓名 / 手机 / 医院 / 科室 / 角色 / 状态） ---------- */
    const dq = reactive({ kw: "", dept: "", role: "", status: "" });
    const doctors = ref([]), dTotal = ref(0), dPage = ref(1), dSize = ref(10);
    const dlg = ref(false), saving = ref(false);
    const uform = reactive({ id: 0, username: "", real_name: "", role: "doctor", dept: "", hospital: "", phone: "", status: 1 });
    const loadDoctors = async () => {
      loading.value = true;
      try {
        const p = new URLSearchParams({ scope: "staff" });
        if (dq.kw) p.set("kw", dq.kw); if (dq.dept) p.set("dept", dq.dept);
        if (dq.role) p.set("role", dq.role); if (dq.status !== "") p.set("status", dq.status);
        const d = await api("/users?" + p.toString());
        doctors.value = d.rows; dTotal.value = d.total;
      } catch (e) { msg.error(e.message); } finally { loading.value = false; }
    };
    const doctorsShown = pager(doctors, dPage, dSize);
    const searchDoctors = () => { dPage.value = 1; loadDoctors(); };
    const resetDoctors = () => { Object.assign(dq, { kw: "", dept: "", role: "", status: "" }); searchDoctors(); };
    const openUser = (u) => {
      Object.assign(uform, u
        ? { id: u.id, username: u.username, real_name: u.real_name, role: u.role, dept: u.dept || "", hospital: u.hospital || "", phone: u.phone || "", status: u.status ? 1 : 0 }
        : { id: 0, username: "", real_name: "", role: "doctor", dept: "", hospital: "", phone: "", status: 1 });
      dlg.value = true;
    };
    const saveUser = async () => {
      if (!uform.username.trim() || !uform.real_name.trim()) return msg.warning("工号与姓名为必填项");
      saving.value = true;
      try {
        if (uform.id) {
          await api("/users/" + uform.id, {
            method: "PUT",
            body: { real_name: uform.real_name, role: uform.role, dept: uform.dept, hospital: uform.hospital, phone: uform.phone, status: uform.status },
          });
          msg.success("已保存");
        } else {
          await api("/users", {
            method: "POST",
            body: { username: uform.username.trim(), real_name: uform.real_name, role: uform.role, dept: uform.dept, hospital: uform.hospital, phone: uform.phone },
          });
          msg.success("已新增");
        }
        dlg.value = false; loadDoctors();
      } catch (e) { msg.error(e.message); } finally { saving.value = false; }
    };
    const resetPwd = async (u) => {
      try { await mbx.confirm("重置「" + u.real_name + "」的密码为初始密码 hs123456？", "提示", { type: "warning" }); } catch (e) { return; }
      try { const d = await api("/users/" + u.id + "/reset-password", { method: "POST" }); msg.success(d || "已重置为初始密码 hs123456"); } catch (e) { msg.error(e.message); }
    };
    const permName = (p) => {
      const map = { "doc:patient": "患者信息", "doc:plan": "方案管理", "doc:assess": "评估功能", "doc:train": "训练功能", "doc:record": "数据记录", "admin:user": "用户管理", "admin:data": "数据管理", "admin:config": "系统设置", "admin:data:export": "数据导出" };
      return map[p] || p;
    };

    /* ---------- 系统设置 · 用户管理（全部账号） ---------- */
    const aq2 = reactive({ kw: "", role: "", status: "" });
    const accounts = ref([]), aTotal = ref(0), aPage = ref(1), aSize = ref(10);
    const roleOpts = ref([]);
    const adlg = ref(false), aSaving = ref(false);
    const aform = reactive({ id: 0, username: "", real_name: "", role: "doctor", status: 1 });
    const loadRoleOpts = async () => { try { roleOpts.value = await api("/admin/role-options"); } catch (e) { roleOpts.value = []; } };
    // 医生管理只涉及医护人员角色，管理员账号在「系统设置 → 用户管理」中维护
    const staffRoles = computed(() => roleOpts.value.filter(r => r.key !== "admin"));
    const roleName = (k) => { const r = roleOpts.value.find(x => x.key === k); return r ? r.name : (ROLE[k] || k); };
    const loadAccounts = async () => {
      loading.value = true;
      try {
        const p = new URLSearchParams();
        p.set("scope", "sys");
        if (aq2.kw) p.set("kw", aq2.kw);
        if (aq2.role) p.set("role", aq2.role);
        if (aq2.status !== "") p.set("status", aq2.status);
        const d = await api("/users?" + p.toString());
        accounts.value = d.rows; aTotal.value = d.total;
      } catch (e) { msg.error(e.message); } finally { loading.value = false; }
    };
    const accountsShown = pager(accounts, aPage, aSize);
    const searchAccounts = () => { aPage.value = 1; loadAccounts(); };
    const resetAccounts = () => { Object.assign(aq2, { kw: "", role: "", status: "" }); searchAccounts(); };
    const openAccount = (u) => {
      Object.assign(aform, u
        ? { id: u.id, username: u.username, real_name: u.real_name, role: u.role, status: u.status ? 1 : 0 }
        : { id: 0, username: "", real_name: "", role: "doctor", status: 1 });
      adlg.value = true;
    };
    const saveAccount = async () => {
      if (!aform.username.trim() || !aform.real_name.trim()) return msg.warning("用户名与姓名为必填项");
      aSaving.value = true;
      try {
        if (aform.id) {
          await api("/users/" + aform.id, { method: "PUT", body: { real_name: aform.real_name, role: aform.role, status: aform.status } });
          msg.success("已保存");
        } else {
          await api("/users", { method: "POST", body: { username: aform.username.trim(), real_name: aform.real_name, role: aform.role } });
          msg.success("已新增");
        }
        adlg.value = false; loadAccounts();
      } catch (e) { msg.error(e.message); } finally { aSaving.value = false; }
    };

    /* ---------- 患者管理 ---------- */
    const pq = reactive({ kw: "", dept: "", status: "" });
    const paccs = ref([]), pPage = ref(1), pSize = ref(10), pdrawer = ref(false), pdetail = ref(null);
    const loadPaccs = async () => {
      loading.value = true;
      try {
        const p = new URLSearchParams();
        if (pq.kw) p.set("kw", pq.kw); if (pq.dept) p.set("dept", pq.dept);
        if (pq.status !== "") p.set("status", pq.status);
        paccs.value = await api("/admin/patient-accounts?" + p.toString());
      } catch (e) { msg.error(e.message); } finally { loading.value = false; }
    };
    const paccsShown = pager(paccs, pPage, pSize);
    const searchPaccs = () => { pPage.value = 1; loadPaccs(); };
    const resetPaccs = () => { Object.assign(pq, { kw: "", dept: "", status: "" }); searchPaccs(); };
    const ageOf = (bd) => bd ? Math.floor((Date.now() - new Date(bd)) / 31557600000) : "-";
    const openPatient = async (row) => {
      pdrawer.value = true; pdetail.value = null;
      try { pdetail.value = await api("/admin/patient/" + row.pid); } catch (e) { msg.error(e.message); }
    };
    const togglePacc = async (u) => {
      try { await mbx.confirm("确认" + (u.status ? "停用" : "启用") + "患者账号「" + u.name + "」？停用后患者无法登录患者端。", "提示", { type: "warning" }); } catch (e) { return; }
      try { await api("/admin/patient-accounts/" + u.id, { method: "PUT", body: { status: u.status ? 0 : 1 } }); msg.success("已更新"); loadPaccs(); } catch (e) { msg.error(e.message); }
    };
    const resetPaccPwd = async (u) => {
      try { await mbx.confirm("重置「" + u.name + "」的患者端密码为初始密码 hs123456？", "提示", { type: "warning" }); } catch (e) { return; }
      try { const d = await api("/admin/patient-accounts/" + u.id + "/reset-password", { method: "POST" }); msg.success(d || "已重置"); } catch (e) { msg.error(e.message); }
    };

    /* ---------- 评估数据（只记录已完成评估） ---------- */
    const aq = reactive({ kw: "", dept: "", doctor: "", hasReport: "", range: [], page: 1, size: 10 });
    const aExpand = ref(false);
    // 收起后仍生效的隐藏条件数，避免「筛选条件看不见但还在起作用」
    const aMore = computed(() => [aq.doctor, aq.hasReport].filter(Boolean).length);
    const ares = reactive({ rows: [], total: 0 });
    const filters = ref({ depts: [], doctors: [], programs: [], results: [] });
    const loadFilters = async () => { try { filters.value = await api("/admin/filters"); } catch (e) { /* 无权限时保持空 */ } };
    const aqs = () => {
      const p = new URLSearchParams();
      Object.entries({ kw: aq.kw, dept: aq.dept, doctor: aq.doctor, hasReport: aq.hasReport }).forEach(([k, v]) => { if (v) p.set(k, v); });
      if (aq.range && aq.range.length === 2) { p.set("from", aq.range[0]); p.set("to", aq.range[1]); }
      return p;
    };
    const loadAssess = async () => {
      loading.value = true;
      try {
        const p = aqs(); p.set("limit", aq.size); p.set("offset", (aq.page - 1) * aq.size);
        const d = await api("/admin/assess?" + p.toString());
        ares.rows = d.rows; ares.total = d.total;
      } catch (e) { msg.error(e.message); } finally { loading.value = false; }
    };
    const searchAssess = () => { aq.page = 1; loadAssess(); };
    const exportAssess = () => { const p = aqs(); download("/export/assess?" + p.toString(), "assess.csv"); };
    // 单次评估的项目与分值明细
    const adetail = ref(false), adetailData = ref(null), adetailLoading = ref(false);
    const openAssess = async (row) => {
      adetail.value = true; adetailData.value = null; adetailLoading.value = true;
      try { adetailData.value = await api("/admin/assess/" + row.record_id); }
      catch (e) { msg.error(e.message); } finally { adetailLoading.value = false; }
    };
    const itemScore = (p) => {
      if (!p) return "-";
      if (p.total !== undefined && p.total !== null) return p.total + " / " + (p.max || "-") + (p.adjust ? "（教育调整+" + p.adjust + "）" : "");
      if (p.metrics) return Object.entries(p.metrics).map(([k, v]) => k + " " + v).join("；");
      return "-";
    };

    /* ---------- 训练记录 ---------- */
    const tq = reactive({ kw: "", program: "", result: "", dept: "", levelMin: null, levelMax: null, range: [], page: 1, size: 10 });
    const tExpand = ref(false);
    const tMore = computed(() => [tq.dept, tq.result, tq.levelMin, tq.levelMax].filter(v => v !== "" && v !== null && v !== undefined).length);
    const tres = reactive({ rows: [], total: 0 });
    const tqs = () => {
      const p = new URLSearchParams();
      Object.entries({ kw: tq.kw, program: tq.program, result: tq.result, dept: tq.dept }).forEach(([k, v]) => { if (v) p.set(k, v); });
      if (tq.levelMin !== null && tq.levelMin !== "") p.set("levelMin", tq.levelMin);
      if (tq.levelMax !== null && tq.levelMax !== "") p.set("levelMax", tq.levelMax);
      if (tq.range && tq.range.length === 2) { p.set("from", tq.range[0]); p.set("to", tq.range[1]); }
      return p;
    };
    const loadTrain = async () => {
      loading.value = true;
      try {
        const p = tqs(); p.set("limit", tq.size); p.set("offset", (tq.page - 1) * tq.size);
        const d = await api("/admin/train?" + p.toString());
        tres.rows = d.rows; tres.total = d.total;
      } catch (e) { msg.error(e.message); } finally { loading.value = false; }
    };
    const searchTrain = () => { tq.page = 1; loadTrain(); };
    const exportTrain = () => { const p = tqs(); download("/export/train?" + p.toString(), "train.csv"); };
    const resetAssess = () => { Object.assign(aq, { kw: "", dept: "", doctor: "", hasReport: "", range: [], page: 1 }); loadAssess(); };
    const resetTrain = () => { Object.assign(tq, { kw: "", program: "", result: "", dept: "", levelMin: null, levelMax: null, range: [], page: 1 }); loadTrain(); };

    /* ---------- 角色管理（可维护：名称 / 状态 / 权限） ---------- */
    const roles = ref([]), roleTree = ref([]), rTotal = ref(0), rPage = ref(1), rSize = ref(10);
    const rq = reactive({ name: "", status: "" });
    const rdlg = ref(false), rSaving = ref(false);
    const rform = reactive({ id: 0, name: "", status: 1, perms: [], builtin: false });
    const loadRoles = async () => {
      loading.value = true;
      try {
        const d = await api("/admin/roles");
        roles.value = d.rows; roleTree.value = d.tree; rTotal.value = d.rows.length;
      } catch (e) { msg.error(e.message); } finally { loading.value = false; }
    };
    const rolesShown = computed(() => {
      const a = roles.value.filter(r => (!rq.name || r.name.includes(rq.name)) && (rq.status === "" || r.status === rq.status));
      rTotal.value = a.length;
      return a.slice((rPage.value - 1) * rSize.value, rPage.value * rSize.value);
    });
    const searchRoles = () => { rPage.value = 1; };
    const resetRoles = () => { Object.assign(rq, { name: "", status: "" }); rPage.value = 1; };
    const openRole = (r) => {
      Object.assign(rform, r
        ? { id: r.id, name: r.name, status: r.status, perms: [...r.perms], builtin: r.builtin }
        : { id: 0, name: "", status: 1, perms: [], builtin: false });
      rdlg.value = true;
      nextTick(() => nextTick(() => { if (treeRef.value) treeRef.value.setCheckedKeys(rform.perms); }));
    };
    const treeRef = ref(null);

          <el-dialog v-model="rdlg" :title="rform.id ? '编辑角色' : '新增角色'" width="640px">

            <el-table :data="ctShown" v-loading="ctLoading" style="width:100%">

              <el-table-column v-if="ctTab !== 'scale'" label="认知域" min-width="130" align="center">

              </el-table-column>
              <el-table-column v-if="ctTab === 'training'" label="关卡" min-width="82" align="center">

                  <el-select v-model="ctForm.weeks" style="width:130px">

                <el-table-column label="序号" width="72" align="center"><template #default="s">{{ rowNo(diPage, diSize, s.$index) }}</template></el-table-column>
                <el-table-column label="名称" min-width="180" align="center"><template #default="s">{{ dash(s.row.label) }}</template></el-table-column>

                <el-table-column label="状态" min-width="90" align="center">
                  <template #default="s"><el-tag size="small" :type="s.row.status ? 'success' : 'info'" effect="light">{{ s.row.status ? '启用' : '停用' }}</el-tag></template>
                </el-table-column>
                <el-table-column label="备注" min-width="200" align="center" show-overflow-tooltip><template #default="s">{{ dash(s.row.remark) }}</template></el-table-column>
                <el-table-column label="操作" width="232" align="center">
                  <template #default="s">
                    <el-button size="small" plain @click="openDict(s.row)">编辑</el-button>
                    <el-button size="small" plain @click="toggleDict(s.row)">{{ s.row.status ? '停用' : '启用' }}</el-button>
                    <el-button size="small" plain @click="delDict(s.row)">删除</el-button>
                  </template>
                </el-table-column>
              </el-table>
              <div class="lb-pager">
                <el-pagination background layout="total, sizes, prev, pager, next" :total="dictRows.length"
                  v-model:current-page="diPage" v-model:page-size="diSize" :page-sizes="[10, 20, 50]" />
              </div>
            </div>
          </div>

          <el-dialog v-model="dDlg" :title="dform.id ? '编辑字典项' : '新增字典项'" width="480px">
            <el-form label-width="88px">
              <el-form-item label="字典类型">
                <el-select v-model="dform.type" :disabled="!!dform.id" style="width:100%">
                  <el-option v-for="t in dictTypes" :key="t.type" :value="t.type" :label="t.name" />
                </el-select>
              </el-form-item>
              <el-form-item label="名称" required><el-input v-model="dform.label" placeholder="如 神经内科" /></el-form-item>
              <el-form-item label="排序"><el-input-number v-model="dform.sort" :min="1" :max="999" controls-position="right" style="width:120px" /></el-form-item>
              <el-form-item label="备注"><el-input v-model="dform.remark" placeholder="选填" /></el-form-item>
            </el-form>
            <template #footer><el-button @click="dDlg = false">取消</el-button><el-button type="primary" :loading="dSaving" @click="saveDict">确认</el-button></template>
          </el-dialog>

          <el-dialog v-model="tDlg" :title="tform.id ? '编辑字典类型' : '新增字典类型'" width="480px">
            <el-form label-width="88px">
              <el-form-item label="字典名称" required><el-input v-model="tform.name" placeholder="如 康复评定类型" /></el-form-item>
              <el-form-item label="标识" required><el-input v-model="tform.type" :disabled="!!tform.id" placeholder="小写字母开头，如 rehab_type" /></el-form-item>

                <el-checkbox-group v-model="tform.scopes">

              <el-button v-if="tform.id && !tform.builtin" type="danger" plain style="float:left" @click="delType">删除</el-button>
              <el-button @click="tDlg = false">取消</el-button>
              <el-button type="primary" :loading="tSaving" @click="saveType">确认</el-button>
            </template>
          </el-dialog>
        </div>

      </el-main>
    </el-container>
  </el-container>`,
};

const app = createApp(App);
app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
for (const [k, c] of Object.entries(ElementPlusIconsVue)) app.component(k, c);
app.mount("#app");
