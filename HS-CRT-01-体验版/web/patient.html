<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e9f8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>认知功能训练软件</title>
<link rel="stylesheet" href="/common.css"><link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/theme.css">
<script src="/icons.js"></script>
</head><body class="patient">
<div id="app"></div>
<script>
/* ============ 患者端 SPA（对应原型 P1–P6 / SRS FR-P 系列） ============ */
const API = {
  tk: localStorage.getItem("hs_ptk") || "",
  async req(url, opt = {}) {
    const r = await fetch("/api/v1" + url, { ...opt, headers: { "Content-Type": "application/json", Authorization: "Bearer " + this.tk }, body: opt.body ? JSON.stringify(opt.body) : undefined });
    if (r.status === 401) { API.tk = ""; localStorage.removeItem("hs_ptk"); location.hash = "#/login"; throw new Error("未登录或会话已过期"); }
    const j = await r.json();
    if (j.code !== 0) throw new Error(j.message);
    return j.data;
  },
  get: u => API.req(u), post: (u, b) => API.req(u, { method: "POST", body: b }),
};
let ME = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function toast(m, ok) { const t = document.createElement("div"); t.className = "toast " + (ok === false ? "err" : ok === true ? "ok" : ""); t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
const rnd = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function speak(t) { try { const u = new SpeechSynthesisUtterance(t); u.lang = "zh-CN"; u.rate = 0.95; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {} }
/* ---------- H5 外壳 ---------- */
const SHELL = { title: "任务", tab: "tasks", back: "" };
const TIC = {
  tasks: '<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="17" rx="3"/><path d="M8 3.5h8M8 10h8M8 14.5h5"/></svg>',
  records: '<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M6.5 20v-6M12 20V6M17.5 20v-9"/></svg>',
  me: '<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.6 20a7.4 7.4 0 0 1 14.8 0"/></svg>',
};
const TABS = [["#/tasks", "tasks", "任务"], ["#/records", "records", "记录"], ["#/me", "me", "我的"]];
const tabbar = () => `<nav class="h5-tabs">${TABS.map(([h, k, n]) =>
  `<a href="${h}" class="${SHELL.tab === k ? "on" : ""}"><span class="ic">${TIC[k]}</span>${n}</a>`).join("")}</nav>`;
function pad(inner) {
  document.getElementById("app").innerHTML = `<div class="h5">
    <div class="h5-top pbar">
      ${SHELL.back ? `<button class="back" onclick="location.hash='${SHELL.back}'">‹</button>` : ""}
      <div class="hd">
        <span class="ttl" id="ptitle">${esc(SHELL.title)}</span>
        <span class="sub" id="psub"></span>
      </div>
    </div>
    <div class="h5-body" id="pbody">${inner}</div>
    ${tabbar()}
  </div>`;
  return $("#pbody");
}
/* 副标题只放当前进度（如「顺背 5 位」），标题栏居中 */
const setPad = (title, sub) => {
  const t = $("#ptitle"); if (t) t.innerHTML = title;
  const s = $("#psub");
  if (s) s.textContent = sub === undefined ? "" : String(sub).replace(/^[\s　]+/, "").trim();
};

/* ---------- 登录 ---------- */
async function loadMe() {
  const p = await API.get("/my/profile");
  ME = {
    id: p.id, name: p.name, no: p.outpatient_no, acct: p.account, refId: p.id,
    sex: p.sex, dept: p.dept, birth: p.birth_date, edu: p.education,
    guardian: p.guardian, isFamily: p.isFamily, operator: p.operator,
    phone: p.phone || "",
  };
  return ME;
}
async function ssoLogin(ticket) {
  if (!ticket) return loginView("登录码无效，请向医务人员重新获取");
  try {
    const d = await API.post("/auth/ticket-login", { ticket });
    API.tk = d.token; localStorage.setItem("hs_ptk", d.token);
    await loadMe();
    history.replaceState(null, "", "#/tasks");
    tasksView();
  } catch (e) { loginView(e.message); }
}
/* 登录：任务账号 + 密码 */
const REMEMBER_KEY = "hs_remember_patient";
const b64e = (v) => btoa(String.fromCharCode(...new TextEncoder().encode(v)));
const b64d = (v) => { try { return new TextDecoder().decode(Uint8Array.from(atob(v), c => c.charCodeAt(0))); } catch (e) { return ""; } };
const ICO_USER = '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.6 20a7.4 7.4 0 0 1 14.8 0"/></svg>';
const ICO_LOCK = '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4.5" y="10.5" width="15" height="9.5" rx="2.6"/><path d="M8 10.5V7.8a4 4 0 0 1 8 0v2.7"/></svg>';
const ICO_EYE = '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12 18 18.2 12 18.2 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.9"/></svg>';
const ICO_EYE_OFF = '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l16 16"/><path d="M9.6 6.2A9.4 9.4 0 0 1 12 5.8c6 0 9.5 6.2 9.5 6.2a17 17 0 0 1-3.1 3.9"/><path d="M6.3 8.1A17 17 0 0 0 2.5 12S6 18.2 12 18.2a9.2 9.2 0 0 0 3.5-.7"/></svg>';
function loginView(msg = "") {
  let rem = false, u = "", pw = "";
  try {
    const raw = localStorage.getItem(REMEMBER_KEY);
    if (raw) { const o = JSON.parse(raw); if (o && o.u) { u = o.u; pw = b64d(o.p || ""); rem = true; } }
  } catch (e) { }
  document.getElementById("app").innerHTML = `<div class="pt-login">
    <div class="pl-body">
      <div class="pl-logo"><img src="/assets/logo.png" alt=""></div>
      <div class="pl-name">认知功能训练软件</div>
      <div class="pl-field"><span class="ico">${ICO_USER}</span>
        <input id="lu" placeholder="任务账号" autocomplete="username" value="${esc(u)}"></div>
      <div class="pl-field"><span class="ico">${ICO_LOCK}</span>
        <input id="lpw" type="password" placeholder="密码" autocomplete="current-password" value="${esc(pw)}">
        <button class="eye" id="leye" type="button">${ICO_EYE}</button></div>
      <label class="pl-remember"><input type="checkbox" id="lrem" ${rem ? "checked" : ""}><span>记住密码</span></label>
      <button class="pl-btn" id="lgo">登 录</button>
      <div class="pl-err" id="lerr">${esc(msg)}</div>
    </div>
  </div>`;

  let shown = false;
  $("#leye").onclick = () => {
    shown = !shown;
    $("#lpw").type = shown ? "text" : "password";
    $("#leye").innerHTML = shown ? ICO_EYE_OFF : ICO_EYE;
  };
  const submit = async () => {
    const acct = $("#lu").value.trim(), pass = $("#lpw").value;
    if (!acct || !pass) { $("#lerr").textContent = "请输入任务账号与密码"; return; }
    try {
      const d = await API.post("/auth/login", { username: acct, password: pass });
      if (d.user.role !== "patient" && d.user.role !== "family") return toast("请使用患者端登录患者账号", false);
      try {
        if ($("#lrem").checked) localStorage.setItem(REMEMBER_KEY, JSON.stringify({ u: acct, p: b64e(pass) }));
        else localStorage.removeItem(REMEMBER_KEY);
      } catch (e) { }
      API.tk = d.token; localStorage.setItem("hs_ptk", d.token);
      await loadMe();
      location.hash = "#/tasks";
    } catch (e) { $("#lerr").textContent = e.message; }
  };
  $("#lgo").onclick = submit;
  $("#lpw").addEventListener("keyup", e => { if (e.key === "Enter") submit(); });
  // 取消勾选即清除本地记录，与医生端 / 管理端一致
  $("#lrem").addEventListener("change", () => {
    if ($("#lrem").checked) return;
    try { localStorage.removeItem(REMEMBER_KEY); } catch (e) { }
  });
}

/* ---------- 首页：今日任务（P2） ---------- */
async function tasksView() {
  SHELL.title = "今日任务"; SHELL.tab = "tasks"; SHELL.back = "";
  const r = await API.get("/my/tasks");
  const plans = r.planItems || [];
  const today = new Date().toLocaleDateString("zh-CN", { month: "long", day: "numeric", weekday: "long" });
  /* 任务不按天分配：按方案频次给出本周进度，达标后提示但不禁用训练 */
  const wk = r.week || { done: 0, target: 0 };
  const quota = wk.target ? `本周 ${wk.done}/${wk.target} 次` : "";
  const reached = wk.target > 0 && wk.done >= wk.target;

  const row = (code, title, meta, action, hash, primary) => `<div class="pcard ptask">
    <span class="ic">${hsIcon(code)}</span>
    <div class="tx"><b>${title}</b><div class="muted">${meta}</div></div>
    <button class="pbtn ${primary ? "primary " : ""}sm" onclick="location.hash='${hash}'">${action}</button>
  </div>`;

  pad(`
    <div class="pcard" style="display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,#e9f8f5,#f7fbfa);border-color:#d5ece6">
      <div class="avatar">${esc(ME.name[0])}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:16px;font-weight:600">${esc(ME.name)}</div>
        <div class="muted">${today}${quota ? " · " + quota : ""}</div>
      </div>
    </div>

    ${reached ? `<div class="pcard" style="display:flex;align-items:center;gap:9px;padding:11px 14px;background:var(--c-primary-soft);border-color:transparent">
      <span style="display:inline-flex;color:var(--c-primary-active)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.4l2.6 2.6L16 9.6"/></svg></span>
      <span style="font-size:13px;color:var(--c-primary-active);line-height:1.5">本周训练已完成 ${wk.done}/${wk.target} 次，可继续巩固</span>
    </div>` : ""}

    <div class="psec"><span class="si">${hsIcon("CA-01")}</span>训练任务 <span class="cnt">${plans.length ? plans.length + " 项 · 医生方案" : "暂无"}</span></div>
    ${plans.length ? plans.map(t => row(t.program, esc(t.program) + " " + esc(t.name), "第 " + t.level + " 关 · " + esc(t.desc || ""), "开始", `#/train/${t.planId}/${t.program}`, true)).join("")
      : `<div class="pcard" style="text-align:center;padding:18px;color:var(--c-text-3);font-size:13px">暂无训练方案，请等待医生安排</div>`}

    <div class="psec"><span class="si">${hsIcon("LM-02")}</span>我的记录</div>
    ${row("MoCA", "训练记录", "查看完成情况与本周进度", "查看", "#/records")}
  `);
  setPad("今日任务");
}

/* ---------- 我的（H5 第三页签） ---------- */
async function meView() {
  SHELL.title = "我的"; SHELL.tab = "me"; SHELL.back = "";
  const age = ME.birth ? Math.floor((Date.now() - new Date(ME.birth)) / 31557600000) : "";
  pad(`
    <div class="pcard" style="display:flex;align-items:center;gap:12px">
      <div class="avatar">${esc(ME.name[0])}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:17px;font-weight:600">${esc(ME.name)}</div>
        <div class="muted">任务账号 ${esc(ME.acct || ME.no)}</div>
      </div>
      ${ME.isFamily ? `<span style="font-size:11.5px;padding:2px 9px;border-radius:99px;background:var(--c-info-soft);color:var(--c-info);flex-shrink:0">家属代操作</span>` : ""}
    </div>
    ${ME.isFamily ? `<div class="muted" style="margin:-6px 0 10px;font-size:12px">当前由 ${esc(ME.operator)} 代为操作</div>` : ""}
    <div class="pcard" style="padding:4px 14px">
      ${[["性别", ME.sex || "—"], ["年龄", age ? age + " 岁" : "—"], ["教育程度", ME.edu || "—"], ["科室", ME.dept || "—"], ["联系人", ME.guardian || "—"]]
        .map(([k, v]) => `<div style="display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--c-line);font-size:14px">
          <span style="color:var(--c-text-3)">${k}</span><span>${esc(String(v))}</span></div>`).join("")}
      <div style="display:flex;justify-content:space-between;align-items:center;padding:11px 0;font-size:14px">
        <span style="color:var(--c-text-3)">手机号</span>
        <span>${ME.phone ? esc(ME.phone.slice(0, 3) + "****" + ME.phone.slice(-4)) : "—"}</span>
      </div>
    </div>
    <button class="pbtn xl" onclick="logout()" style="color:var(--c-danger);border-color:#f0cfcc">退出登录</button>
  `);
  setPad("我的");
}
function logout() {
  API.tk = ""; localStorage.removeItem("hs_ptk"); ME = null;
  location.hash = "#/login"; loginView();
}

/* ---------- 范式执行（P3/P4 · 12项引擎） ---------- */
const PARA_STATE = {};
async function paraView(recordId, code) {
  const rec = await API.get("/assessments/" + recordId);
  const meta = BANK.paradigms.find(p => p.code === code);
  PARA_STATE.recordId = recordId; PARA_STATE.code = code; PARA_STATE.raw = {};
  SHELL.title = "评估任务"; SHELL.tab = "tasks"; SHELL.back = "#/tasks";
  pad(`<div class="pcard center" style="padding:22px 16px">
      <div class="para-ico">${hsIcon(code)}</div>
      <div style="font-size:18px;font-weight:600">${esc(meta.name)}</div>
      <div style="font-size:13px;color:var(--c-text-2);line-height:1.8">${esc(meta.desc)}<br>约 ${meta.minutes} 分钟</div>
      <button class="pbtn primary xl" id="go">开 始</button>
      <div class="muted">请在医务人员指导下进行；过程中可随时请工作人员帮助</div>
    </div>`);
  setPad("评估任务", "　" + meta.name);
  $("#go").onclick = () => RUNNER[code] ? RUNNER[code]() : toast("该范式即将上线", false);
}
const BANK = { paradigms: null, trainings: null };
async function ensureBanks() { if (!BANK.paradigms) { const b = await API.get("/banks"); BANK.paradigms = b.paradigms; BANK.trainings = b.trainings; } }
const t0 = () => performance.now();
function paraDone() {
  const s = PARA_STATE;
  return API.post(`/assessments/${s.recordId}/paradigm`, { code: s.code, raw: s.raw })
    .then(() => { toast("任务完成，已提交", true); location.hash = "#/tasks"; })
    .catch(e => toast(e.message, false));
}
function resultView(title, lines, onDone) {
  pad(`<div class="pcard center" style="padding:24px 16px">
      <div class="ok-ico"></div>
      <div style="font-size:18px;font-weight:600">${esc(title)}</div>
      ${lines.map(l => `<div style="font-size:14px;color:var(--c-text-2)">${esc(l)}</div>`).join("")}
      <button class="pbtn primary xl" id="fin">完成并提交</button>
    </div>`);
  setPad("任务完成");
  $("#fin").onclick = onDone;
}

/* —— 各范式引擎 —— */
const RUNNER = {
  /* 数字广度 SPAN */
  span() {
    const st = { part: "fwd", len: 3, tries: 0, fwd: 0, bwd: 0, cur: [], input: "" };
    function next() {
      if (st.part === "fwd" && st.len > 9) { st.part = "bwd"; st.len = 3; }
      if (st.part === "bwd" && st.len > 8) return result();
      st.cur = Array.from({ length: st.len }, () => Math.floor(Math.random() * 10));
      st.input = "";
      const box = pad(`<div class="pcard center"><div class="muted">${st.part === "fwd" ? "请按顺序记住并输入数字" : "请【倒着】输入刚才的数字"}</div>
        <div class="stim" id="dg">·</div><div id="kb"></div></div>`);
      setPad("数字广度", `　${st.part === "fwd" ? "顺背" : "倒背"} ${st.len} 位`);
      let i = 0;
      const show = () => {
        if (i >= st.cur.length) { speak(""); return input(); }
        $("#dg").textContent = st.cur[i]; speak(String(st.cur[i]));
        i++; setTimeout(() => { $("#dg").textContent = "·"; setTimeout(show, 350); }, 700);
      };
      setTimeout(show, 500);
    }
    function input() {
      const kb = $("#kb");
      kb.innerHTML = `<div class="stim" style="font-size:34px;letter-spacing:6px" id="inp">${st.input || "　"}</div>
        <div class="row">${[1, 2, 3, 4, 5, 6, 7, 8, 9, 0].map(n => `<button class="pbtn sm" data-k="${n}">${n}</button>`).join("")}</div>
        <div class="row"><button class="pbtn sm" id="del">删除</button><button class="pbtn primary" id="ok2">确定</button></div>`;
      kb.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { st.input += b.dataset.k; $("#inp").textContent = st.input; });
      $("#del").onclick = () => { st.input = st.input.slice(0, -1); $("#inp").textContent = st.input || "　"; };
      $("#ok2").onclick = () => {
        const target = st.part === "fwd" ? st.cur.join("") : [...st.cur].reverse().join("");
        const right = st.input === target;
        st.tries++;
        if (right) { st[st.part] = Math.max(st[st.part], st.len); }
        if (st.tries >= 2) {
          if (!right) { // 两位均错 → 结束本部分
            if (st.part === "fwd") { st.part = "bwd"; st.len = 3; } else return result();
            st.len = right ? st.len + 1 : st.len; st.tries = 0; next(); return;
          }
          st.len++; st.tries = 0;
        }
        next();
      };
    }
    function result() {
      PARA_STATE.raw = { fwd: st.fwd, bwd: st.bwd };
      resultView("数字广度完成", [`顺背广度：${st.fwd} 位`, `倒背广度：${st.bwd} 位`], paraDone);
    }
    next();
  },
  /* 持续操作 CPT */
  cpt() {
    const cfg = { isi: 1100, trials: 60, targetRatio: 0.25 };
    const letters = "BBFKLMMTX".split("");
    let i = 0, targets = 0, hits = 0, rts = [], missed = 0, shown = null, shownAt = 0, answered = false;
    pad(`<div class="pcard center"><div class="muted">看到 <b style="color:#dc2626">X</b> 就尽快点击按钮，其他字母不要点</div>
      <div class="stim" id="s">·</div><button class="pbtn primary xl" id="hit" style="min-width:280px">看 到 X 按 我</button></div>`);
    setPad("信号捕捉");
    $("#hit").onclick = () => {
      if (shown === "X" && !answered) { hits++; rts.push(performance.now() - shownAt); answered = true; $("#s").style.background = "#dcfce7"; }
    };
    const loop = () => {
      if (i >= cfg.trials) {
        PARA_STATE.raw = { hits, targets, avgRt: rts.length ? rts.reduce((a, b) => a + b) / rts.length : 0, missed };
        return resultView("信号捕捉完成", [`命中 ${hits}/${targets}`, `漏报 ${missed}`, `平均反应时 ${Math.round(PARA_STATE.raw.avgRt)}ms`], paraDone);
      }
      shown = Math.random() < cfg.targetRatio ? "X" : rnd(letters.filter(l => l !== "X"));
      if (shown === "X") targets++;
      answered = false; $("#s").style.background = "#fff"; $("#s").textContent = shown; shownAt = performance.now();
      setTimeout(() => {
        if (shown === "X" && !answered) { missed++; $("#s").style.background = "#fee2e2"; }
        i++; setTimeout(loop, 150);
      }, 900);
    };
    setTimeout(loop, 800);
  },
  /* 符号数字 SDMT */
  sdmt() {
    const pairs = [["◆", 1], ["●", 2], ["▲", 3], ["■", 4], ["★", 5], ["✚", 6], ["⊙", 7], ["◇", 8], ["♠", 9]];
    const seq = Array.from({ length: 60 }, () => rnd(pairs)[0]);
    let idx = 0, count = 0; const start = performance.now();
    pad(`<div class="pcard center"><div class="row" style="justify-content:center;gap:8px;font-size:22px">${pairs.map(p => `<span>${p[0]}=${p[1]}</span>`).join("　")}</div>
      <div class="stim" id="s">·</div><div class="row" id="pad"></div><div class="muted" id="tm"></div></div>`);
    setPad("符号配对");
    $("#pad").innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button class="pbtn" data-d="${n}" style="width:70px">${n}</button>`).join("");
    const timer = setInterval(() => {
      const left = 90 - Math.floor((performance.now() - start) / 1000);
      $("#tm").textContent = "剩余 " + left + " 秒 · 已正确 " + count;
      if (left <= 0) {
        clearInterval(timer); PARA_STATE.raw = { count };
        resultView("符号配对完成", [`90秒正确配对数：${count}`], paraDone);
      }
    }, 500);

    const move = e => { if (!drawing) return; cur.push(pos(e)); const p = cur; ctx.beginPath(); ctx.moveTo(...p[p.length - 2]); ctx.lineTo(...p[p.length - 1]); ctx.stroke(); e.preventDefault(); };
    const end = () => { drawing = false; strokes = allStrokes.filter(s => s.length > 2).length; };
    cv.onpointerdown = start; cv.onpointermove = move; cv.onpointerup = end; cv.onpointerleave = end;
    $("#undo").onclick = () => { allStrokes.pop(); redraw(); };
    $("#clr").onclick = () => { allStrokes.length = 0; redraw(); };
    function redraw() { ctx.clearRect(0, 0, cv.width, cv.height); for (const s of allStrokes) { ctx.beginPath(); s.forEach((p, i) => i ? ctx.lineTo(...p) : ctx.moveTo(...p)); ctx.stroke(); } strokes = allStrokes.filter(s => s.length > 2).length; }
    $("#fin2").onclick = () => {
      PARA_STATE.raw = { score: 0, max: cfg.items, reviewed: false, strokes };
      resultView("作答已保存", ["您的作答已提交，医生将进行要素复核评分。"], paraDone);
    };
  },
};

  if (v === "sso") return ssoLogin(qs.get("t"));
  if (v === "login" || !API.tk) return loginView();
  // 离开训练页时作废引擎会话，避免旧定时器继续操作已移除的节点
  if (v !== "train" && window.Games && Games.stop) Games.stop();
  try {
    if (!ME) await loadMe();
    if (v === "tasks" || v === "" || v === "welcome") tasksView();
    else if (v === "records" || v === "report") recordsView();
    else if (v === "me") meView();
    else if (v === "para") { await ensureBanks(); paraView(+a, b); }
    else if (v === "train") trainView(+a, b);
    else tasksView();
  } catch (e) { toast(e.message, false); }
}
route();
</script>
<script src="/games.js"></script>
</body></html>
